<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORGE — Gym Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14130F;
  --surface:#1E1C17;
  --surface-2:#26241D;
  --border: rgba(245,243,238,0.10);
  --border-strong: rgba(245,243,238,0.18);
  --text: #F5F3EE;
  --text-secondary:#A7A296;
  --text-muted:#6E6A5F;
  --accent:#FF5A1F;
  --accent-text:#FFD9C6;
  --accent-bg: rgba(255,90,31,0.14);
  --recovery:#2BB3A3;
  --recovery-text:#B7ECE5;
  --recovery-bg: rgba(43,179,163,0.14);
  --danger:#E4574B;
  --nav-bg:rgba(20,19,15,0.92);
  --grid-line:rgba(245,243,238,0.05);
  color-scheme:dark;
  --radius:16px;
  --font-head: 'Barlow Condensed', 'Inter', sans-serif;
  --font-body: 'Inter', sans-serif;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  display:flex;
  justify-content:center;
  min-height:100vh;
}
.shell{
  width:100%;
  max-width:440px;
  min-height:100%;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  border-left:0.5px solid var(--border);
  border-right:0.5px solid var(--border);
}
.topbar{
  padding:20px 20px 14px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
}
.topbar .brand{
  font-family:var(--font-head);
  font-weight:700;
  font-size:22px;
  letter-spacing:0.5px;
}
.topbar .brand span{color:var(--accent);}
.topbar .streak{
  font-size:13px;
  color:var(--text-secondary);
}
main{
  flex:1;
  padding:4px 20px 100px;
}
.screen{display:none;}
.screen.active{display:block;}
h1.page-title{
  font-family:var(--font-head);
  font-weight:600;
  font-size:32px;
  margin:6px 0 4px;
  letter-spacing:0.3px;
}
p.page-sub{
  color:var(--text-secondary);
  font-size:14px;
  margin:0 0 20px;
  line-height:1.5;
}
.segment{
  display:flex;
  gap:6px;
  background:var(--surface);
  border-radius:12px;
  padding:4px;
  margin-bottom:18px;
  border:0.5px solid var(--border);
}
.segment button{
  flex:1;
  border:none;
  background:transparent;
  color:var(--text-secondary);
  font-family:var(--font-body);
  font-size:14px;
  font-weight:500;
  padding:9px 0;
  border-radius:9px;
  cursor:pointer;
}
.segment button.active{
  background:var(--accent);
  color:#1B0A03;
  font-weight:600;
}
.card{
  background:var(--surface);
  border:0.5px solid var(--border);
  border-radius:var(--radius);
  padding:16px 18px;
  margin-bottom:14px;
}
.card-title{
  font-size:15px;
  font-weight:600;
  margin:0 0 2px;
}
.card-sub{
  font-size:13px;
  color:var(--text-secondary);
  margin:0 0 12px;
}
.exercise-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 0;
  border-top:0.5px solid var(--border);
}
.exercise-row:first-of-type{border-top:none;}
.exercise-num{
  font-family:var(--font-head);
  font-size:20px;
  color:var(--text-muted);
  width:22px;
}
.exercise-info{flex:1;}
.exercise-name{font-size:14px; font-weight:500;}
.exercise-meta{font-size:12px; color:var(--text-secondary); margin-top:2px;}
.remove-btn{
  background:none;
  border:none;
  color:var(--text-muted);
  font-size:18px;
  cursor:pointer;
  padding:4px 6px;
}
.add-exercise-form{
  display:grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.add-exercise-form input{
  grid-column:span 1;
}
.add-exercise-form .name-field{grid-column: 1 / -1;}
input, select{
  width:100%;
  height:38px;
  background:var(--surface-2);
  border:0.5px solid var(--border-strong);
  border-radius:9px;
  color:var(--text);
  font-family:var(--font-body);
  font-size:13px;
  padding:0 10px;
}
input::placeholder{color:var(--text-muted);}
label.field-label{
  font-size:12px;
  color:var(--text-secondary);
  display:block;
  margin:0 0 5px;
}
.btn{
  height:42px;
  border-radius:10px;
  border:0.5px solid var(--border-strong);
  background:var(--surface-2);
  color:var(--text);
  font-family:var(--font-body);
  font-weight:500;
  font-size:14px;
  cursor:pointer;
  width:100%;
}
.btn-accent{
  background:var(--accent);
  color:#1B0A03;
  border:none;
  font-weight:600;
}
.btn-ghost{
  background:transparent;
}
.btn-sm{
  height:32px;
  font-size:12px;
  padding:0 12px;
  width:auto;
}
.muscle-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-top:0.5px solid var(--border);
}
.muscle-row:first-of-type{border-top:none;}
.muscle-name{
  width:84px;
  font-size:13px;
  font-weight:500;
}
.muscle-bar-track{
  flex:1;
  height:6px;
  border-radius:3px;
  background:var(--surface-2);
  overflow:hidden;
}
.muscle-bar-fill{
  height:100%;
  border-radius:3px;
}
.muscle-status{
  width:96px;
  text-align:right;
  font-size:12px;
  color:var(--text-secondary);
}
.stat-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-bottom:14px;
}
.stat-card{
  background:var(--surface);
  border-radius:var(--radius);
  padding:14px 16px;
  border:0.5px solid var(--border);
}
.stat-label{font-size:12px; color:var(--text-secondary); margin:0 0 4px;}
.stat-value{font-family:var(--font-head); font-size:26px; font-weight:600; margin:0;}
.stat-value small{font-family:var(--font-body); font-size:13px; color:var(--text-secondary); font-weight:400;}
.calc-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:12px;
}
.work-camera{
  position:relative;
  aspect-ratio: 3 / 4;
  background:
    linear-gradient(var(--surface-2), var(--surface-2));
  border-radius:20px;
  border:0.5px solid var(--border-strong);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:16px;
}
.work-camera .grid-overlay{
  position:absolute; inset:0;
  background-image:
    linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
  background-size: 12.5% 12.5%;
}
.work-camera .skeleton-placeholder{
  color:var(--text-muted);
  text-align:center;
  padding:0 30px;
}
.work-camera .skeleton-placeholder i{
  font-size:40px;
  display:block;
  margin:0 auto 10px;
}
.corner{
  position:absolute;
  width:22px; height:22px;
  border-color:var(--accent);
  border-style:solid;
}
.corner.tl{top:14px; left:14px; border-width:2px 0 0 2px; border-radius:4px 0 0 0;}
.corner.tr{top:14px; right:14px; border-width:2px 2px 0 0; border-radius:0 4px 0 0;}
.corner.bl{bottom:14px; left:14px; border-width:0 0 2px 2px; border-radius:0 0 0 4px;}
.corner.br{bottom:14px; right:14px; border-width:0 2px 2px 0; border-radius:0 0 4px 0;}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  padding:4px 10px;
  border-radius:20px;
  background:var(--surface-2);
  color:var(--text-secondary);
  border:0.5px solid var(--border-strong);
}
.badge-dot{width:6px; height:6px; border-radius:50%; background:var(--text-muted);}
.chat-toggle{
  display:flex;
  gap:6px;
  margin-bottom:16px;
}
.chip{
  padding:8px 14px;
  border-radius:20px;
  border:0.5px solid var(--border-strong);
  font-size:13px;
  background:var(--surface);
  color:var(--text-secondary);
}
.chip.active{
  background:var(--accent-bg);
  border-color:var(--accent);
  color:var(--accent-text);
}
.chat-bubble{
  max-width:78%;
  padding:10px 14px;
  border-radius:14px;
  font-size:13.5px;
  line-height:1.5;
  margin-bottom:10px;
}
.chat-bubble.them{
  background:var(--surface);
  border:0.5px solid var(--border);
  border-bottom-left-radius:4px;
}
.chat-bubble.me{
  background:var(--accent);
  color:#1B0A03;
  margin-left:auto;
  border-bottom-right-radius:4px;
}
.chat-input-row{
  display:flex;
  gap:8px;
  margin-top:14px;
}
.settings-list .settings-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-top:0.5px solid var(--border);
  color:var(--text-secondary);
}
.settings-list .settings-item:first-child{border-top:none;}
.settings-item i{font-size:18px; width:20px; text-align:center;}
.settings-item span{flex:1; font-size:14px; color:var(--text);}
.coming-soon-tag{
  font-size:11px;
  color:var(--text-muted);
  border:0.5px solid var(--border-strong);
  padding:2px 8px;
  border-radius:8px;
}
.empty-hint{
  font-size:12px;
  color:var(--text-muted);
  text-align:center;
  padding:18px 0 4px;
}
nav.bottombar{
  position:sticky;
  bottom:0;
  left:0; right:0;
  background:var(--nav-bg);
  backdrop-filter:blur(6px);
  border-top:0.5px solid var(--border);
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  padding:8px 14px calc(10px + env(safe-area-inset-bottom, 0px));
}
.nav-item{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  background:none;
  border:none;
  color:var(--text-muted);
  font-family:var(--font-body);
  font-size:10.5px;
  cursor:pointer;
  padding:4px 0;
}
.nav-item i{font-size:19px;}
.nav-item.active{color:var(--text);}
.nav-item.active i{color:var(--accent);}
.nav-item.work-btn{
  flex:0 0 64px;
  margin-top:-26px;
}
.nav-item.work-btn .work-circle{
  width:56px; height:56px;
  border-radius:50%;
  background:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  border:4px solid var(--bg);
  margin-bottom:2px;
}
.nav-item.work-btn .work-circle i{font-size:22px; color:#1B0A03;}
.nav-item.work-btn span{color:var(--text-secondary);}
.sr-only{
  position:absolute; width:1px; height:1px;
  padding:0; margin:-1px; overflow:hidden;
  clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

.set-head{display:flex; align-items:center; gap:10px; margin-bottom:2px;}
.set-head .card-title{margin:0;}
.set-head i{color:var(--accent); display:flex;}
.set-field{margin-bottom:12px;}
.switch{
  flex:none; width:44px; height:26px; border-radius:13px;
  border:0.5px solid var(--border-strong); background:var(--surface-2);
  position:relative; cursor:pointer; padding:0;
}
.switch::after{
  content:''; position:absolute; top:2px; left:2px; width:20px; height:20px;
  border-radius:50%; background:var(--text-secondary); transition:transform .15s;
}
.switch[aria-checked="true"]{background:var(--accent); border-color:var(--accent);}
.switch[aria-checked="true"]::after{transform:translateX(18px); background:#1B0A03;}
.settings-item input[type="time"]{width:112px; flex:none;}
.btn-danger{color:var(--danger); border-color:rgba(228,87,75,0.45);}
.set-msg{font-size:12px; margin:8px 0 0; min-height:16px; color:var(--recovery-text);}
.set-msg.err{color:var(--danger);}
.about-row{display:flex; justify-content:space-between; font-size:13px; padding:8px 0; border-top:0.5px solid var(--border); color:var(--text-secondary);}
.about-row:first-of-type{border-top:none;}
.about-row b{font-weight:500; color:var(--text);}
#hello{display:inline-block; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom;}
#hello:not(:empty)::after{content:' · ';}
.toast{
  position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  background:var(--surface-2); color:var(--text); border:0.5px solid var(--border-strong);
  padding:10px 16px; border-radius:12px; font-size:13px; max-width:90%;
  opacity:0; pointer-events:none; transition:opacity .2s; z-index:50;
}
.toast.show{opacity:1;}

[hidden]{display:none !important;}
.menu-list{padding:2px 16px;}
.menu-item,.opt-row{
  display:flex; align-items:center; gap:14px; width:100%;
  background:none; border:none; border-top:0.5px solid var(--border);
  color:var(--text); padding:14px 0; text-align:left; cursor:pointer;
  font-family:var(--font-body);
}
.menu-item:first-child,.opt-row:first-child{border-top:none;}
.mi-icon{color:var(--text-secondary); display:flex; width:22px; justify-content:center; flex:none;}
.mi-text{flex:1; min-width:0;}
.mi-text b{display:block; font-size:15px; font-weight:600;}
.mi-text small{display:block; font-size:12.5px; color:var(--text-secondary); margin-top:2px;}
.chev{color:var(--text-muted); display:flex; flex:none;}
.opt-row span{flex:1; font-size:15px;}
.opt-row[aria-checked="true"]::after{content:'\2713'; color:var(--accent); font-size:16px; font-weight:700;}
.back-btn{
  display:inline-flex; align-items:center; gap:6px; background:none; border:none;
  color:var(--text-secondary); font-family:var(--font-body); font-size:13px;
  padding:4px 0 10px; cursor:pointer;
}
.row-text{flex:1; min-width:0;}
.row-text b{display:block; font-size:14px; font-weight:500; color:var(--text);}
.row-text small{display:block; font-size:12px; margin-top:2px;}
.settings-item select{width:112px; flex:none;}
.danger-zone{margin-top:48px; padding-top:20px; border-top:0.5px dashed var(--border-strong);}
.btn-danger-solid{background:var(--danger); color:#fff; border:none; font-weight:600;}
.ftin{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.latest-tag{font-size:11px; color:var(--recovery-text); background:var(--recovery-bg); padding:2px 8px; border-radius:8px; margin-left:6px; font-weight:500;}
.faq-card{padding:4px 16px;}
.faq-card details{border-top:0.5px solid var(--border);}
.faq-card details:first-child{border-top:none;}
.faq-card summary{padding:14px 0; font-size:15px; font-weight:600; cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center;}
.faq-card summary::-webkit-details-marker{display:none;}
.faq-card summary::after{content:'+'; color:var(--text-muted); font-size:18px;}
.faq-card details[open] summary::after{content:'\2212';}
.faq-body{padding:0 0 14px; font-size:13px; color:var(--text-secondary); line-height:1.55;}
.faq-body ul{margin:0 0 10px; padding-left:18px;}
.faq-body li{margin-bottom:6px;}
.qa{margin-bottom:12px;}
.qa b{display:block; color:var(--text); font-weight:500; margin-bottom:2px;}
.qa p{margin:0;}
#rest-display{font-family:var(--font-head); font-size:44px; font-weight:600; text-align:center; margin:6px 0 12px;}

:root[data-theme="light"]{
  --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#EFEDE6;
  --border:rgba(20,19,15,0.10); --border-strong:rgba(20,19,15,0.20);
  --text:#1B1A16; --text-secondary:#5E5A50; --text-muted:#8D887B;
  --recovery:#178F81; --recovery-text:#0E6B60; --recovery-bg:rgba(23,143,129,0.12);
  --danger:#C9382C;
  --nav-bg:rgba(246,244,239,0.92); --grid-line:rgba(20,19,15,0.07);
  color-scheme:light;
}
.swatches{display:flex; gap:12px; margin:12px 0 22px;}
.swatch{width:36px; height:36px; border-radius:50%; border:2px solid transparent; padding:0; cursor:pointer; outline-offset:2px;}
.swatch[aria-checked="true"]{border-color:var(--text); box-shadow:inset 0 0 0 3px var(--bg);}

.auth-btn{
  display:flex; align-items:center; justify-content:center; gap:12px; width:100%; min-height:48px;
  padding:0 16px; border-radius:12px; border:0.5px solid var(--border-strong);
  background:var(--surface-2); color:var(--text); font-family:var(--font-body);
  font-size:15px; font-weight:500; cursor:pointer;
}
.auth-btn:active{transform:scale(0.99);}
.auth-btn .ic{display:flex;}
.auth-btn .ic svg{width:20px; height:20px;}
.or-divider{display:flex; align-items:center; gap:12px; margin:14px 0; color:var(--text-muted); font-size:12px;}
.or-divider::before,.or-divider::after{content:''; flex:1; height:0.5px; background:var(--border-strong);}
#auth-email-form{margin-top:16px;}
.acc-id{display:flex; align-items:center; gap:14px;}
.acc-id .row-text b{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px;}
.avatar{
  width:46px; height:46px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); border:0.5px solid var(--border-strong); color:var(--text);
}
.avatar svg{width:22px; height:22px;}
.avatar.google{background:#FFFFFF;}
</style>
</head>
<body>
<h2 class="sr-only" data-i18n="srTitle"></h2>
<div class="shell">

  <div class="topbar">
    <div class="brand">FORGE<span>.</span></div>
    <div class="streak"><span id="hello"></span><i class="ic" data-ic="flame"></i> <span data-i18n="streak">4 วันติด</span></div>
  </div>

  <main>

    <!-- PLAN -->
    <section class="screen active" id="screen-plan">
      <h1 class="page-title" data-i18n="plan.title">แผนของคุณ</h1>
      <p class="page-sub" data-i18n="plan.sub"></p>

      <div class="segment" id="plan-segment">
        <button class="active" data-plan="gym" data-i18n="plan.gym">ยิม</button>
        <button data-plan="cardio" data-i18n="plan.cardio">คาร์ดิโอ</button>
        <button data-plan="yoga" data-i18n="plan.yoga">โยคะ</button>
      </div>

      <div id="plan-body"></div>
    </section>

    <!-- BODY -->
    <section class="screen" id="screen-body">
      <h1 class="page-title" data-i18n="body.title">ร่างกาย</h1>
      <p class="page-sub" data-i18n="body.sub"></p>

      <div class="card">
        <p class="card-title" data-i18n="body.recTitle"></p>
        <p class="card-sub" data-i18n="body.recSub"></p>
        <div id="muscle-list"></div>
      </div>

      <div class="card">
        <p class="card-title" data-i18n="calc.title"></p>
        <p class="card-sub" data-i18n="calc.sub"></p>
        <div class="calc-grid">
          <div>
            <label class="field-label" data-i18n="f.gender"></label>
            <select id="calc-gender">
              <option value="male" data-i18n="male"></option>
              <option value="female" data-i18n="female"></option>
            </select>
          </div>
          <div>
            <label class="field-label" data-i18n="f.age"></label>
            <input id="calc-age" type="number" value="28" min="10" max="90">
          </div>
          <div>
            <label class="field-label" id="calc-weight-label"></label>
            <input id="calc-weight" type="number" value="68" min="30" max="200">
          </div>
          <div>
            <label class="field-label" id="calc-height-label"></label>
            <input id="calc-height" type="number" value="172" min="120" max="230">
            <div class="ftin" id="calc-ftin" hidden>
              <input id="calc-ft" type="number" min="3" max="7" data-i18n-ph="f.ft">
              <input id="calc-in" type="number" min="0" max="11" data-i18n-ph="f.in">
            </div>
          </div>
        </div>
        <label class="field-label" data-i18n="f.activity"></label>
        <select id="calc-activity" style="margin-bottom:14px;">
          <option value="1.2" data-i18n="act.1.2"></option>
          <option value="1.375" data-i18n="act.1.375"></option>

      return Object.assign(freshDefaults(), saved);

}

const toDisp = kg => Math.round((S.unit === 'lb' ? kg * LB_PER_KG : kg) * 10) / 10;
const fromDisp = v => S.unit === 'lb' ? v / LB_PER_KG : v;
function cmToFtIn(cm){
  const tot = Math.round(cm / CM_PER_IN);
  return {ft: Math.floor(tot / 12), inch: tot % 12};
}
function setHeight(prefix, cm){
  if(S.hUnit === 'cm'){ $(prefix+'-height').value = Math.round(cm); }
  else { const f = cmToFtIn(cm); $(prefix+'-ft').value = f.ft; $(prefix+'-in').value = f.inch; }
}
function getHeightCm(prefix){
  if(S.hUnit === 'cm') return parseFloat($(prefix+'-height').value);
  const ft = parseFloat($(prefix+'-ft').value) || 0, inch = parseFloat($(prefix+'-in').value) || 0;
  return (ft * 12 + inch) * CM_PER_IN;
}
function heightRangeText(){
  if(S.hUnit === 'cm') return `120–230 ${t('u.cm')}`;
  const a = cmToFtIn(120), b = cmToFtIn(230);
  return `${a.ft}'${a.inch}" – ${b.ft}'${b.inch}"`;
}

/* ---------- BODY tab: muscle recovery ---------- */
const REST_HOURS = 48;
const muscles = [
  {k:'m.chest', lastTrained: Date.now() - 40*3600*1000},
  {k:'m.back', lastTrained: Date.now() - 10*3600*1000},
  {k:'m.legs', lastTrained: Date.now() - 60*3600*1000},
  {k:'m.shoulders', lastTrained: Date.now() - 5*3600*1000},
  {k:'m.arms', lastTrained: Date.now() - 30*3600*1000}
];
function renderMuscles(){
  const wrap = $('muscle-list');
  wrap.innerHTML = muscles.map((m,i)=>{
    const hoursSince = (Date.now() - m.lastTrained) / 3600000;
    const pct = Math.max(0, Math.min(100, (hoursSince / REST_HOURS) * 100));
    const recovered = pct >= 100;
    const hoursLeft = Math.max(0, REST_HOURS - hoursSince);
    const color = recovered ? 'var(--recovery)' : 'var(--accent)';
    const statusText = recovered ? t('m.ready') : t('m.left', {h:hoursLeft.toFixed(0)});
    return `
      <div class="muscle-row">
        <div class="muscle-name">${t(m.k)}</div>
        <div class="muscle-bar-track"><div class="muscle-bar-fill" style="width:${pct}%; background:${color};"></div></div>
        <div class="muscle-status" style="color:${recovered?'var(--recovery-text)':'var(--text-secondary)'}">${statusText}</div>
      </div>
      <button class="btn btn-ghost btn-sm" style="margin:6px 0 4px; width:100%;" data-train="${i}">${t('m.train', {m:t(m.k)})}</button>
    `;
  }).join('');
  wrap.querySelectorAll('[data-train]').forEach(b=>{
    b.addEventListener('click', ()=>{
      muscles[parseInt(b.getAttribute('data-train'))].lastTrained = Date.now();
      renderMuscles();
    });
  });
}
setInterval(renderMuscles, 60000);

/* ---------- BODY tab: TDEE calculator ---------- */
function calcTDEE(){
  const gender = $('calc-gender').value;
  const age = parseFloat($('calc-age').value) || 0;
  const weight = fromDisp(parseFloat($('calc-weight').value) || 0);
  const height = getHeightCm('calc') || 0;
  const activity = parseFloat($('calc-activity').value) || 1.2;
  let bmr = 10*weight + 6.25*height - 5*age + (gender === 'male' ? 5 : -161);
  bmr = Math.max(0, bmr);
  const tdee = bmr * activity;
  $('bmr-out').innerHTML = `${Math.round(bmr).toLocaleString()} <small>kcal</small>`;
  $('tdee-out').innerHTML = `${Math.round(tdee).toLocaleString()} <small>kcal</small>`;
  const gf = {lose:0.85, gain:1.10, maintain:1}[S.goal] || 1;
  $('goal-out').textContent = t('goal.out', {g:t('goal.' + S.goal), k:Math.round(tdee * gf).toLocaleString()});
}
['calc-gender','calc-age','calc-weight','calc-height','calc-ft','calc-in','calc-activity'].forEach(id=>{
  $(id).addEventListener('input', calcTDEE);
  $(id).addEventListener('change', calcTDEE);
});

/* rest timer */
let restEnd = 0, restTick = null;
const fmtClock = s => Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
function restRefresh(){
  $('rest-sub').textContent = t('rest.sub', {d:fmtClock(S.restSec)});
  if(!restEnd) $('rest-display').textContent = fmtClock(S.restSec);
}
function restUpdate(){
  const left = Math.ceil((restEnd - Date.now()) / 1000);
  if(left <= 0){
    clearInterval(restTick); restEnd = 0;
    $('rest-display').textContent = t('rest.done');
    try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
    if(S.restOn) notify(t('n.restTitle'), t('n.restBody')); else toast(t('rest.done'));
    return;
  }
  $('rest-display').textContent = fmtClock(left);
}
$('rest-start').addEventListener('click', ()=>{
  restEnd = Date.now() + S.restSec * 1000;
  clearInterval(restTick);
  restTick = setInterval(restUpdate, 250);
  restUpdate();
});
$('rest-reset').addEventListener('click', ()=>{ clearInterval(restTick); restEnd = 0; restRefresh(); });

/* ---------- SETTINGS: notifications ---------- */
function refreshSwitches(){
  $('sw-remind').setAttribute('aria-checked', S.remindOn);
  $('sw-rest').setAttribute('aria-checked', S.restOn);
  $('sw-recover').setAttribute('aria-checked', S.recoverOn);
  $('set-remind-time').value = S.remindTime;
  $('set-rest').value = String(S.restSec);
  syncControls();
}
function requestNotifPermission(){
  if(!('Notification' in window)) return Promise.resolve('unsupported');
  if(Notification.permission === 'granted' || Notification.permission === 'denied') return Promise.resolve(Notification.permission);
  try{
    return Promise.resolve(Notification.requestPermission()).then(p => p || Notification.permission);
  }catch(e){ return Promise.resolve('unsupported'); }
}
function notify(title, body){
  try{
    if('Notification' in window && Notification.permission === 'granted'){
      new Notification(title, {body});
      return;
    }
  }catch(e){}
  toast(title + ' — ' + body);
}
async function setNotifToggle(key, on){
  if(on){
    const perm = await requestNotifPermission();
    if(perm !== 'granted'){
      S[key] = false; refreshSwitches();
      $('notif-hint').textContent = perm === 'unsupported' ? t('n.unsupported') : t('n.denied');
      return;
    }
    $('notif-hint').textContent = t('n.hint');
  }
  S[key] = on;
  saveSettings(); refreshSwitches();
  if(key === 'recoverOn' && on) markRecovered();
}
$('sw-remind').addEventListener('click', ()=>setNotifToggle('remindOn', !S.remindOn));
$('sw-rest').addEventListener('click', ()=>setNotifToggle('restOn', !S.restOn));
$('sw-recover').addEventListener('click', ()=>setNotifToggle('recoverOn', !S.recoverOn));
$('set-remind-time').addEventListener('change', (e)=>{
  if(!e.target.value){ e.target.value = S.remindTime; return; }
  S.remindTime = e.target.value; S.lastRemindDate = '';
  saveSettings();
});
$('set-rest').addEventListener('change', (e)=>{
  S.restSec = parseInt(e.target.value) || 90;
  saveSettings(); restRefresh();
});
$('test-notif').addEventListener('click', async ()=>{
  const perm = await requestNotifPermission();
  if(perm === 'granted') notify('FORGE', t('n.ok'));
  else toast(perm === 'unsupported' ? t('n.unsupported') : t('n.denied'));
});

const recoverSeen = new Set();
const muscleKey = m => m.k + '|' + m.lastTrained;
function markRecovered(){
  muscles.forEach(m=>{
    if((Date.now() - m.lastTrained) / 3600000 >= REST_HOURS) recoverSeen.add(muscleKey(m));
  });
}
function checkNotifications(){
  if(S.recoverOn){
    muscles.forEach(m=>{
      const key = muscleKey(m);
      if((Date.now() - m.lastTrained) / 3600000 >= REST_HOURS && !recoverSeen.has(key)){
        recoverSeen.add(key);
        notify(t('n.recTitle'), t('n.recBody', {m:t(m.k), h:REST_HOURS}));
      }
    });
  }
  if(S.remindOn && S.remindTime){
    const now = new Date();
    const [hh, mm] = S.remindTime.split(':').map(Number);
    const diff = now.getHours() * 60 + now.getMinutes() - (hh * 60 + mm);
    const today = now.toDateString();
    if(diff >= 0 && diff < 15 && S.lastRemindDate !== today){
      S.lastRemindDate = today; saveSettings();
      notify(t('n.workoutTitle'), t('n.workoutBody'));
    }
  }
}
markRecovered();
setInterval(checkNotifications, 30000);

/* ---------- SETTINGS: connected devices (Web Bluetooth, heart-rate service) ---------- */
let btDevice = null;
function renderDevices(){
  const list = $('dev-list');
  const name = btDevice ? (btDevice.name || t('dev.generic')) : S.lastDevice;
  if(!name){
    list.innerHTML = `<p class="empty-hint" style="padding:6px 0 14px;">${t('dev.empty')}</p>`;
  }else{
    const on = !!(btDevice && btDevice.gatt && btDevice.gatt.connected);
    list.innerHTML = `
      <div class="settings-list" style="margin-bottom:12px;">
        <div class="settings-item">
          <i class="ic" data-ic="watch"></i>
          <div class="row-text"><b>${esc(name)}</b><small style="color:${on ? 'var(--recovery-text)' : 'var(--text-secondary)'}">${on ? t('dev.connected') : t('dev.disconnected')}</small></div>
          <button class="btn btn-ghost btn-sm" id="dev-toggle">${on ? t('dev.disconnect') : t('dev.connect')}</button>
        </div>
      </div>`;
    paintIcons(list);
  }
  $('dev-add').hidden = !!name;
}
async function pairDevice(){
  if(!navigator.bluetooth){ msg('dev-msg', t('dev.unsupported'), true); return; }
  try{
    const dev = await navigator.bluetooth.requestDevice({filters:[{services:['heart_rate']}]});
    dev.addEventListener('gattserverdisconnected', renderDevices);
    btDevice = dev;
    S.lastDevice = dev.name || t('dev.generic');
    saveSettings();
    msg('dev-msg', '', false);
    await dev.gatt.connect();
  }catch(e){
    msg('dev-msg', (e && e.name === 'NotFoundError') ? t('dev.cancelled') : t('dev.failed'), true);
  }
  renderDevices();
}
$('dev-add').addEventListener('click', pairDevice);
$('dev-list').addEventListener('click', async (e)=>{
  if(!e.target.closest('#dev-toggle')) return;

/* ---------- SETTINGS: subscription (demo; no real billing) ---------- */
let subPick = 'monthly', cancelArmed = false, cancelTimer;
function addPeriod(date, plan){
  const d = new Date(date);
  if(plan === 'yearly') d.setFullYear(d.getFullYear() + 1); else d.setMonth(d.getMonth() + 1);
  return d;
}
/* an active (not cancelled) subscription renews itself; a scheduled plan change kicks in at that renewal */
function settleSub(){
  const s = S.sub;
  if(!s.plan || !s.expires || s.cancelled) return;
  let changed = false, guard = 0;
  while(new Date(s.expires) <= new Date() && guard++ < 600){
    if(s.pending){ s.plan = s.pending; s.pending = null; }
    s.expires = addPeriod(new Date(s.expires), s.plan).toISOString();
    changed = true;
  }
  if(changed) saveSettings();
}
function subState(){
  settleSub();
  const s = S.sub;
  if(!s.plan || !s.expires) return 'none';
  if(new Date(s.expires) <= new Date()) return 'expired';
  return s.cancelled ? 'cancelled' : 'active';
}
const fmtDate = iso => new Date(iso).toLocaleDateString(S.lang === 'th' ? 'th-TH' : 'en-GB', {day:'numeric', month:'long', year:'numeric'});
function renderSub(){
  const st = subState();
  const s = S.sub;
  const live = (st === 'active' || st === 'cancelled');
  let h = `<div class="about-row"><span>${t('sub.status')}</span><b>${t('sub.' + st)}</b></div>`;
  if(st !== 'none'){
    h += `<div class="about-row"><span>${t('sub.plan')}</span><b>${t('sub.' + s.plan)}</b></div>`;
    if(live && s.pending) h += `<div class="about-row"><span>${t('sub.next')}</span><b>${t('sub.' + s.pending)}</b></div>`;
    h += `<div class="about-row"><span>${t('sub.expiry')}</span><b>${fmtDate(s.expires)}</b></div>`;
  }
  if(!live){
    h += `<p class="card-title" style="margin-top:16px;">${t('sub.choose')}</p>
      <div class="segment" style="margin:10px 0 14px;">
        <button data-act="pick-monthly" class="${subPick === 'monthly' ? 'active' : ''}">${t('sub.monthly')}</button>
        <button data-act="pick-yearly" class="${subPick === 'yearly' ? 'active' : ''}">${t('sub.yearly')}</button>
      </div>
      <button class="btn btn-accent" data-act="subscribe">${t('sub.subscribe')}</button>`;
  }else{
    const target = s.pending || s.plan;
    const note = !s.pending ? t('sub.changeNote')
      : (st === 'active' ? t('sub.pendingInfo', {p:t('sub.' + s.pending), d:fmtDate(s.expires)}) : t('sub.pendingOnRenew', {p:t('sub.' + s.pending)}));
    h += `<p class="card-title" style="margin-top:16px;">${t('sub.change')}</p>
      <div class="segment" style="margin:10px 0 8px;">
        <button data-act="switch-monthly" class="${target === 'monthly' ? 'active' : ''}">${t('sub.monthly')}</button>
        <button data-act="switch-yearly" class="${target === 'yearly' ? 'active' : ''}">${t('sub.yearly')}</button>
      </div>
      <p class="card-sub" style="margin:0 0 14px;">${note}</p>
      <button class="btn btn-accent" data-act="renew">${t('sub.renew')}</button>`;
    if(st === 'active') h += `<button class="btn btn-ghost btn-danger" data-act="cancel" style="margin-top:10px;">${cancelArmed ? t('sub.cancelConfirm') : t('sub.cancel')}</button>`;
  }
  $('sub-card').innerHTML = h;
}
$('sub-card').addEventListener('click', (e)=>{
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const act = b.getAttribute('data-act');
  if(act === 'pick-monthly' || act === 'pick-yearly'){ subPick = act.slice(5); renderSub(); return; }
  if(act === 'switch-monthly' || act === 'switch-yearly'){
    const target = act.slice(7);
    S.sub.pending = (target === S.sub.plan) ? null : target;
    saveSettings(); renderSub();
    toast(S.sub.pending ? t('toast.planSet') : t('toast.planKeep'));
    return;
  }
  if(act === 'subscribe'){
    S.sub = {plan:subPick, expires:addPeriod(new Date(), subPick).toISOString(), cancelled:false, pending:null};
    saveSettings(); renderSub(); toast(t('toast.subscribed')); return;
  }
  if(act === 'renew'){
    const base = new Date(Math.max(Date.now(), new Date(S.sub.expires).getTime()));
    if(S.sub.pending){ S.sub.plan = S.sub.pending; S.sub.pending = null; }
    S.sub.expires = addPeriod(base, S.sub.plan).toISOString();
    S.sub.cancelled = false;
    saveSettings(); renderSub(); toast(t('toast.renewed')); return;
  }
  if(act === 'cancel'){
    if(!cancelArmed){
      cancelArmed = true; renderSub();
      cancelTimer = setTimeout(()=>{ cancelArmed = false; renderSub(); }, 4000);
      return;
    }
    cancelArmed = false; clearTimeout(cancelTimer);
    S.sub.cancelled = true;
    saveSettings(); renderSub(); toast(t('toast.cancelled'));
  }
});

/* ---------- SETTINGS: generic switches & segments ---------- */
const FLAG_SWITCHES = {'sw-grid':'gridOn','sw-skel':'skelOn','sw-suggest':'coachSuggest','sw-form':'coachForm','sw-cprofile':'coachProfile','sw-hide':'hideName'};
const SEGMENTS = [
  ['cam-seg','data-cam','camFacing'], ['coach-tone','data-tone','coachTone'], ['coach-detail','data-detail','coachDetail'],
  ['theme-seg','data-theme-opt','theme'], ['size-seg','data-size','textSize'], ['accent-list','data-accent','accent']
];
function syncControls(){
  Object.keys(FLAG_SWITCHES).forEach(id => $(id).setAttribute('aria-checked', !!S[FLAG_SWITCHES[id]]));
  SEGMENTS.forEach(([id, attr, key])=>{
    $(id).querySelectorAll('[' + attr + ']').forEach(b=>{
      const on = b.getAttribute(attr) === S[key];
      b.classList.toggle('active', on);
      b.setAttribute('aria-checked', on);
    });
  });
}
function applyGrid(){
  const g = document.querySelector('.work-camera .grid-overlay');
  if(g) g.hidden = !S.gridOn;
}
Object.keys(FLAG_SWITCHES).forEach(id=>{
  $(id).addEventListener('click', ()=>{
    const k = FLAG_SWITCHES[id];
    S[k] = !S[k]; saveSettings(); syncControls();
    if(k === 'gridOn') applyGrid();
    if(k === 'hideName') updateHello();
  });
});
SEGMENTS.forEach(([id, attr, key])=>{
  $(id).addEventListener('click', (e)=>{
    const b = e.target.closest('[' + attr + ']');
    if(!b) return;
    S[key] = b.getAttribute(attr);
    saveSettings(); syncControls();
    if(key === 'theme' || key === 'accent' || key === 'textSize') applyAppearance();
  });
});

/* ---------- SETTINGS: appearance ---------- */
const ACCENTS = {orange:'#FF5A1F', blue:'#3B82F6', green:'#22C55E', purple:'#8B5CF6', pink:'#EC4899'};
const darkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
const resolvedTheme = () => S.theme === 'system' ? ((darkMQ && !darkMQ.matches) ? 'light' : 'dark') : S.theme;
function hexRGB(h){ const n = parseInt(h.slice(1), 16); return [(n>>16)&255, (n>>8)&255, n&255]; }
function mixHex(a, b, amt){
  const x = hexRGB(a), y = hexRGB(b);
  return 'rgb(' + x.map((v,i)=>Math.round(v + (y[i]-v)*amt)).join(',') + ')';
}
function applyAppearance(){
  const th = resolvedTheme(), root = document.documentElement;
  root.setAttribute('data-theme', th);
  const ac = ACCENTS[S.accent] || ACCENTS.orange;
  root.style.setProperty('--accent', ac);
  root.style.setProperty('--accent-bg', 'rgba(' + hexRGB(ac).join(',') + ',0.14)');
  root.style.setProperty('--accent-text', th === 'dark' ? mixHex(ac, '#ffffff', 0.75) : mixHex(ac, '#000000', 0.45));
  root.style.zoom = ({small:'0.92', normal:'', large:'1.1'})[S.textSize] || '';
}
if(darkMQ && darkMQ.addEventListener) darkMQ.addEventListener('change', ()=>{ if(S.theme === 'system') applyAppearance(); });

/* ---------- SETTINGS: body tracking (camera test) ---------- */
$('cam-test').addEventListener('click', async ()=>{
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return msg('cam-msg', t('trk.unsupported'), true);
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:S.camFacing}});
    stream.getTracks().forEach(tr => tr.stop());
    msg('cam-msg', t('trk.ok'), false);
  }catch(e){
    const n = e && e.name;
    msg('cam-msg', (n === 'NotAllowedError' || n === 'SecurityError') ? t('trk.denied')
      : (n === 'NotFoundError' || n === 'OverconstrainedError') ? t('trk.none') : t('trk.fail'), true);
  }
});

/* ---------- SETTINGS: privacy & data ---------- */
let privArmed = false, privTimer;
$('export-data').addEventListener('click', ()=>{
  const data = {app:'FORGE', version:APP_VERSION, exportedAt:new Date().toISOString(), settings:S, plan:planData};
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));
  const a = document.createElement('a');
  a.href = url; a.download = 'forge-data.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  msg('priv-msg', t('priv.exported'), false);
});
$('clear-data').addEventListener('click', ()=>{
  if(!privArmed){
    privArmed = true;
    $('clear-data').textContent = t('priv.clearConfirm');
    privTimer = setTimeout(()=>{ privArmed = false; $('clear-data').textContent = t('priv.clear'); }, 4000);
    return;
  }
  privArmed = false; clearTimeout(privTimer);
  const keep = {lang:S.lang, authMethod:S.authMethod, email:S.email, name:S.name, sub:S.sub};
  S = Object.assign(freshDefaults(), keep);
  btDevice = null;
  saveSettings();
  refreshAll();
  $('clear-data').textContent = t('priv.clear');
  msg('priv-msg', t('priv.cleared'), false);
});

/* ---------- apply language + refresh everything ---------- */
function applyStaticText(){
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))));
}
function refreshText(){
  applyStaticText();
  applyUnitToUI();
  applyAppearance();
  applyGrid();
  syncControls();
  calcTDEE();
  updateHello();
  renderPlan();
  renderMuscles();
  renderChat();
  workLabel();
  restRefresh();
  renderLangList();
  $('notif-hint').textContent = t('n.hint');
  $('about-version').textContent = 'v' + APP_VERSION;
  if(currentSetPage){
    $('set-page-sub').textContent = t('menu.' + currentSetPage);
    if(currentSetPage === 'account') renderAccount();
    if(currentSetPage === 'sub') renderSub();
    if(currentSetPage === 'devices') renderDevices();
  }
}
function refreshAll(){
  applyUnitToUI();
  fillBody();
  applyProfileToCalc();
  refreshSwitches();
  refreshText();
}
refreshAll();
