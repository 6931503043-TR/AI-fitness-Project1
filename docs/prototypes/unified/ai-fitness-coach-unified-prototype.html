ime and equipment given. At most 8 exercises per section. \"sets\" is an integer 1-10; \"reps\" is a short string such as \"10\", \"8-12\", \"30 sec\" or \"15 min\".`;\nconst AI_SYS_CREATE=AI_RULES+`\n- If the user supplies physician instructions, they are HARD CONSTRAINTS: never exceed them, never reinterpret or extend them, and never include anything listed under activitiesToAvoid.\n- If hasMedicalCondition is true and the physician instructions are unclear, conflicting, or too vague to build a plan strictly within them, do NOT guess. Return status \"needs_clarification\" with specific questions for the user to confirm with their doctor, and empty sections.\n- When constraints exist, prefer conservative volume and simple movements.\nJSON shape:\n{\"status\":\"draft\" | \"needs_clarification\",\"plan_name\":\"string\",\"summary\":\"string\",\"clarifications\":[\"string\"],\"sections\":[{\"title\":\"Preparation\",\"note\":\"string\",\"exercises\":[{\"name\":\"string\",\"sets\":1,\"reps\":\"string\",\"note\":\"string\"}]},{\"title\":\"Main session\",\"note\":\"string\",\"exercises\":[]},{\"title\":\"Recovery\",\"note\":\"string\",\"exercises\":[]}],\"cautions\":[\"string\"]}`;\nconst AI_SYS_ADJUST=AI_RULES+`\nTask: adjust the given template to the user's chosen body focus. Keep the template's level, duration and frequency in mind, keep 4-6 exercises, and favour the selected body focus without dropping balance entirely.\nJSON shape:\n{\"rationale\":\"string\",\"exercises\":[{\"name\":\"string\",\"sets\":1,\"reps\":\"string\",\"note\":\"string\"}]}`;\nconst AI_SYS_EDIT=AI_RULES+`\nTask: edit the user's current plan according to their request. Return the COMPLETE updated exercise list (not a diff), at most 12 exercises, with modest changes.\nYou do not know the user's medical history. If the request involves injury, pain or a medical condition, make no medically motivated change; say in \"message\" that they should check with their doctor or trainer.\nJSON shape:\n{\"message\":\"string\",\"exercises\":[{\"name\":\"string\",\"sets\":1,\"reps\":\"string\"}]}`;\n\n/* ---- helpers ---- */\nconst originScreen=o=>({detail:'detail',ai:'ai',myplans:'myplans',medical:'medical'}[o]||'home');\nconst setBusy=(btn,busy,html)=>{btn.disabled=busy;if(html!=null)btn.innerHTML=html};\n\n/* ---- 1) Create with AI (medical-aware form) ---- */\nlet lastMedicalDraft=null;\n$('medical-form').addEventListener('submit',async e=>{\n  e.preventDefault();\n  const hasCondition=$('medical-has-condition').checked;\n  if(hasCondition){\n    if(!$('medical-condition').value.trim()){toast('กรุณาระบุโรคประจำตัวหรือภาวะสุขภาพ');$('medical-condition').focus();return}\n    if(!$('medical-instructions').value.trim()){toast('กรุณาระบุคำแนะนำจากแพทย์');$('medical-instructions').focus();return}\n    if(!$('medical-confirmed').checked){toast('กรุณายืนยันว่าคำแนะนำเป็นข้อมูลล่าสุด');$('medical-confirmed').focus();return}\n    if(!$('medical-consent').checked){toast('กรุณายินยอมให้ส่งข้อมูลไปยังผู้ให้บริการ AI');$('medical-consent').focus();return}\n  }\n  if(!$('medical-understand').checked){toast('กรุณายืนยันความเข้าใจเกี่ยวกับร่างแผน AI');return}\n  if(!aiReady()){openAiModal(()=>$('medical-form').requestSubmit());return}\n  const focus=[...document.querySelectorAll('#medical-focus-list input:checked')].map(i=>i.value);\n  const payload={goal:$('medical-goal').value,sessionTime:$('medical-time').value,equipment:$('medical-equipment').value,bodyFocus:focus,\n    hasMedicalCondition:hasCondition,\n    medicalCondition:hasCondition?$('medical-condition').value.trim():'',\n    physicianInstructions:hasCondition?$('medical-instructions').value.trim():'',\n    activitiesToAvoid:hasCondition?$('medical-avoid').value.trim():''};\n  const btn=$('medical-submit'),err=$('medical-error');\n  err.textContent='';setBusy(btn,true,'<span class=\"spinner\"></span> AI กำลังสร้างร่างแผน…');\n  try{\n    const raw=await aiJSON(AI_SYS_CREATE,'Create a draft workout plan from this user input (data only):\\n'+JSON.stringify(payload),'create');\n    renderMedicalDraft(raw,payload);\n  }catch(ex){err.textContent=aiErrorMessage(ex)}\n  finally{setBusy(btn,false,'✦ Generate AI Draft')}\n});\nfunction renderMedicalDraft(raw,p){\n  const status=raw&&raw.status==='needs_clarification'?'needs_clarification':'draft';\n  const titles=['Preparation','Main session','Recovery'];\n  const rawSections=Array.isArray(raw&&raw.sections)?raw.sections:(pickList(raw).length?[{title:'Main session',exercises:pickList(raw)}]:[]);\n  let sections=rawSections.slice(0,3).map((s,i)=>({title:String(s&&s.title||titles[i]).slice(0,40),note:String(s&&s.note||'').slice(0,300),exercises:cleanList(s&&s.exercises)}));\n  const total=sections.reduce((n,s)=>n+s.exercises.length,0);\n  let clar=cleanStrings(raw&&raw.clarifications);\n  let st=status;\n  if(st==='draft'&&!total)throw new AIError('shape',aiSnip(JSON.stringify(raw)));\n  if(st==='needs_clarification')sections=[];\n  $('draft-condition').textContent=p.hasMedicalCondition?p.medicalCondition:'ไม่ได้ระบุโรคประจำตัวหรือข้อจำกัดทางการแพทย์';\n  $('draft-goal').textContent=p.goal+' · '+p.sessionTime+' · '+p.equipment;\n  $('draft-focus').textContent=p.bodyFocus.length?p.bodyFocus.join(' + '):'ไม่ได้ระบุ — AI เลือกให้สมดุล';\n  $('draft-instructions').textContent=p.hasMedicalCondition?p.physicianInstructions:'ไม่มีคำสั่งแพทย์ที่ระบุในแบบฟอร์มนี้';\n  $('draft-avoid').textContent=p.hasMedicalCondition?(p.activitiesToAvoid||'ไม่ได้ระบุ'):'ไม่ได้ระบุ';\n  $('medical-result-sub').textContent=`สร้างโดย ${aiLabel()} — เป็นร่างเพื่อให้ตรวจสอบ ไม่ใช่คำแนะนำทางการแพทย์`;\n  const summary=String(raw&&raw.summary||'').slice(0,500);\n  let html='';\n  if(summary)html+=`<p class=\"panel-sub\" style=\"margin:0 0 4px\">${escapeHtml(summary)}</p>`;\n  if(st==='needs_clarification'){\n    html+=`<div class=\"ai-clarify\"><strong>AI ขอข้อมูลเพิ่มเติมก่อนสร้างแผน</strong><ul>${clar.map(c=>`<li>${escapeHtml(c)}</li>`).join('')}</ul><p style=\"margin:10px 0 0;color:var(--muted);font-size:11px\">โปรดยืนยันประเด็นเหล่านี้กับแพทย์ผู้ดูแล แล้วกด \"แก้ไขข้อมูล\" เพื่อกรอกคำแนะนำให้ชัดเจนขึ้น</p></div>`;\n  }else{\n    html+=sections.map((s,i)=>`<div class=\"draft-sec\"><h4>${String(i+1).padStart(2,'0')} · ${escapeHtml(s.title)}</h4>${s.note?`<p>${escapeHtml(s.note)}</p>`:''}${s.exercises.map(x=>`<div class=\"draft-ex\"><div>${escapeHtml(x.name)}${x.note?`<small>${escapeHtml(x.note)}</small>`:''}</div><div class=\"vol\">${x.sets} sets · ${escapeHtml(x.reps)}</div></div>`).join('')||'<p>—</p>'}</div>`).join('');\n    const cautions=cleanStrings(raw&&raw.cautions);\n    if(cautions.length)html+=`<div class=\"medical-info\" style=\"margin-top:12px\"><strong>ข้อควรระวังจาก AI</strong><ul style=\"margin:6px 0 0;padding-left:18px\">${cautions.map(c=>`<li>${escapeHtml(c)}</li>`).join('')}</ul></div>`;\n  }\n  $('draft-body').innerHTML=html;\n  lastMedicalDraft=st==='draft'?{name:String(raw&&raw.plan_name||'AI Workout Plan').slice(0,60),focus:p.bodyFocus.join(' + ')||'AI Draft',exercises:sections.flatMap(s=>s.exercises)}:null;\n  $('medical-use').hidden=!lastMedicalDraft;\n  $('medical-result').hidden=false;\n  $('medical-result').scrollIntoView({behavior:'smooth',block:'start'});\n}\n$('medical-use').onclick=()=>{if(lastMedicalDraft)startBuilder(lastMedicalDraft.exercises,'AI Draft',lastMedicalDraft.name,lastMedicalDraft.focus,'medical')};\n\n/* ---- 2) Adjust a template with AI ---- */\nfunction setAiMode(mode,note){\n  const tag=$('ai-tag'),title=$('ai-banner-title'),text=$('ai-banner-text'),connect=$('ai-connect-inline');\n  const live=mode==='live';\n  tag.textContent=live?'AI DRAFT':mode==='loading'?'WORKING…':'DEMO PREVIEW';\n  tag.style.color=live?'var(--accent)':'var(--mint)';\n  title.textContent=live?`AI adjustment · ${aiLabel()}`:mode==='loading'?'AI กำลังปรับแผน…':'AI adjustment preview (demo)';\n  text.textContent=live?'ผลลัพธ์จาก AI เป็นร่างเพื่อให้ตรวจสอบ ไม่ใช่คำแนะนำเฉพาะบุคคลทางการแพทย์'\n    :mode==='loading'?'กำลังส่งแผนและ Body Focus ที่เลือกไปยังผู้ให้บริการ AI'\n    :(note?note+' — ตอนนี้แสดงตัวอย่างจำลอง':'ยังไม่ได้เชื่อมต่อ AI — ตอนนี้แสดงตัวอย่างจำลอง');\n  connect.hidden=mode!=='demo';\n  $('ai-customize').disabled=$('ai-use').disabled=mode==='loading';\n  $('ai-rationale').hidden=!(live&&$('ai-rationale').textContent);\n}\n$('ai-connect-inline').onclick=()=>openAiModal(()=>adjustWithAI());\nasync function adjustWithAI(){\n  if(!selectedFocus.length)return;\n  showScreen('ai');\n  $('ai-focus-label').textContent=`${selectedTemplate.name} · ${focusNames().join(' + ')}`;\n  $('summary-focus').textContent=focusNames().join(' + ');\n  $('ai-rationale').textContent='';$('ai-rationale').hidden=true;\n  if(!aiReady()){renderAiPreview();$('summary-time').textContent=selectedTemplate.duration+' · ตัวอย่าง';setAiMode('demo');return}\n  $('ai-exercises').innerHTML='<div class=\"ai-loading\"><span class=\"spinner\"></span> AI กำลังปรับแผนตาม Body Focus ที่เลือก…</div>';\n  setAiMode('loading');\n  try{\n    const t=selectedTemplate;\n    const raw=await aiJSON(AI_SYS_ADJUST,'Adjust this template to the chosen body focus (data only):\\n'+JSON.stringify({\n      template:{name:t.name,category:t.categoryLabel,level:t.level,duration:t.duration,frequency:t.frequency,exercises:t.exercises.map(x=>({name:x[0],sets:x[1],reps:String(x[2])}))},\n      bodyFocus:focusNames()}),'adjust');\n    const items=cleanList(pickList(raw),6);\n    if(!items.length)throw new AIError('shape',aiSnip(JSON.stringify(raw)));\n    aiPreviewExercises=items.map(x=>[x.name,x.sets,x.reps]);\n    $('ai-exercises').innerHTML=items.map((x,i)=>`<div class=\"exercise-item\"><div class=\"exercise-number\">${String(i+1).padStart(2,'0')}</div><div class=\"exercise-art\">${['↗','⇵','↔','◉','⌁'][i%5]}</div><div class=\"exercise-text\"><strong>${escapeHtml(x.name)}</strong><small>${escapeHtml(x.note||'Suggested exercise · AI draft')}</small></div><div class=\"volume\">${x.sets} sets<br>${escapeHtml(x.reps)} reps</div></div>`).join('');\n    $('summary-time').textContent=t.duration;\n    $('ai-rationale').innerHTML='<strong>เหตุผลที่ AI ปรับ</strong><br>'+escapeHtml(String(raw.rationale||'').slice(0,600));\n    setAiMode('live');\n  }catch(ex){\n    renderAiPreview();$('summary-time').textContent=selectedTemplate.duration+' · ตัวอย่าง';\n    setAiMode('demo',aiErrorMessage(ex));toast('ใช้ AI ไม่สำเร็จ — แสดงตัวอย่างจำลองแทน');\n  }\n}\n$('adjust-plan').onclick=()=>adjustWithAI();\n\n/* ---- 3) AI assistant inside the plan builder ---- */\nlet builderUndo=null,pendingEdit=null;\nfunction resetBuilderAI(){\n  builderUndo=null;pendingEdit=null;\n  $('ai-proposal').hidden=true;$('ai-proposal').innerHTML='';$('ai-undo').hidden=true;$('ai-ask').value='';$('ai-ask-error').textContent='';\n}\ndocument.querySelectorAll('.ai-chip').forEach(b=>b.addEventListener('click',()=>{$('ai-ask').value=b.dataset.ask;$('ai-ask').focus()}));\nasync function askBuilderAI(){\n  const q=$('ai-ask').value.trim();\n  if(!q){toast('พิมพ์สิ่งที่อยากให้ AI ปรับก่อน');$('ai-ask').focus();return}\n  if(!builderExercises.length&&!/สร้าง|เพิ่ม|ท่า|plan|create|add/i.test(q)){/* allow, AI can build from empty */}\n  if(!aiReady()){openAiModal(()=>askBuilderAI());return}\n  const btn=$('ai-ask-btn');$('ai-ask-error').textContent='';setBusy(btn,true,'<span class=\"spinner\"></span>');\n  try{\n    const raw=await aiJSON(AI_SYS_EDIT,'Edit the plan according to the request (data only):\\n'+JSON.stringify({\n      currentPlan:{name:$('builder-name').value.trim(),bodyFocus:$('builder-focus').value,exercises:builderExercises.map(x=>({name:x.name,sets:x.sets,reps:String(x.reps)}))},request:q}),'edit');\n    const list=cleanList(pickList(raw),12);\n    if(!list.length)throw new AIError('shape',aiSnip(JSON.stringify(raw)));\n    pendingEdit=list;\n    $('ai-proposal').hidden=false;\n    $('ai-proposal').innerHTML=`<strong style=\"font-size:12px\">ข้อเสนอจาก AI</strong><p style=\"font-size:11px;color:var(--muted);line-height:1.6;margin:6px 0 0\">${escapeHtml(String(raw.message||'').slice(0,500))}</p><ol>${list.map(x=>`<li>${escapeHtml(x.name)} — ${x.sets} sets · ${escapeHtml(x.reps)}</li>`).join('')}</ol><div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"btn small primary\" id=\"ai-apply\">ใช้รายการนี้</button><button class=\"btn small ghost\" id=\"ai-dismiss\">ไม่ใช้</button></div>`;\n  }catch(ex){$('ai-ask-error').textContent=aiErrorMessage(ex)}\n  finally{setBusy(btn,false,'✦ Ask AI')}\n}\n$('ai-ask-btn').onclick=askBuilderAI;\n$('ai-ask').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();askBuilderAI()}});\n$('ai-proposal').addEventListener('click',e=>{\n  if(e.target.closest('#ai-apply')&&pendingEdit){\n    builderUndo=builderExercises.map(x=>({...x}));\n    builderExercises=pendingEdit.map(x=>({name:x.name,sets:x.sets,reps:x.reps}));\n    pendingEdit=null;renderBuilderExercises();\n    $('ai-proposal').hidden=true;$('ai-proposal').innerHTML='';$('ai-undo').hidden=false;$('ai-ask').value='';\n    toast('ปรับแผนตามข้อเสนอของ AI แล้ว');\n  }\n  if(e.target.closest('#ai-dismiss')){pendingEdit=null;$('ai-proposal').hidden=true;$('ai-proposal').innerHTML=''}\n});\n$('ai-undo').onclick=()=>{if(!builderUndo)return;builderExercises=builderUndo;builderUndo=null;renderBuilderExercises();$('ai-undo').hidden=true;toast('ย้อนกลับแล้ว')};\n\nupdateAiStatus();\n\n<\/script>\n</body>\n</html>\n","body":"<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n  <meta name=\"theme-color\" content=\"#f4f7fb\" />\n  <title>AI Fitness Coach · Body Status</title>\n  <style>\n    :root {\n      --bg: #f3f6fa;\n      --surface: #ffffff;\n      --surface-soft: #f7f9fc;\n      --ink: #172b45;\n      --muted: #718096;\n      --line: #e4eaf1;\n      --blue: #3989e8;\n      --blue-dark: #2477d2;\n      --blue-soft: #eaf3ff;\n      --green: #2fa477;\n      --amber: #dca044;\n      --red: #d65f64;\n      --shadow: 0 10px 30px rgba(31, 55, 86, .055);\n      --radius: 20px;\n    }\n    * { box-sizing: border-box; }\n    html { scroll-behavior: smooth; }\n    body {\n      margin: 0;\n      background: var(--bg);\n      color: var(--ink);\n      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      line-height: 1.45;\n    }\n    button, input { font: inherit; }\n    button { cursor: pointer; }\n    .app { width: min(100% - 32px, 980px); margin: 28px auto 56px; }\n    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; }\n    .brand { display: flex; align-items: center; gap: 12px; }\n    .brand-mark { width: 46px; height: 46px; display: grid; place-items: center; color: var(--blue-dark); background: #dcecff; border-radius: 15px; }\n    .brand-mark svg { width: 24px; height: 24px; }\n    .eyebrow { margin: 0 0 2px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .13em; }\n    h1, h2, h3, p { margin-top: 0; }\n    h1 { margin: 0; font-size: 25px; letter-spacing: -.035em; }\n    h2 { margin: 0; font-size: 21px; letter-spacing: -.025em; }\n    h3 { margin: 0; font-size: 15px; }\n    .demo-pill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 999px; background: #e7f6ee; color: #217a54; font-size: 11px; font-weight: 750; white-space: nowrap; }\n    .demo-pill::before { content: \"\"; width: 7px; height: 7px; background: #37a66f; border-radius: 50%; }\n    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 14px; margin: 25px 2px 13px; }\n    .section-heading p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }\n    .date-chip { display: inline-flex; align-items: center; gap: 7px; color: #60748c; font-size: 12px; white-space: nowrap; }\n    .date-chip svg { width: 15px; height: 15px; }\n    .card { background: var(--surface); border: 1px solid rgba(224, 232, 241, .8); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }\n    .card + .card { margin-top: 14px; }\n    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }\n    .card-sub { color: var(--muted); font-size: 11px; margin-top: 3px; }\n    .tiny-label { color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }\n    .view-pill { background: #eef5fd; color: #397dc0; padding: 6px 9px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: .06em; }\n\n    /* Body map */\n    .body-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(230px, .9fr); gap: 20px; align-items: center; }\n    .body-stage { min-height: 365px; display: grid; place-items: center; background: var(--surface-soft); border-radius: 16px; padding: 12px; overflow: hidden; }\n    .body-svg { display: block; width: min(100%, 285px); height: 340px; }\n    .body-base { fill: #dfe7f0; stroke: #91a4b9; stroke-width: 2; stroke-linejoin: round; }\n    .body-region { fill: #d5e1ed; stroke: #91a4b9; stroke-width: 1.5; stroke-linejoin: round; transition: fill .2s, opacity .2s; cursor: pointer; }\n    .body-region:hover { fill: #9bc7f4; }\n    .body-region.active { fill: var(--blue); stroke: #216fbd; }\n    .body-region.muted-region { fill: #d5e1ed; }\n    .body-map-note { margin: 8px 0 0; color: var(--muted); font-size: 10px; text-align: center; }\n    .map-side { display: flex; flex-direction: column; gap: 15px; }\n    .selector-label { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 8px; }\n    .area-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }\n    .area-btn { min-height: 38px; border: 1px solid #dce5ef; background: #fff; border-radius: 11px; color: #63768c; font-size: 11px; font-weight: 700; transition: .18s ease; }\n    .area-btn:hover { border-color: #9bc4ef; color: var(--blue-dark); }\n    .area-btn.active { background: var(--blue-dark); border-color: var(--blue-dark); color: white; box-shadow: 0 5px 12px rgba(36,119,210,.18); }\n    .selected-info { border: 1px solid #e3ebf4; background: #f8fafc; border-radius: 14px; padding: 14px; }\n    .selected-info .label { color: var(--muted); font-size: 10px; }\n    .selected-info strong { display: block; margin-top: 2px; font-size: 18px; }\n    .legend { display: flex; flex-wrap: wrap; gap: 9px 13px; color: var(--muted); font-size: 10px; }\n    .legend-item { display: inline-flex; align-items: center; gap: 6px; }\n    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }\n    .dot.blue { background: var(--blue); }\n    .dot.grey { background: #cbd6e2; }\n\n    /* Metrics */\n    .status-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }\n    .status-badge { padding: 6px 10px; border-radius: 999px; font-size: 10px; font-weight: 800; white-space: nowrap; }\n    .status-badge.low { background: #e8f6ef; color: #26835a; }\n    .status-badge.medium { background: #fff4df; color: #9b6b16; }\n    .status-badge.high { background: #ffebec; color: #b94c54; }\n    .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }\n    .metric { background: #f5f8fb; border: 1px solid #edf1f5; border-radius: 14px; padding: 14px; }\n    .metric-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 10px; }\n    .metric-value { margin: 6px 0 9px; font-size: 25px; line-height: 1; font-weight: 800; letter-spacing: -.04em; }\n    .track { background: #e3eaf1; height: 7px; border-radius: 999px; overflow: hidden; }\n    .track > span { display: block; height: 100%; border-radius: inherit; transition: width .25s ease; }\n    .fatigue-fill { background: var(--amber); }\n    .recovery-fill { background: var(--green); }\n    .detail-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 2px 0; font-size: 12px; }\n    .detail-row span { color: var(--muted); }\n    .detail-row strong { font-size: 12px; }\n    .insight { display: flex; gap: 10px; background: #edf5ff; border: 1px solid #e1efff; border-radius: 14px; padding: 13px; margin-top: 15px; }\n    .insight-icon { flex: 0 0 26px; width: 26px; height: 26px; display: grid; place-items: center; background: #dcecff; border-radius: 9px; color: var(--blue-dark); }\n    .insight p { margin: 4px 0 0; color: #526b85; font-size: 11px; line-height: 1.55; }\n\n    /* Hydration */\n    .hydration-card { padding: 21px; }\n    .goal-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }\n    .goal-amount { font-size: clamp(26px, 5vw, 34px); font-weight: 850; letter-spacing: -.045em; color: var(--blue-dark); }\n    .goal-amount small { color: var(--muted); font-size: 13px; font-weight: 550; letter-spacing: 0; }\n    .progress-shell { height: 15px; border-radius: 999px; background: #e4edf6; overflow: hidden; margin: 11px 0 7px; }\n    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #4ca4f3, #277ed7); transition: width .25s ease; }\n    .progress-caption { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; }\n    .divider { height: 1px; background: var(--line); margin: 17px 0; }\n    .goal-breakdown { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }\n    .goal-tile { background: #f5f8fb; border: 1px solid #edf1f5; border-radius: 14px; padding: 13px; }\n    .goal-tile .tile-label { color: var(--muted); font-size: 10px; }\n    .goal-tile strong { display: block; margin: 4px 0 1px; font-size: 21px; letter-spacing: -.03em; }\n    .goal-tile small { color: var(--muted); font-size: 10px; }\n    .form-label { display: block; color: var(--muted); font-size: 11px; font-weight: 750; margin: 14px 0 8px; }\n    .quick-add { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }\n    .btn { display: inline-flex; justify-content: center; align-items: center; gap: 7px; min-height: 42px; border-radius: 12px; border: 1px solid #dce5ef; background: white; color: #526a83; font-size: 12px; font-weight: 750; padding: 9px 13px; transition: .16s ease; }\n    .btn:hover:not(:disabled) { border-color: #8dbbea; color: var(--blue-dark); transform: translateY(-1px); }\n    .btn:disabled { opacity: .45; cursor: not-allowed; }\n    .btn.primary { background: var(--blue-dark); color: white; border-color: var(--blue-dark); }\n    .btn.primary:hover:not(:disabled) { background: #1d68bb; color: white; }\n    .btn.danger-ghost { border: 0; background: transparent; color: #a0adba; min-height: 30px; padding: 5px 8px; }\n    .btn.danger-ghost:hover { color: #c74e58; background: #fff0f1; }\n    .custom-row { display: flex; gap: 9px; }\n    .input-wrap { position: relative; flex: 1; }\n    .input-wrap input { width: 100%; min-height: 43px; border: 1px solid #dce5ef; background: #fff; border-radius: 12px; padding: 0 49px 0 13px; color: var(--ink); outline: none; font-size: 12px; }\n    .input-wrap input:focus { border-color: #82b7ec; box-shadow: 0 0 0 3px rgba(57,137,232,.11); }\n    .input-wrap .unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 11px; pointer-events: none; }\n    .history-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 9px; }\n    .entry-count { color: #397dc0; background: #eef5fd; border-radius: 999px; padding: 5px 8px; font-size: 10px; font-weight: 800; }\n    .history-list { display: flex; flex-direction: column; gap: 7px; }\n    .history-entry { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 10px; border: 1px solid #edf1f5; background: #fbfcfe; border-radius: 12px; }\n    .entry-left { display: flex; align-items: center; gap: 9px; min-width: 0; }\n    .glass-icon { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 9px; background: #eaf3ff; color: #3188d6; flex: 0 0 auto; }\n    .entry-name { color: #52677e; font-size: 11px; font-weight: 650; }\n    .entry-time { color: #9aa7b5; display: block; font-size: 9px; margin-top: 1px; }\n    .entry-right { display: flex; align-items: center; gap: 8px; white-space: nowrap; }\n    .entry-amount { color: #314b65; font-size: 11px; font-weight: 800; }\n    .empty-state { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 11px; border: 1px dashed #dce5ef; border-radius: 12px; }\n    .total-row { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; font-size: 12px; }\n    .total-row span { color: var(--muted); }\n\n    /* Charts */\n    .chart-card { padding: 20px; }\n    .chart-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 5px; }\n    .chart-title p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }\n    .chart-icon { color: var(--blue); width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; background: #edf5ff; }\n    .chart-wrap { width: 100%; overflow: hidden; }\n    .chart-svg { display: block; width: 100%; height: auto; min-height: 170px; }\n    .chart-grid { stroke: #e9eef4; stroke-width: 1; }\n    .chart-axis { fill: #96a4b3; font-size: 10px; }\n    .chart-line-blue { fill: none; stroke: #3989e8; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }\n    .chart-line-grey { fill: none; stroke: #9eafc2; stroke-width: 2.4; stroke-dasharray: 5 5; stroke-linecap: round; }\n    .chart-line-green { fill: none; stroke: #2fa477; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }\n    .chart-line-amber { fill: none; stroke: #dca044; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }\n    .chart-dot { fill: white; stroke: #3989e8; stroke-width: 2; }\n    .chart-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 4px; color: var(--muted); font-size: 10px; }\n    .legend-line { width: 17px; height: 3px; display: inline-block; border-radius: 4px; margin-right: 5px; vertical-align: middle; }\n    .period-toggle { display: inline-flex; padding: 3px; border: 1px solid #e2e9f1; border-radius: 10px; background: #f7f9fc; gap: 3px; }\n    .period-toggle button { border: 0; border-radius: 7px; padding: 6px 9px; color: #7a8b9e; background: transparent; font-size: 10px; font-weight: 750; }\n    .period-toggle button.active { color: #246fbf; background: white; box-shadow: 0 1px 4px rgba(20,45,75,.1); }\n    .footnote { margin: 11px 0 0; color: #8b99a8; font-size: 10px; line-height: 1.5; }\n    .footer { display: flex; justify-content: center; align-items: center; gap: 7px; color: #8b99a8; font-size: 10px; padding: 22px 0 0; }\n    .notice { margin-top: 15px; border: 1px solid #f2e5c9; background: #fff9ed; border-radius: 13px; padding: 11px 13px; color: #80652e; font-size: 10px; line-height: 1.55; }\n    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); padding: 10px 15px; border-radius: 999px; background: #172b45; color: white; font-size: 11px; box-shadow: 0 8px 24px rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: .22s ease; z-index: 10; }\n    .toast.show { opacity: 1; transform: translate(-50%, 0); }\n\n    @media (max-width: 700px) {\n      .app { width: min(100% - 22px, 520px); margin-top: 16px; }\n      .topbar { margin-bottom: 20px; }\n      h1 { font-size: 22px; }\n      .card { padding: 15px; border-radius: 17px; }\n      .body-layout { grid-template-columns: 1fr; gap: 14px; }\n      .body-stage { min-height: 330px; }\n      .body-svg { height: 315px; }\n      .map-side { gap: 12px; }\n      .section-heading { margin-top: 21px; }\n      .chart-card, .hydration-card { padding: 16px; }\n    }\n    @media (max-width: 390px) {\n      .demo-pill { font-size: 9px; padding: 6px 8px; }\n      .brand-mark { width: 40px; height: 40px; }\n      .area-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }\n      .goal-top { align-items: flex-start; flex-direction: column; gap: 0; }\n      .progress-caption { gap: 8px; }\n      .metric-value { font-size: 22px; }\n    }\n  </style>\n\n<style id=\"unified-prototype-overrides\">\n.app{margin-top:16px!important;margin-bottom:28px!important}\n</style>\n</head>\n<body>\n  <main class=\"app\">\n    <header class=\"topbar\">\n      <div class=\"brand\">\n        <div class=\"brand-mark\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v5M6 5l2 4m10-4-2 4M7 10c-1.5 2-2 5-1 8m11-8c1.5 2 2 5 1 8M8 10c1.2 1 2.4 1.5 4 1.5s2.8-.5 4-1.5M8 18c1.2 1 2.5 1.5 4 1.5s2.8-.5 4-1.5M12 11.5V21\"/></svg>\n        </div>\n        <div><p class=\"eyebrow\">AI FITNESS COACH</p><h1>Body Status</h1></div>\n      </div>\n      <span class=\"demo-pill\">Interactive prototype</span>\n    </header>\n\n    <section aria-labelledby=\"overview-title\">\n      <div class=\"section-heading\">\n        <div><h2 id=\"overview-title\">Body Overview</h2><p>Your body condition at a glance</p></div>\n        <div class=\"date-chip\" id=\"today-label\"></div>\n      </div>\n      <div class=\"card\">\n        <div class=\"card-head\"><div><h3>Muscle Map</h3><div class=\"card-sub\">Select a body area to see its details</div></div><span class=\"view-pill\" id=\"view-label\">FRONT VIEW</span></div>\n        <div class=\"body-layout\">\n          <div>\n            <div class=\"body-stage\" id=\"body-stage\">\n              <svg id=\"front-map\" class=\"body-svg\" viewBox=\"0 0 260 310\" role=\"img\" aria-label=\"Front view body muscle map\">\n                <circle class=\"body-base\" cx=\"130\" cy=\"25\" r=\"18\" />\n                <path class=\"body-base\" d=\"M120 44 L120 55 L140 55 L140 44 Z\" />\n                <path class=\"body-base\" d=\"M99 57 Q82 57 72 70 L62 112 Q60 120 69 123 L79 118 L91 83 L101 72 Z\" />\n                <path class=\"body-base\" d=\"M161 57 Q178 57 188 70 L198 112 Q200 120 191 123 L181 118 L169 83 L159 72 Z\" />\n                <path class=\"body-base\" d=\"M68 123 L78 119 L79 145 L69 151 Z M192 119 L202 123 L191 151 L181 145 Z\" />\n                <path class=\"body-base\" d=\"M98 57 Q109 51 130 54 Q151 51 162 57 L174 78 L166 142 Q160 153 130 153 Q100 153 94 142 L86 78 Z\" />\n                <path class=\"body-region\" data-area=\"Chest\" d=\"M94 69 Q109 58 130 65 Q151 58 166 69 L160 100 Q145 107 130 104 Q115 107 100 100 Z\" />\n                <path class=\"body-region\" data-area=\"Core\" d=\"M100 103 Q115 109 130 106 Q145 109 160 103 L158 140 Q145 149 130 147 Q115 149 102 140 Z\" />\n                <path class=\"body-region\" data-area=\"Arms\" d=\"M99 57 Q82 57 72 70 L62 112 Q60 120 69 123 L79 118 L91 83 L101 72 Z M161 57 Q178 57 188 70 L198 112 Q200 120 191 123 L181 118 L169 83 L159 72 Z M68 123 L78 119 L79 145 L69 151 Z M192 119 L202 123 L191 151 L181 145 Z\" />\n                <path class=\"body-region\" data-area=\"Legs\" d=\"M96 148 L128 151 L122 222 L113 283 Q105 290 91 285 L93 222 Z M132 151 L164 148 L167 222 L169 285 Q155 290 147 283 L138 222 Z M91 285 L112 285 L110 300 L85 300 Q80 294 91 285 Z M148 285 L169 285 L179 300 L154 300 Q149 294 148 285 Z\" />\n              </svg>\n              <svg id=\"back-map\" class=\"body-svg\" viewBox=\"0 0 260 310\" role=\"img\" aria-label=\"Back view body muscle map\" hidden>\n                <circle class=\"body-base\" cx=\"130\" cy=\"25\" r=\"18\" />\n                <path class=\"body-base\" d=\"M120 44 L120 55 L140 55 L140 44 Z\" />\n                <path class=\"body-base\" d=\"M99 57 Q82 57 72 70 L62 112 Q60 120 69 123 L79 118 L91 83 L101 72 Z\" />\n                <path class=\"body-base\" d=\"M161 57 Q178 57 188 70 L198 112 Q200 120 191 123 L181 118 L169 83 L159 72 Z\" />\n                <path class=\"body-base\" d=\"M68 123 L78 119 L79 145 L69 151 Z M192 119 L202 123 L191 151 L181 145 Z\" />\n                <path class=\"body-base\" d=\"M98 57 Q109 51 130 54 Q151 51 162 57 L174 78 L166 142 Q160 153 130 153 Q100 153 94 142 L86 78 Z\" />\n                <path class=\"body-region\" data-area=\"Back\" d=\"M99 61 Q112 56 130 61 Q148 56 161 61 L166 91 Q151 105 130 111 Q109 105 94 91 Z\" />\n                <path class=\"body-region\" data-area=\"Core\" d=\"M98 108 Q113 114 130 114 Q147 114 162 108 L158 143 Q145 150 130 148 Q115 150 102 143 Z\" />\n                <path class=\"body-region\" data-area=\"Arms\" d=\"M99 57 Q82 57 72 70 L62 112 Q60 120 69 123 L79 118 L91 83 L101 72 Z M161 57 Q178 57 188 70 L198 112 Q200 120 191 123 L181 118 L169 83 L159 72 Z M68 123 L78 119 L79 145 L69 151 Z M192 119 L202 123 L191 151 L181 145 Z\" />\n                <path class=\"body-region\" data-area=\"Legs\" d=\"M96 148 L128 151 L122 222 L113 283 Q105 290 91 285 L93 222 Z M132 151 L164 148 L167 222 L169 285 Q155 290 147 283 L138 222 Z M91 285 L112 285 L110 300 L85 300 Q80 294 91 285 Z M148 285 L169 285 L179 300 L154 300 Q149 294 148 285 Z\" />\n              </svg>\n            </div>\n            <p class=\"body-map-note\">Blue highlight indicates the selected muscle group.</p>\n          </div>\n          <div class=\"map-side\">\n            <div><div class=\"selector-label\">SELECT BODY FOCUS</div>\n              <div class=\"area-grid\" id=\"area-buttons\">\n                <button class=\"area-btn active\" data-area=\"Chest\">Chest</button>\n                <button class=\"area-btn\" data-area=\"Back\">Back</button>\n                <button class=\"area-btn\" data-area=\"Arms\">Arms</button>\n                <button class=\"area-btn\" data-area=\"Core\">Core</button>\n                <button class=\"area-btn\" data-area=\"Legs\">Legs</button>\n              </div>\n            </div>\n            <div class=\"selected-info\"><div class=\"label\">SELECTED AREA</div><strong id=\"selected-area\">Chest</strong></div>\n            <div class=\"legend\"><span class=\"legend-item\"><i class=\"dot blue\"></i>Selected area</span><span class=\"legend-item\"><i class=\"dot grey\"></i>Other areas</span></div>\n          </div>\n        </div>\n      </div>\n    </section>\n\n    <section aria-labelledby=\"part-info-title\">\n      <div class=\"section-heading\"><div><h2 id=\"part-info-title\">Specific Part Info</h2><p>Muscle condition and recovery information</p></div></div>\n      <div class=\"card\">\n        <div class=\"status-row\"><div><h3 id=\"part-name\">Chest Status</h3><div class=\"card-sub\">Selected muscle group</div></div><span class=\"status-badge medium\" id=\"fatigue-badge\">Moderate Fatigue</span></div>\n        <div class=\"metric-grid\">\n          <div class=\"metric\"><div class=\"metric-top\"><span>Fatigue Level</span><span>↗</span></div><div class=\"metric-value\" id=\"fatigue-value\">42%</div><div class=\"track\"><span class=\"fatigue-fill\" id=\"fatigue-bar\" style=\"width:42%\"></span></div></div>\n          <div class=\"metric\"><div class=\"metric-top\"><span>Recovery Estimate</span><span>↗</span></div><div class=\"metric-value\" id=\"recovery-value\">58%</div><div class=\"track\"><span class=\"recovery-fill\" id=\"recovery-bar\" style=\"width:58%\"></span></div></div>\n        </div>\n        <div class=\"detail-row\"><span>Last Training</span><strong id=\"last-training\">Yesterday</strong></div>\n        <div class=\"detail-row\"><span>Training Status</span><strong id=\"training-status\">Moderate Load</strong></div>\n        <div class=\"insight\"><div class=\"insight-icon\">✦</div><div><h3 style=\"font-size:12px\">AI Coach Insight</h3><p id=\"coach-insight\">This muscle group has moderate fatigue. Consider monitoring recovery before increasing training intensity.</p></div></div>\n      </div>\n    </section>\n\n    <section aria-labelledby=\"hydration-title\">\n      <div class=\"section-heading\"><div><h2 id=\"hydration-title\">Hydration</h2><p>Daily water goal and water intake tracking</p></div></div>\n      <div class=\"card hydration-card\">\n        <div class=\"card-head\" style=\"margin-bottom:12px\"><div><h3>Today's Water Goal</h3><div class=\"card-sub\">Your daily hydration progress</div></div><span class=\"view-pill\">DEMO DATA</span></div>\n        <div class=\"goal-top\"><div class=\"goal-amount\"><span id=\"water-total\">1,200</span> <small>ml</small></div><div style=\"color:var(--muted);font-size:12px\">of <strong id=\"water-goal-label\" style=\"color:var(--ink)\">2,400 ml</strong></div></div>\n        <div class=\"progress-shell\"><div class=\"progress-fill\" id=\"water-progress\" style=\"width:50%\"></div></div>\n        <div class=\"progress-caption\"><span id=\"water-percent\">50% completed</span><span id=\"water-remaining\">1,200 ml remaining</span></div>\n        <div class=\"divider\"></div>\n        <div class=\"goal-breakdown\">\n          <div class=\"goal-tile\"><div class=\"tile-label\">Base Water Goal</div><strong>2,000 ml</strong><small>Estimated daily baseline</small></div>\n          <div class=\"goal-tile\"><div class=\"tile-label\">Exercise Adjustment</div><strong style=\"color:var(--blue-dark)\">+400 ml</strong><small>Illustrative adjustment</small></div>\n        </div>\n        <div class=\"divider\"></div>\n        <h3>Log Water</h3>\n        <div class=\"quick-add\" style=\"margin-top:10px\">\n          <button class=\"btn\" data-add=\"250\">＋ 250 ml</button>\n          <button class=\"btn\" data-add=\"500\">＋ 500 ml</button>\n        </div>\n        <label class=\"form-label\" for=\"custom-water\">CUSTOM WATER INTAKE</label>\n        <form class=\"custom-row\" id=\"water-form\">\n          <div class=\"input-wrap\"><input id=\"custom-water\" type=\"number\" min=\"1\" max=\"10000\" step=\"1\" placeholder=\"Enter amount\" inputmode=\"numeric\" /><span class=\"unit\">ml</span></div>\n          <button class=\"btn primary\" type=\"submit\">＋ Add</button>\n        </form>\n        <div class=\"divider\"></div>\n        <div class=\"history-head\"><h3>Water Intake History</h3><span class=\"entry-count\" id=\"entry-count\">3 entries</span></div>\n        <div class=\"history-list\" id=\"history-list\"></div>\n        <div class=\"total-row\"><span>Total Water Consumed</span><strong id=\"water-total-bottom\">1,200 ml</strong></div>\n        <div class=\"notice\">This is a UI prototype. The base goal and exercise adjustment are illustrative values, not a personalized medical recommendation. Actual hydration needs vary by individual, workout, temperature and health conditions.</div>\n      </div>\n    </section>\n\n    <section aria-labelledby=\"statistics-title\">\n      <div class=\"section-heading\"><div><h2 id=\"statistics-title\">Statistics</h2><p>Track your body condition over time</p></div></div>\n      <div class=\"card chart-card\">\n        <div class=\"chart-title\"><div><h3>Hydration Statistics</h3><p>Daily water consumption</p></div><div class=\"chart-icon\">💧</div></div>\n        <div class=\"chart-wrap\"><svg class=\"chart-svg\" id=\"hydration-chart\" viewBox=\"0 0 600 220\" role=\"img\" aria-label=\"Weekly hydration chart\"></svg></div>\n        <div class=\"chart-legend\"><span><i class=\"legend-line\" style=\"background:#3989e8\"></i>Water intake</span><span><i class=\"legend-line\" style=\"background:#9eafc2\"></i>Daily goal</span></div>\n        <p class=\"footnote\">Example weekly hydration data. In the full app, this chart will use the user's saved daily intake records.</p>\n      </div>\n      <div class=\"card chart-card\">\n        <div class=\"chart-title\"><div><h3>Fatigue Statistics</h3><p>Fatigue and recovery trends</p></div><div class=\"chart-icon\">♥</div></div>\n        <div class=\"period-toggle\" role=\"group\" aria-label=\"Fatigue chart period\"><button class=\"active\" data-period=\"7\">7 Days</button><button data-period=\"30\">30 Days</button></div>\n        <div class=\"chart-wrap\"><svg class=\"chart-svg\" id=\"fatigue-chart\" viewBox=\"0 0 600 220\" role=\"img\" aria-label=\"Fatigue and recovery chart\"></svg></div>\n        <div class=\"chart-legend\"><span><i class=\"legend-line\" style=\"background:#dca044\"></i>Fatigue</span><span><i class=\"legend-line\" style=\"background:#2fa477\"></i>Recovery</span></div>\n        <p class=\"footnote\">Example fatigue and recovery data, not measured physiological values.</p>\n      </div>\n    </section>\n\n    <footer class=\"footer\"><span>◇</span> AI Fitness Coach · Body Status Dashboard</footer>\n  </main>\n  <div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"></div>\n\n  <script>\n    (() => {\n      const STORAGE_KEY = 'aifc-body-status-demo-v1';\n      const GOAL = 2400;\n      const initialState = {\n        selectedArea: 'Chest',\n        entries: [\n          { id: 1, amount: 250, time: '09:00' },\n          { id: 2, amount: 500, time: '11:30' },\n          { id: 3, amount: 450, time: '14:00' }\n        ]\n      };\n      const metrics = {\n        Chest: { fatigue: 42, recovery: 58, last: 'Yesterday' },\n        Back: { fatigue: 28, recovery: 72, last: '2 days ago' },\n        Arms: { fatigue: 56, recovery: 44, last: 'Yesterday' },\n        Core: { fatigue: 34, recovery: 66, last: '3 days ago' },\n        Legs: { fatigue: 68, recovery: 32, last: 'Today' }\n      };\n      let state = loadState();\n      let currentPeriod = 7;\n      let toastTimer;\n\n      function loadState() {\n        try {\n          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));\n          if (saved && Array.isArray(saved.entries)) {\n            return { selectedArea: metrics[saved.selectedArea] ? saved.selectedArea : 'Chest', entries: saved.entries.filter(e => Number.isFinite(e.amount) && e.amount > 0) };\n          }\n        } catch (_) { /* localStorage may be unavailable */ }\n        return structuredClone(initialState);\n      }\n      function saveState() {\n        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) { /* continue without persistence */ }\n      }\n      function totalWater() { return state.entries.reduce((sum, entry) => sum + entry.amount, 0); }\n      function showToast(message) {\n        const toast = document.getElementById('toast');\n        toast.textContent = message;\n        toast.classList.add('show');\n        clearTimeout(toastTimer);\n        toastTimer = setTimeout(() => toast.classList.remove('show'), 1900);\n      }\n      function escapeText(value) {\n        return String(value).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n      }\n      function setArea(area) {\n        if (!metrics[area]) return;\n        state.selectedArea = area;\n        saveState();\n        renderArea();\n      }\n      function renderArea() {\n        const area = state.selectedArea;\n        const info = metrics[area];\n        const back = area === 'Back';\n        document.getElementById('front-map').hidden = back;\n        document.getElementById('back-map').hidden = !back;\n        document.getElementById('view-label').textContent = back ? 'BACK VIEW' : 'FRONT VIEW';\n        document.getElementById('selected-area').textContent = area;\n        document.querySelectorAll('.area-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.area === area));\n        document.querySelectorAll('.body-svg .body-region').forEach(path => path.classList.toggle('active', path.dataset.area === area));\n        document.getElementById('part-name').textContent = area + ' Status';\n        document.getElementById('fatigue-value').textContent = info.fatigue + '%';\n        document.getElementById('recovery-value').textContent = info.recovery + '%';\n        document.getElementById('fatigue-bar').style.width = info.fatigue + '%';\n        document.getElementById('recovery-bar').style.width = info.recovery + '%';\n        document.getElementById('last-training').textContent = info.last;\n        const level = info.fatigue >= 60 ? 'high' : info.fatigue >= 40 ? 'medium' : 'low';\n        const badge = document.getElementById('fatigue-badge');\n        badge.className = 'status-badge ' + level;\n        badge.textContent = level === 'high' ? 'High Fatigue' : level === 'medium' ? 'Moderate Fatigue' : 'Low Fatigue';\n        document.getElementById('training-status').textContent = level === 'high' ? 'Needs Recovery' : level === 'medium' ? 'Moderate Load' : 'Recovering Well';\n        document.getElementById('coach-insight').textContent = level === 'high'\n          ? 'This muscle group has a relatively high fatigue score. Review its training load and recovery before your next session.'\n          : level === 'medium'\n            ? 'This muscle group has moderate fatigue. Consider monitoring recovery before increasing training intensity.'\n            : 'This muscle group has a relatively low fatigue score. Continue monitoring training and recovery.';\n      }\n      function addWater(amount) {\n        const n = Math.round(Number(amount));\n        if (!Number.isFinite(n) || n <= 0 || n > 10000) { showToast('Enter an amount between 1 and 10,000 ml.'); return; }\n        const time = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());\n        state.entries.push({ id: Date.now() + Math.random(), amount: n, time });\n        saveState();\n        renderHydration();\n        showToast(n.toLocaleString() + ' ml added');\n      }\n      function removeEntry(id) {\n        state.entries = state.entries.filter(entry => String(entry.id) !== String(id));\n        saveState();\n        renderHydration();\n        showToast('Water entry removed');\n      }\n      function renderHydration() {\n        const total = totalWater();\n        const remaining = Math.max(0, GOAL - total);\n        const percent = Math.min(100, Math.round(total / GOAL * 100));\n        document.getElementById('water-total').textContent = total.toLocaleString();\n        document.getElementById('water-total-bottom').textContent = total.toLocaleString() + ' ml';\n        document.getElementById('water-goal-label').textContent = GOAL.toLocaleString() + ' ml';\n        document.getElementById('water-progress').style.width = percent + '%';\n        document.getElementById('water-percent').textContent = percent + '% completed';\n        document.getElementById('water-remaining').textContent = remaining.toLocaleString() + ' ml remaining';\n        document.getElementById('entry-count').textContent = state.entries.length + (state.entries.length === 1 ? ' entry' : ' entries');\n        const list = document.getElementById('history-list');\n        if (!state.entries.length) {\n          list.innerHTML = '<div class=\"empty-state\">No water entries yet. Add your first intake above.</div>';\n          return;\n        }\n        list.innerHTML = state.entries.slice().reverse().map((entry, index) => `\n          <div class=\"history-entry\">\n            <div class=\"entry-left\"><div class=\"glass-icon\" aria-hidden=\"true\">♧</div><div><div class=\"entry-name\">Water Entry ${state.entries.length - index}</div><span class=\"entry-time\">${escapeText(entry.time || '')}</span></div></div>\n            <div class=\"entry-right\"><span class=\"entry-amount\">+${Number(entry.amount).toLocaleString()} ml</span><button class=\"btn danger-ghost\" type=\"button\" data-remove=\"${escapeText(entry.id)}\" aria-label=\"Remove water entry\"><span aria-hidden=\"true\">✕</span></button></div>\n          </div>`).join('');\n      }\n\n      function makeLineChart(svgId, series, labels, maxValue, ySuffix = '') {\n        const svg = document.getElementById(svgId);\n        const W = 600, H = 220, left = 43, right = 15, top = 12, bottom = 32;\n        const plotW = W - left - right, plotH = H - top - bottom;\n        const x = i => left + (labels.length === 1 ? plotW / 2 : (i * plotW / (labels.length - 1)));\n        const y = value => top + plotH - (value / maxValue) * plotH;\n        let markup = '';\n        for (let i = 0; i <= 4; i++) {\n          const val = maxValue - (maxValue / 4) * i;\n          const yy = y(val);\n          markup += `<line class=\"chart-grid\" x1=\"${left}\" y1=\"${yy}\" x2=\"${W-right}\" y2=\"${yy}\"/><text class=\"chart-axis\" x=\"${left-9}\" y=\"${yy+3}\" text-anchor=\"end\">${Math.round(val/100)*100}${ySuffix}</text>`;\n        }\n        labels.forEach((label, i) => { markup += `<text class=\"chart-axis\" x=\"${x(i)}\" y=\"${H-9}\" text-anchor=\"middle\">${escapeText(label)}</text>`; });\n        series.forEach(s => {\n          const points = s.values.map((v, i) => `${x(i)},${y(v)}`).join(' ');\n          markup += `<polyline class=\"${s.className}\" points=\"${points}\"/>`;\n          if (s.dots) s.values.forEach((v, i) => { markup += `<circle class=\"chart-dot\" cx=\"${x(i)}\" cy=\"${y(v)}\" r=\"3.5\"/>`; });\n        });\n        svg.innerHTML = markup;\n      }\n      function renderCharts() {\n        makeLineChart('hydration-chart', [\n          { className: 'chart-line-blue', values: [1800,2200,1600,2400,1950,2100,1250], dots: true },\n          { className: 'chart-line-grey', values: [2400,2400,2400,2400,2400,2400,2400] }\n        ], ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], 3000);\n        const labels = currentPeriod === 7 ? ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'] : ['W1','W2','W3','W4'];\n        const fatigue = currentPeriod === 7 ? [35,60,55,40,70,50,42] : [55,65,45,35];\n        const recovery = currentPeriod === 7 ? [65,40,45,60,30,50,58] : [45,35,55,65];\n        makeLineChart('fatigue-chart', [\n          { className: 'chart-line-amber', values: fatigue, dots: true },\n          { className: 'chart-line-green', values: recovery, dots: true }\n        ], labels, 100, '%');\n      }\n\n      // Bind controls.\n      document.getElementById('area-buttons').addEventListener('click', event => {\n        const button = event.target.closest('[data-area]');\n        if (button) setArea(button.dataset.area);\n      });\n      document.querySelectorAll('.body-svg .body-region').forEach(path => {\n        path.addEventListener('click', () => setArea(path.dataset.area));\n      });\n      document.querySelectorAll('[data-add]').forEach(button => button.addEventListener('click', () => addWater(button.dataset.add)));\n      document.getElementById('water-form').addEventListener('submit', event => {\n        event.preventDefault();\n        const input = document.getElementById('custom-water');\n        if (!input.value.trim()) { input.focus(); return; }\n        addWater(input.value);\n        input.value = '';\n      });\n      document.getElementById('history-list').addEventListener('click', event => {\n        const button = event.target.closest('[data-remove]');\n        if (button) removeEntry(button.dataset.remove);\n      });\n      document.querySelectorAll('[data-period]').forEach(button => button.addEventListener('click', () => {\n        currentPeriod = Number(button.dataset.period);\n        document.querySelectorAll('[data-period]').forEach(b => b.classList.toggle('active', b === button));\n        renderCharts();\n      }));\n\n      const now = new Date();\n      document.getElementById('today-label').innerHTML = `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M16 3v4M8 3v4M3 10h18\"/></svg>${now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}`;\n      renderArea();\n      renderHydration();\n      renderCharts();\n    })();\n  <\/script>\n</body>\n</html>\n","chat":"<!DOCTYPE html>\n<html lang=\"th\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\" />\n<meta name=\"theme-color\" content=\"#14130F\" />\n<title>FORGE — Chat Prototype</title>\n<style>\n:root{\n  --bg:#14130F;--panel:#1E1C17;--panel2:#26241D;--panel3:#302D25;\n  --line:rgba(245,243,238,.10);--line2:rgba(245,243,238,.17);\n  --text:#F5F3EE;--sub:#AAA497;--muted:#777266;\n  --accent:#20C46A;--accent-weak:rgba(32,196,106,.13);--accent-text:#07170E;\n  --blue:#6475F5;--danger:#E4574B;--shadow:0 24px 70px rgba(0,0,0,.42);\n  --radius:18px;--nav-h:68px;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif}\nbody{min-height:100dvh}\nbutton,input,textarea{font:inherit}\nbutton{cursor:pointer}\n.app{max-width:1500px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line)}\n.appbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);flex:none}\n.brand{font-weight:950;font-size:22px;letter-spacing:.3px}.brand span{color:var(--accent)}\n.streak{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:8px}.streak b{color:var(--text);font-weight:600}\n.workspace{display:flex;flex:1;min-height:0;padding-bottom:var(--nav-h)}\n.content{display:flex;flex-direction:column;flex:1;min-width:0;padding:24px 26px 16px}\n.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}\n.page-head h1{font-size:30px;line-height:1.05;letter-spacing:-.7px;margin:0 0 6px;font-weight:750}\n.page-head p{margin:0;color:var(--sub);font-size:14px}\n.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}\n.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 13px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.16s ease}\n.btn:hover{background:var(--panel3);border-color:rgba(245,243,238,.28);transform:translateY(-1px)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}.btn.primary:hover{filter:brightness(1.06)}\n.btn.ai{background:rgba(100,117,245,.15);border-color:rgba(100,117,245,.48);color:#DCE0FF}.btn.ai.active{background:var(--blue);color:white}\n.btn.icon{width:40px;height:40px;padding:0;justify-content:center}\n.icon{width:18px;height:18px;display:inline-block;flex:none}\n.chat-layout{display:grid;grid-template-columns:292px minmax(0,1fr);gap:14px;min-height:0;flex:1}\n.sidebar,.chat-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-height:0}\n.sidebar{display:flex;flex-direction:column;overflow:hidden}\n.sidebar-top{padding:17px 16px 12px}\n.sidebar-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.sidebar-title h2{font-size:16px;margin:0;font-weight:700}\n.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);border-radius:11px;padding:0 11px;height:39px;color:var(--muted)}\n.search input{border:0;outline:0;background:transparent;color:var(--text);width:100%;font-size:12px}.search input::placeholder{color:var(--muted)}\n.filter-row{display:flex;gap:6px;padding:0 16px 10px;overflow:auto;scrollbar-width:none}.filter-row::-webkit-scrollbar{display:none}\n.filter{border:1px solid var(--line);background:transparent;color:var(--sub);padding:7px 10px;border-radius:999px;font-size:11px;white-space:nowrap}.filter.active{background:var(--accent-weak);border-color:rgba(32,196,106,.42);color:#A6F0C4}\n.contact-list{overflow:auto;padding:0 9px 12px;flex:1}\n.group-label{font-size:10px;letter-spacing:1.1px;font-weight:800;color:var(--muted);padding:12px 9px 7px;display:flex;justify-content:space-between;align-items:center}\n.contact{border:1px solid transpar msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),2400)}\nfunction openDrawer(){$('#drawer').classList.add('open');$('#overlay').classList.add('show');document.body.style.overflow='hidden'}\nfunction closeDrawer(){$('#drawer').classList.remove('open');$('#overlay').classList.remove('show');document.body.style.overflow=''}\nfunction openModal(mode){modalMode=mode;const title=mode==='group'?'Create Group':mode==='friend'?'Add Friend':mode==='share'?'Share Workout Plan':'New Conversation';$('#modalTitle').textContent=title;let html='';if(mode==='group')html='<p>สร้างห้องสนทนาสำหรับคุณและเพื่อน ๆ สามารถเพิ่มสมาชิกภายหลังได้</p><div class=\"field\"><label>ชื่อกลุ่ม</label><input id=\"modalName\" placeholder=\"เช่น Weekend Training\" /></div><div class=\"field\"><label>เพิ่มสมาชิก</label><select id=\"modalMembers\" multiple size=\"3\"><option>Friend F1</option><option>Friend F2</option><option>Trainer T1</option></select></div>';else if(mode==='friend')html='<p>ค้นหาเพื่อนเพื่อส่งคำขอเชื่อมต่อ</p><div class=\"field\"><label>อีเมลหรือรหัสผู้ใช้</label><input id=\"modalName\" placeholder=\"name@example.com หรือ User ID\" /></div>';else if(mode==='share')html='<p>เลือกแผนที่ต้องการส่งในห้องสนทนานี้</p><div class=\"field\"><label>Workout Plan</label><select id=\"modalName\"><option>Chest & Triceps</option><option>Full Body Beginner</option><option>Light Cardio & Mobility</option></select></div><p>ผู้รับจะสามารถดูและบันทึกสำเนาไปปรับแต่งได้</p>';else html='<p>เริ่มบทสนทนากับ Trainer หรือ Friend</p><div class=\"field\"><label>เลือกผู้ติดต่อ</label><select id=\"modalName\"><option>Trainer T1</option><option>Trainer T2</option><option>Friend F1</option><option>Friend F2</option></select></div>';\n $('#modalContent').innerHTML=html;$('#modalConfirm').textContent=mode==='friend'?'Send Request':mode==='share'?'Share Plan':mode==='chat'?'Open Chat':'Create';$('#modalBackdrop').classList.add('show');setTimeout(()=>$('#modalName')?.focus(),50)}\nfunction closeModal(){$('#modalBackdrop').classList.remove('show');modalMode=''}\n$('#modalConfirm').addEventListener('click',()=>{const val=$('#modalName')?.value?.trim();if(modalMode==='group'){if(!val){showToast('กรุณาตั้งชื่อกลุ่มก่อน');return}const id='g'+Date.now();conversations.push({id,type:'group',name:val,initial:'G',role:'Group · New group',time:'ตอนนี้',preview:'เริ่มการสนทนาใหม่',unread:0,online:false,messages:[]});renderAllLists();selectConversation(id);showToast('สร้าง Group Chat ตัวอย่างแล้ว')}else if(modalMode==='friend'){if(!val){showToast('กรุณากรอกอีเมลหรือ User ID');return}showToast('ส่งคำขอเป็นเพื่อน (ตัวอย่าง) แล้ว')}else if(modalMode==='share'){const c=conversations.find(x=>x.id===activeId);c.messages.push({from:'me',text:'แชร์แผน: '+val,time:'ตอนนี้'});c.preview='แชร์แผน: '+val;renderMessages(c);renderAllLists();showToast('แชร์ Workout Plan ตัวอย่างแล้ว')}else if(modalMode==='chat'){const c=conversations.find(x=>x.name===val);if(c)selectConversation(c.id)}closeModal()});\n$('#modalClose').onclick=closeModal;$('#modalCancel').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});\n/* [แก้] ลบ $('#sharePlan').onclick และ $('#attachBtn').onclick เดิมที่เปิดหน้าต่างแชร์แผนออกจากบรรทัดนี้ (ไปตั้งใหม่ในส่วน \"แนบไฟล์\" ด้านล่าง) */\n$('#createGroup').onclick=()=>openModal('group');$('#addFriend').onclick=()=>openModal('friend');$('#newChat').onclick=()=>openModal('chat');$('#chatMore').onclick=()=>showToast('เมนูเพิ่มเติม: แจ้งเตือน · ดูโปรไฟล์ · ออกจากกลุ่ม');\n$('#aiTop').onclick=()=>selectConversation('ai');$('#aiSidebar').onclick=()=>selectConversation('ai');$('#aiDrawer').onclick=()=>selectConversation('ai');\n$('#menuBtnInside').onclick=openDrawer;$('#drawerClose').onclick=closeDrawer;$('#overlay').onclick=closeDrawer;$('#drawerGroup').onclick=()=>{closeDrawer();openModal('group')};$('#drawerFriend').onclick=()=>{closeDrawer();openModal('friend')};\n['#searchDesktop','#searchMobile'].forEach(s=>$(s).addEventListener('input',renderAllLists));\n['#filtersDesktop','#filtersMobile'].forEach(s=>$(s).addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.filter-row').forEach(row=>row.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter)));renderAllLists()}));\n/* [แก้] ส่งได้แม้ไม่มีข้อความ ถ้ามีไฟล์แนบ + เก็บไฟล์ไว้กับข้อความ */\n$('#messageForm').addEventListener('submit',e=>{e.preventDefault();const input=$('#messageInput');const text=input.value.trim();if(!text&&!pendingFiles.length)return;if(aiBusy)return;const c=conversations.find(x=>x.id===activeId);const files=pendingFiles;pendingFiles=[];renderPreview();c.messages.push({from:'me',text,files,time:'ตอนนี้'});c.preview=text||'📎 '+files.map(f=>f.name).join(', ');c.time='ตอนนี้';renderMessages(c);renderAllLists();input.value='';input.style.height='42px';if(c.type==='ai')askAI(c);});\n$('#messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#messageForm').requestSubmit()}});\n$('#messageInput').addEventListener('input',e=>{e.target.style.height='42px';e.target.style.height=Math.min(e.target.scrollHeight,115)+'px'});\nlet touchStartX=0,touchStartY=0;document.addEventListener('touchstart',e=>{if(!e.touches.length)return;touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;if(window.innerWidth>760||Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.3)return;if(touchStartX<28&&dx>0)openDrawer();else if($('#drawer').classList.contains('open')&&dx<0)closeDrawer()},{passive:true});\nwindow.addEventListener('resize',()=>{if(window.innerWidth>760)closeDrawer()});\n\n/* ============================================================\n   [เพิ่ม] แนบไฟล์ / รูปภาพ (ปุ่ม + และปุ่ม \"ส่งไฟล์\" ที่หัวแชต)\n   ============================================================ */\nlet pendingFiles=[];\nconst MAX_FILES=6,MAX_MB=10;\nconst fmtSize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';\nfunction toggleAttachMenu(show){$('#attachMenu').classList.toggle('show',show)}\n$('#attachBtn').onclick=e=>{e.stopPropagation();toggleAttachMenu(!$('#attachMenu').classList.contains('show'))};\ndocument.addEventListener('pointerdown',e=>{if(!e.target.closest('#attachMenu,#attachBtn'))toggleAttachMenu(false)});\nfunction openPicker(accept){\n  const fi=$('#fileInput');\n  if(accept)fi.setAttribute('accept',accept);else fi.removeAttribute('accept');\n  toggleAttachMenu(false);fi.click();\n}\n$('#pickImage').onclick=()=>openPicker('image/*');\n$('#pickFile').onclick=()=>openPicker('');\n$('#pickCamera').onclick=()=>{toggleAttachMenu(false);$('#cameraInput').click()};\n$('#sharePlan').onclick=()=>openPicker('');\nfunction addFiles(list){\n  for(const f of list){\n    if(pendingFiles.length>=MAX_FILES){showToast('แนบได้สูงสุด '+MAX_FILES+' ไฟล์');break}\n    if(f.size>MAX_MB*1048576){showToast(f.name+' ใหญ่เกิน '+MAX_MB+' MB');continue}\n    pendingFiles.push({name:f.name,size:f.size,type:f.type||'',url:URL.createObjectURL(f)});\n  }\n  renderPreview();\n}\n$('#fileInput').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});\n$('#cameraInput').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});\nfunction renderPreview(){\n  const root=$('#attachPreview');root.innerHTML='';\n  pendingFiles.forEach((f,i)=>{\n    const d=document.createElement('div');d.className='att-chip';\n    d.innerHTML=(f.type.startsWith('image/')?`<img src=\"${f.url}\" alt=\"\">`:'<div class=\"ficon\">📄</div>')+`<div><span class=\"n\">${escapeHTML(f.name)}</span><small>${fmtSize(f.size)}</small></div><button type=\"button\" class=\"rm\" aria-label=\"Remove\">✕</button>`;\n    d.querySelector('.rm').onclick=()=>{URL.revokeObjectURL(f.url);pendingFiles.splice(i,1);renderPreview()};\n    root.append(d);\n  });\n}\nfunction filesHTML(m){\n  if(!m.files||!m.files.length)return '';\n  return '<div class=\"msg-att\">'+m.files.map(f=>f.type.startsWith('image/')\n    ?`<a href=\"${f.url}\" target=\"_blank\"><img src=\"${f.url}\" alt=\"${escapeHTML(f.name)}\"></a>`\n    :`<a href=\"${f.url}\" download=\"${escapeHTML(f.name)}\">📄 ${escapeHTML(f.name)} · ${fmtSize(f.size)}</a>`).join('')+'</div>';\n}\n\n/* ============================================================\n   AI Coach — ใช้ Gemini เป็นหลัก + ชุดคำตอบสำรอง (AI_RULES)\n   ใส่ API Key ที่ตัวแปร API_KEY ด้านล่าง ถ้าเว้นว่างหรือเรียกไม่ได้ จะใช้คำตอบสำรองแทน\n   อยากเพิ่มคำตอบ: เพิ่มรายการใน AI_RULES (k = คำสำคัญ, r = คำตอบที่สุ่มใช้)\n   ============================================================ */\nconst AI_RULES=[\n {k:['เจ็บ','ปวดมาก','บาดเจ็บ','เคล็ด','ชา','บวม','ฉีก'],r:[\n  'ถ้ามีอาการเจ็บแปลบ บวม หรือชา แนะนำให้หยุดท่านั้นก่อนครับ พักและประคบเย็นช่วงแรก ถ้าไม่ดีขึ้นใน 2-3 วันควรปรึกษาแพทย์หรือนักกายภาพนะครับ',\n  'อาการเจ็บที่เป็นแบบเฉียบพลันไม่ควรฝืนฝึกต่อครับ ลองพักบริเวณนั้นและเปลี่ยนไปฝึกส่วนอื่นแทน ถ้าเจ็บมากหรือเป็นต่อเนื่องควรไปพบแพทย์']},\n {k:['สวัสดี','หวัดดี','hello','hi ','ทักทาย'],r:[\n  'สวัสดีครับ วันนี้อยากให้ผมช่วยเรื่องแผนการฝึก อาหาร หรือการฟื้นตัวดีครับ?',\n  'สวัสดีครับ พร้อมช่วยวางแผนการฝึกให้คุณแล้ว ลองบอกเป้าหมายของคุณได้เลยครับ']},\n {k:['ขอบคุณ','thanks','thank'],r:[\n  'ยินดีครับ มีอะไรอยากถามเพิ่มบอกได้เลยนะครับ','ไม่เป็นไรครับ ขอให้ฝึกสนุกและปลอดภัยครับ 💪']},\n {k:['เหนื่อย','ล้า','อ่อนแรง','เมื่อย','ระบม','doms'],r:[\n  'อาการเมื่อยล้าหลังฝึกเป็นเรื่องปกติครับ วันนี้ลองลดความหนักลงประมาณ 20-30% เน้นยืดเหยียด เดินเบาๆ และนอนให้พอ 7-8 ชั่วโมง ร่างกายจะฟื้นตัวเร็วขึ้นครับ',\n  'ถ้ากล้ามเนื้อระบมให้พักกลุ่มนั้น 1-2 วัน ดื่มน้ำให้พอ กินโปรตีนหลังฝึก และลองทำคาร์ดิโอเบาๆ ช่วยเพิ่มการไหลเวียนเลือดครับ']},\n {k:['อก','chest','วิดพื้น','bench'],r:[\n  'วันฝึกอกแนะนำ Bench Press 3×10, Incline Dumbbell Press 3×12 และ Chest Fly 3×12 พักระหว่างเซ็ต 60-90 วินาทีครับ อย่าลืมวอร์มไหล่ก่อนเริ่ม',\n  'ถ้าอยากเน้นหน้าอก ลองลดน้ำหนักลงแล้วคุมจังหวะลง 2-3 วินาที ดันขึ้นแรงๆ จะรู้สึกที่อกมากกว่าการยกหนักแต่โกงท่าครับ']},\n {k:['ไหล่','shoulder','แขน','ไบเซ็ป','ไตร','bicep','tricep'],r:[\n  'วันแขนและไหล่ลองทำ Shoulder Press 3×10, Lateral Raise 3×15, Bicep Curl 3×12 และ Triceps Pushdown 3×12 ครับ เน้นคุมท่าไม่ต้องแกว่งตัว',\n  'ไหล่เป็นข้อต่อที่บาดเจ็บง่าย ควรวอร์มด้วยการหมุนไหล่และยางยืดก่อนทุกครั้ง แล้วค่อยเพิ่มน้ำหนักทีละน้อยครับ']},\n {k:['หลัง','back','ดึง','pull','เดดลิฟต์','deadlift'],r:[\n  'วันฝึกหลังแนะนำ Lat Pulldown 3×12, Seated Row 3×12 และ Back Extension 3×15 ครับ ดึงโดยใช้หลังนำ ไม่ใช้แรงแขนอย่างเดียว',\n  'ถ้าปวดหลังล่างตอนยกของหนัก ให้เช็กท่าก่อนครับ รักษาหลังให้ตรง เกร็งหน้าท้อง และลดน้ำหนักลงถ้ายังเสียฟอร์ม']},\n {k:['ขา','สควอท','squat','ต้นขา','น่อง','ก้น','leg'],r:[\n  'วันฝึกขาลองทำ Squat 4×10, Leg Press 3×12, Romanian Deadlift 3×10 และ Calf Raise 3×15 ครับ ย่อให้เข่าเลี้ยวตามปลายเท้า ไม่ให้เข่าชิดเข้าใน',\n  'ขาเป็นกล้ามเนื้อมัดใหญ่ ใช้เวลาฟื้นตัวนานกว่าส่วนอื่น หลังฝึกขาควรยืดเหยียดและพัก 48-72 ชั่วโมงก่อนฝึกซ้ำครับ']},\n {k:['หน้าท้อง','ซิกแพ็ก','abs','core','พุง','ลงพุง'],r:[\n  'หน้าท้องเห็นชัดต้องอาศัยทั้งการฝึกและไขมันที่ลดลงครับ ลอง Plank 3×40 วินาที, Leg Raise 3×12 และ Russian Twist 3×20 สัปดาห์ละ 2-3 วัน',\n  'การซิทอัพอย่างเดียวไม่ได้ลดไขมันหน้าท้องเฉพาะจุดครับ ต้องคุมอาหารและเพิ่มคาร์ดิโอร่วมด้วย แล้วหน้าท้องจะค่อยๆ เห็นชัดขึ้น']},\n {k:['ลดน้ำหนัก','ลดไขมัน','ผอม','อ้วน','น้ำหนักเกิน','เบิร์น'],r:[\n  'การลดน้ำหนักหลักๆ คือกินให้น้อยกว่าที่ใช้ไปเล็กน้อย แนะนำลดวันละประมาณ 300-500 กิโลแคลอรี ฝึกเวทสัปดาห์ละ 3 วัน บวกคาร์ดิโอเบาๆ 2 วัน จะลดไขมันโดยไม่เสียกล้ามครับ',\n  'อย่าลดน้ำหนักเร็วเกินไปครับ ประมาณ 0.5-1 กิโลกรัมต่อสัปดาห์กำลังดี และให้กินโปรตีนให้พอเพื่อรักษากล้ามเนื้อ']},\n {k:['เพิ่มกล้าม','สร้างกล้าม','กล้ามโต','ตัวใหญ่','เพิ่มน้ำหนัก','muscle','bulk'],r:[\n  'การสร้างกล้ามต้องมี 3 อย่างครับ คือฝึกเวทให้หนักขึ้นเรื่อยๆ กินโปรตีนให้พอ (ประมาณ 1.6-2 กรัมต่อน้ำหนักตัว 1 กิโลกรัม) และนอนให้พอ',\n  'ลองฝึกแต่ละกล้ามเนื้อ 2 ครั้งต่อสัปดาห์ ท่าละ 8-12 ครั้ง และพยายามเพิ่มน้ำหนักหรือจำนวนครั้งทีละนิดทุกสัปดาห์ครับ']},\n {k:['โปรตีน','อาหาร','กิน','มื้อ','แคลอรี','เวย์','whey','คาร์บ'],r:[\n  'แหล่งโปรตีนที่หาง่ายคืออกไก่ ไข่ ปลา เต้าหู้ และนมครับ พยายามกระจายโปรตีนให้ได้ทุกมื้อ มื้อละประมาณ 20-30 กรัม',\n  'ก่อนฝึก 1-2 ชั่วโมงควรกินคาร์บที่ย่อยง่ายร่วมกับโปรตีนเล็กน้อย หลังฝึกกินโปรตีนและคาร์บเพื่อช่วยฟื้นตัวครับ']},\n {k:['นอน','หลับ','พักผ่อน','ฟื้นตัว','recovery'],r:[\n  'การนอนสำคัญมากต่อการฟื้นตัวครับ พยายามนอน 7-9 ชั่วโมง เข้านอนเวลาเดิมทุกวัน และงดหน้าจอก่อนนอนสัก 30 นาที',\n  'นอกจากการนอน การฟื้นตัวยังขึ้นกับการดื่มน้ำ การกินโปรตีน และการมีวันพักในตารางอย่างน้อย 1-2 วันต่อสัปดาห์ครับ']},\n {k:['วอร์ม','warm','อบอุ่นร่างกาย'],r:[\n  'วอร์มอัพ 5-10 นาทีก่อนฝึกครับ เริ่มจากคาร์ดิโอเบาๆ แล้วตามด้วยท่าเคลื่อนไหวข้อต่อ และทำเซ็ตเบาๆ ของท่าแรกก่อนใช้น้ำหนักจริง']},\n {k:['ยืด','stretch','โยคะ','คูลดาวน์'],r:[\n  'หลังฝึกลองยืดเหยียดกลุ่มกล้ามเนื้อที่ใช้ ค้างท่าละ 20-30 วินาที ไม่ต้องเกร็งหรือกระตุก หายใจเข้าออกช้าๆ ช่วยให้ผ่อนคลายและลดอาการตึงครับ']},\n {k:['คาร์ดิโอ','วิ่ง','ปั่น','ว่ายน้ำ','cardio','เดิน'],r:[\n  'คาร์ดิโอแนะนำสัปดาห์ละ 2-3 ครั้ง ครั้งละ 20-40 นาทีครับ เริ่มจากความเร็วที่ยังพูดเป็นประโยคได้ แล้วค่อยเพิ่มความหนักทีละน้อย',\n  'ถ้ากลัวเสียกล้าม ให้ทำคาร์ดิโอหลังฝึกเวท หรือแยกคนละวันกัน และกินโปรตีนให้พอครับ']},\n {k:['มือใหม่','เริ่มต้น','เริ่มฝึก','beginner','ไม่เคย'],r:[\n  'สำหรับมือใหม่แนะนำโปรแกรม Full Body สัปดาห์ละ 3 วัน เช่น Squat, Push-up หรือ Bench Press, Row, Plank ท่าละ 3×10 เน้นท่าให้ถูกก่อนเพิ่มน้ำหนักครับ',\n  'ช่วงแรกอย่าหักโหมครับ ฝึก 3 วันต่อสัปดาห์ เว้นวันพักคั่น และจดน้ำหนักที่ใช้ไว้ จะเห็นพัฒนาการชัดเจนใน 4-6 สัปดาห์']},\n {k:['แผน','โปรแกรม','ตาราง','plan','ฝึกอะไร','วันนี้ฝึก'],r:[\n  'ตัวอย่างแผน 3 วัน: วันที่ 1 อก-ไหล่-ไตรเซ็ป, วันที่ 2 หลัง-ไบเซ็ป, วันที่ 3 ขา-หน้าท้อง เว้นวันพักคั่นครับ บอกเป้าหมายและจำนวนวันที่ว่างได้ ผมจะปรับให้',\n  'ถ้าอยากได้แผนที่ตรงกับคุณ ลองบอกเป้าหมาย (ลดไขมัน/เพิ่มกล้าม/สุขภาพทั่วไป) และจำนวนวันที่ฝึกได้ต่อสัปดาห์ครับ']}\n];\nconst AI_FALLBACK=[\n 'ขอบคุณที่ถามครับ ลองบอกรายละเอียดเพิ่มเติม เช่น เป้าหมาย ส่วนของร่างกายที่อยากฝึก หรืออาการที่เป็นอยู่ ผมจะแนะนำให้ตรงขึ้นครับ',\n 'ผมช่วยเรื่องแผนการฝึก ท่าออกกำลังกาย อาหาร และการฟื้นตัวได้ครับ ลองถามเช่น \"แผนฝึกอก\" หรือ \"ลดน้ำหนักยังไง\" ดูนะครับ',\n 'ยังไม่แน่ใจว่าตอบตรงประเด็นไหมครับ ช่วยบอกเพิ่มอีกนิดได้ไหมว่าอยากได้คำแนะนำเรื่องการฝึก อาหาร หรือการพักฟื้น?'\n];\nlet aiBusy=false,lastAIReply='';\nfunction setAIBusy(v){aiBusy=v;$('#sendBtn').disabled=v;}\nfunction pickReply(list){\n  let r=list[Math.floor(Math.random()*list.length)];\n  if(list.length>1&&r===lastAIReply)r=list[(list.indexOf(r)+1)%list.length];\n  return r;\n}\nfunction localCoachReply(text){\n  const t=text.toLowerCase();\n  const rule=AI_RULES.find(x=>x.k.some(w=>t.includes(w)));\n  const reply=pickReply(rule?rule.r:AI_FALLBACK);\n  lastAIReply=reply;\n  return reply;\n}\nconst API_KEY = 'YOUR_GEMINI_API_KEY';   // <<< ใส่ Gemini API Key ตรงนี้ (ขอฟรีได้ที่ aistudio.google.com) — ถ้าเว้นว่างจะใช้คำตอบสำรอง\nconst AI_MODELS = ['gemini-3.8-flash','gemini-3.8-flash-lite'];  // ลองตัวแรกก่อน ถ้าใช้ไม่ได้/ไม่ว่างจะลองตัวถัดไป\nconst SYSTEM_PROMPT = `คุณคือ \"AI Coach\" ผู้ช่วยด้านฟิตเนสในแอป FORGE ที่รวมแผนการฝึก แชตกับเทรนเนอร์ และเพื่อนในที่เดียว\nหน้าที่: ตอบคำถามเรื่องการฝึกเวท คาร์ดิโอ ท่าออกกำลังกาย การจัดโปรแกรม โภชนาการ การพักฟื้น การนอน และการสร้างนิสัย\nวิธีตอบ:\n- ตอบเป็นภาษาไทย เป็นกันเองแต่เป็นมืออาชีพ ใช้คำลงท้าย \"ครับ\"\n- ตอบให้ละเอียดและนำไปใช้ได้จริง ประมาณ 8-15 ประโยค (หรือเป็นข้อๆ) ไม่ตอบสั้นห้วน\n- เริ่มด้วยคำตอบตรงคำถาม แล้วอธิบายเหตุผล ขั้นตอน ตัวเลขที่ชัดเจน (จำนวนเซ็ต×ครั้ง เวลาพัก ปริมาณโปรตีน ฯลฯ) ข้อผิดพลาดที่พบบ่อย และเคล็ดลับ\n- ถ้าขอแผนหรือโปรแกรม ให้จัดเป็นรายวัน ระบุท่า เซ็ต×ครั้ง เวลาพัก และวิธีเพิ่มความหนักในแต่ละสัปดาห์\n- จบด้วยคำถามต่อ 1 ข้อเพื่อปรับให้ตรงกับผู้ใช้ (เช่น เป้าหมาย ประสบการณ์ จำนวนวันที่ว่าง อุปกรณ์ อาการบาดเจ็บ) ถ้ายังไม่เคยบอก\n- อ้างอิงบทสนทนาก่อนหน้า ไม่ถามซ้ำสิ่งที่ผู้ใช้บอกแล้ว\n- ห้ามใช้เครื่องหมาย markdown เช่น # ใช้ตัวเลข \"1.\" หรือขีด \"-\" ขึ้นต้นบรรทัดสำหรับรายการ และใช้ **ข้อความ** ได้เฉพาะหัวข้อสั้นๆ\n- ถ้ามีอาการเจ็บแปลบ บวม ชา เวียนหัว เจ็บหน้าอก หรืออาการผิดปกติ ให้แนะนำให้หยุดและปรึกษาแพทย์\n- ไม่วินิจฉัยโรค ไม่แนะนำสเตียรอยด์หรือการอดอาหารรุนแรง\n- ถ้าถามเรื่องที่ไม่เกี่ยวกับสุขภาพและการออกกำลังกาย ให้ตอบสั้นๆ แล้วชวนกลับมาเรื่องการฝึก`;\n\nfunction updateCoachHint(){\n  if(activeId!=='ai')return;\n  $('#composerHint').textContent=API_KEY?'AI Coach พร้อมช่วยวางแผนและตอบคำถามของคุณ':'โหมดสำรอง: ยังไม่ได้ใส่ API Key (ตอบจากชุดคำตอบที่เขียนไว้)';\n}\nconst sleep=ms=>new Promise(r=>setTimeout(r,ms));\nlet thinkOK=true;   // ลดเวลา \"คิด\" ของโมเดลให้ตอบเร็วขึ้น ถ้าโมเดลไม่รองรับจะปิดเองอัตโนมัติ\nasync function callGeminiStream(contents,onText){\n  let lastErr=new Error('เรียก AI ไม่สำเร็จ');\n  for(const model of AI_MODELS){\n    for(let i=0;i<3;i++){\n      const generationConfig={temperature:0.7,maxOutputTokens:3000};\n      if(thinkOK)generationConfig.thinkingConfig={thinkingLevel:'low'};\n      let r;\n      try{\n        r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':streamGenerateContent?alt=sse',{\n          method:'POST',\n          headers:{'Content-Type':'application/json','x-goog-api-key':API_KEY},\n          body:JSON.stringify({systemInstruction:{parts:[{text:SYSTEM_PROMPT}]},contents,generationConfig})\n        });\n      }catch(e){lastErr=e;await sleep(1000*(i+1));continue;}\n      if(!r.ok){\n        let msg='HTTP '+r.status;\n        try{const d=await r.json();if(d.error&&d.error.message)msg=d.error.message;}catch(e){}\n        lastErr=new Error(msg);\n        if(r.status===400&&thinkOK&&/think/i.test(msg)){thinkOK=false;i--;continue;}  // โมเดลไม่รองรับตัวเลือกนี้ ปิดแล้วลองใหม่\n        if(r.status===404)break;\n        if(r.status===503||r.status===429||/high demand/i.test(msg)){await sleep(1200*(i+1));continue;}\n        throw lastErr;\n      }\n      let acc='';\n      try{\n        const reader=r.body.getReader(),dec=new TextDecoder();let buf='';\n        for(;;){\n          const {done,value}=await reader.read();if(done)break;\n          buf+=dec.decode(value,{stream:true});\n          const lines=buf.split('\\n');buf=lines.pop();\n          for(const ln of lines){\n            if(!ln.startsWith('data:'))continue;\n            const j=ln.slice(5).trim();if(!j||j==='[DONE]')continue;\n            try{\n              const d=JSON.parse(j);\n              const parts=d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts;\n              if(parts){acc+=parts.map(p=>p.thought?'':(p.text||'')).join('');onText(acc);}\n            }catch(e){}\n          }\n        }\n      }catch(e){lastErr=e;}\n      if(acc.trim())return acc.trim();   // ได้คำตอบ (แม้สตรีมจะหลุดกลางทางก็เก็บเท่าที่ได้)\n      lastErr=new Error('ไม่ได้รับคำตอบ');break;\n    }\n  }\n  throw lastErr;\n}\nasync function askAI(c){\n  setAIBusy(true);\n  const pending={from:'them',text:'กำลังคิด...',time:'ตอนนี้',pending:true};\n  c.messages.push(pending);\n  if(activeId===c.id)renderMessages(c);\n  const lastUser=[...c.messages].reverse().find(m=>m.from==='me');\n  let finalText='',raf=0;\n  if(API_KEY){\n    try{\n      /* [แก้] ถ้ามีไฟล์แนบ ส่งชื่อไฟล์ให้ AI รู้ (ยังอ่านเนื้อหาไฟล์ไม่ได้) */\n      const contents=c.messages.filter(m=>m!==pending&&!m.pending&&!m.error&&(m.from==='me'||m.from==='them')).slice(-14).map(m=>({role:m.from==='me'?'user':'model',parts:[{text:(m.text||'')+(m.files&&m.files.length?'\\n[ผู้ใช้แนบไฟล์: '+m.files.map(f=>f.name).join(', ')+']':'')}]}));\n      while(contents.length&&contents[0].role!=='user')contents.shift();\n      finalText=await callGeminiStream(contents,t=>{\n        pending.text=t;pending.pending=false;\n        if(!raf)raf=requestAnimationFrame(()=>{raf=
