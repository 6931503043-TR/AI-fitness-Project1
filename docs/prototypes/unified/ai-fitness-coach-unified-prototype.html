dical-callout\">กรอกเฉพาะข้อมูลที่จำเป็นต่อการปรับแผน และคัดลอกคำแนะนำจากแพทย์ตามที่ได้รับจริง อย่าให้ AI เดาข้อจำกัดหรือกำหนดระดับการออกกำลังกายแทนแพทย์</div>\n            <div class=\"medical-fields\">\n              <label class=\"medical-field full\"><span>โรคประจำตัว / ภาวะสุขภาพ</span><input id=\"medical-condition\" type=\"text\" placeholder=\"ระบุชื่อภาวะตามที่ได้รับการวินิจฉัย\" autocomplete=\"off\"></label>\n              <label class=\"medical-field full\"><span>คำสั่งหรือคำแนะนำจากแพทย์ <b style=\"color:var(--accent)\">จำเป็น</b></span><textarea id=\"medical-instructions\" placeholder=\"ใส่คำแนะนำจากแพทย์ตามจริง เช่น ข้อจำกัด ระดับความหนัก ระยะเวลา หรือเงื่อนไขที่ต้องปฏิบัติตาม\"></textarea></label>\n              <label class=\"medical-field full\"><span>ท่าหรือกิจกรรมที่แพทย์ระบุให้หลีกเลี่ยง (ถ้ามี)</span><textarea id=\"medical-avoid\" placeholder=\"ระบุข้อห้ามเพิ่มเติมตามคำแนะนำจากแพทย์\"></textarea></label>\n            </div>\n            <label class=\"check-row\"><input type=\"checkbox\" id=\"medical-confirmed\"><span>ฉันยืนยันว่าได้ปรึกษาบุคลากรทางการแพทย์ที่ดูแลฉันเกี่ยวกับการออกกำลังกายแล้ว และข้อมูลที่กรอกเป็นคำแนะนำล่าสุดที่ได้รับ</span></label>\n <label class=\"check-row\"><input type=\"checkbox\" id=\"medical-consent\"><span>ฉันยินยอมให้ส่งข้อมูลสุขภาพที่กรอกไว้ข้างต้นไปยังระบบ AI (ผ่านเซิร์ฟเวอร์ของแอป หรือผู้ให้บริการที่ฉันเลือกเอง) เพื่อใช้สร้างร่างแผนเท่านั้น</span></label>\n          </div>\n          <label class=\"check-row\"><input type=\"checkbox\" id=\"medical-understand\" required><span>ฉันเข้าใจว่าแผนที่ AI เสนอเป็นเพียงร่างเพื่อให้ตรวจสอบ ไม่ใช่การวินิจฉัย การอนุญาตให้ออกกำลังกาย หรือการรับรองความปลอดภัยทางการแพทย์</span></label>\n          <div style=\"display:flex;gap:9px;flex-wrap:wrap;margin-top:20px\"><button class=\"btn primary\" type=\"submit\" id=\"medical-submit\">✦ Generate AI Draft</button><button class=\"btn ghost\" type=\"button\" id=\"medical-clear\">ล้างข้อมูล</button></div>\n          <p class=\"note\" id=\"medical-note\"></p><p class=\"ai-msg err\" id=\"medical-error\"></p>\n        </form>\n        <aside class=\"medical-side\">\n          <div class=\"eyebrow\">DESIGN PRINCIPLES</div><h2 class=\"panel-heading\" style=\"margin-top:6px\">Medical-aware planning</h2>\n          <p class=\"panel-sub\">แนวทางที่ระบบ AI ควรปฏิบัติเมื่อได้รับข้อมูลสุขภาพและคำสั่งแพทย์</p>\n          <ul>\n            <li>ใช้คำสั่งแพทย์ที่ผู้ใช้ให้มาเป็นข้อจำกัด ไม่เขียนทับหรือขยายความเอง</li>\n            <li>ไม่แนะนำท่าหรือระดับความหนักที่ขัดกับข้อจำกัดที่ระบุ</li>\n            <li>เมื่อคำสั่งไม่ชัดเจนหรือขัดแย้งกัน ต้องขอให้ผู้ใช้ยืนยันกับแพทย์ ไม่เดาคำตอบ</li>\n            <li>แสดงแผนเป็น Draft เพื่อให้ผู้เชี่ยวชาญที่เกี่ยวข้องตรวจสอบก่อนนำไปใช้</li>\n          </ul>\n          <div class=\"medical-info\"><strong>ขอบเขตความรับผิดชอบ</strong><br>AI ช่วยจัดโครงสร้างและเสนอแผนเบื้องต้นได้ แต่ไม่สามารถตัดสินว่าโรคหรืออาการนั้นออกกำลังกายได้อย่างปลอดภัยหรือแทนคำสั่งแพทย์ได้</div>\n        </aside>\n      </div>\n      <section class=\"medical-result\" id=\"medical-result\" hidden aria-live=\"polite\">\n        <div class=\"draft-status\">● DRAFT · REVIEW REQUIRED</div>\n        <h2 class=\"section-title\" style=\"margin:12px 0 4px\">AI Plan Draft Preview</h2>\n        <p class=\"panel-sub\" id=\"medical-result-sub\" style=\"margin-bottom:0\"></p>\n        <div class=\"draft-summary\">\n          <div><small>Health condition</small><strong id=\"draft-condition\">—</strong></div>\n          <div><small>Goal / Available time</small><strong id=\"draft-goal\">—</strong></div>\n          <div><small>Body Focus</small><strong id=\"draft-focus\">—</strong></div>\n          <div><small>Physician instructions</small><strong id=\"draft-instructions\">—</strong></div>\n          <div><small>Activities to avoid</small><strong id=\"draft-avoid\">—</strong></div>\n        </div>\n        <h3 class=\"panel-heading\" style=\"margin-top:18px\">Draft structure</h3>\n        <div id=\"draft-body\"></div>\n        <d \"info-panel\"><h3 class=\"panel-heading\">Template Overview</h3><p class=\"panel-sub\">ข้อมูลตัวอย่างของแผนสำเร็จรูป</p><div class=\"info-row\"><span>Plan type</span><strong id=\"info-type\">Strength</strong></div><div class=\"info-row\"><span>Level</span><strong id=\"info-level\">Beginner</strong></div><div class=\"info-row\"><span>Duration</span><strong id=\"info-duration\">45–60 min</strong></div><div class=\"info-row\"><span>Frequency</span><strong id=\"info-frequency\">3 days / week</strong></div><p class=\"note\">Template ในหน้านี้เป็นข้อมูล Mockup สำหรับทดลอง UI ไม่ใช่คำแนะนำการฝึกเฉพาะบุคคล</p></aside>\n      </div>\n    </section>\n\n    <section id=\"screen-ai\" class=\"screen\">\n      <button class=\"back\" data-back=\"detail\" aria-label=\"กลับไปเลือก Body Focus\" title=\"กลับไปเลือก Body Focus\"><svg class=\"back-arrow\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 12H5M11 6l-6 6 6 6\"/></svg></button>\n      <div class=\"page-head\"><div><div class=\"eyebrow\">PERSONALIZED PREVIEW</div><h1 class=\"page-title\">Your Adjusted Plan</h1><p class=\"page-sub\">ตัวอย่างหน้าผลลัพธ์หลัง AI นำ Body Focus และข้อมูลผู้ใช้มาพิจารณา</p></div><span class=\"tag\" id=\"ai-tag\" style=\"color:var(--mint);border-color:rgba(85,199,181,.35)\">DEMO PREVIEW</span></div>\n      <div class=\"ai-banner\"><div class=\"ai-mark\">✦</div><div style=\"flex:1;min-width:0\"><strong id=\"ai-banner-title\">AI adjustment preview</strong><p id=\"ai-banner-text\"></p></div><button class=\"btn small\" id=\"ai-connect-inline\" hidden>Connect AI</button></div>\n      <div class=\"ai-layout\"><section class=\"panel\"><div class=\"section-head\" style=\"margin:0 0 12px\"><div><h2 class=\"section-title\">Workout Breakdown</h2><p class=\"section-note\" id=\"ai-focus-label\"></p></div><span class=\"tag\">SAMPLE</span></div><div class=\"exercise-list\" id=\"ai-exercises\"></div><div class=\"medical-info\" id=\"ai-rationale\" hidden></div></section><aside class=\"panel\"><h3 class=\"panel-heading\">Adjustment Summary</h3><p class=\"panel-sub\">ปัจจัยที่ระบบควรนำมาพิจารณา</p><div class=\"summary-metric\"><span>Selected focus</span><strong id=\"summary-focus\">—</strong></div><div class=\"summary-metric\"><span>Available time</span><strong id=\"summary-time\">45 min · ตัวอย่าง</strong></div><div class=\"summary-metric\"><span>Training history</span><strong>ต้องใช้ข้อมูลผู้ใช้</strong></div><div class=\"summary-metric\"><span>Fatigue / Recovery</span><strong>ต้องใช้ข้อมูลผู้ใช้</strong></div><div class=\"summary-metric\"><span>Limitations</span><strong>ต้องตรวจสอบ</strong></div><p class=\"note\">ไม่มีการรับรองความปลอดภัยทางการแพทย์จาก AI ในหน้าจอตัวอย่างนี้ แผนจริงอาจต้องผ่าน Trainer Review ตาม Workflow ของโปรเจกต์</p></aside></div>\n      <div class=\"actions-row\"><button class=\"btn ghost\" id=\"ai-customize\">Customize Plan</button><button class=\"btn primary\" id=\"ai-use\">Use This Plan</button></div>\n    </section>\n\n    <section id=\"screen-builder\" class=\"screen\">\n      <button class=\"back\" data-back=\"home\" id=\"builder-back\" aria-label=\"กลับไปหน้า Plan\" title=\"กลับไปหน้า Plan\"><svg class=\"back-arrow\" viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 12H5M11 6l-6 6 6 6\"/></svg></button>\n      <div class=\"page-head\"><div><div class=\"eyebrow\">PLAN BUILDER</div><h1 class=\"page-title\" id=\"builder-title\">Customize Plan</h1><p class=\"page-sub\" id=\"builder-sub\">ปรับรายละเอียดท่าออกกำลังกาย แล้วบันทึกเป็นแผนของคุณ</p></div></div>\n      <div class=\"builder-layout\"><section class=\"builder-list\"><div class=\"section-head\" style=\"margin:0 0 10px\"><div><h2 class=\"section-title\">Exercises</h2><p class=\"section-note\">แก้ไขชื่อท่า จำนวนเซต และจำนวนครั้งต่อเซตได้</p></div><span class=\"tag\" id=\"builder-source\">CUSTOM</span></div><div class=\"builder-legend\"><span><b>เซต (Sets)</b> = จำนวนรอบที่ทำ</span><span><b>ครั้ง (Reps)</b> = จำนวนครั้งต่อ 1 เซต หรือเวลา เช่น 10, 8-12, 30 sec</span><span>ตัวอย่าง: <em>3 เซต × 10 ครั้ง</em> = ทำ 10 ครั้ง พัก แล้วทำซ้ำรวม 3 รอบ</span></div><div id=\"builder-exercises\"></div><div class=\"add-row\"><label class=\"cell\"><span class=\"cell-label\">ชื่อท่าใหม่</span><input id=\"new-exercise\" placeholder=\"เช่น Lat Pulldown\" aria-label=\"Exercise name\"></label><label class=\"cell\"><span class=\"cell-label\">เซต<small>Sets</small></span><input id=\"new-sets\" type=\"number\" inputmode=\"numeric\" min=\"1\" value=\"3\" aria-label=\"Sets\"></label><label class=\"cell\"><span class=\"cell-label\">ครั้ง<small>Reps</small></span><input id=\"new-reps\" placeholder=\"10 หรือ 8-12\" value=\"10\" aria-label=\"Reps\"></label><button class=\"btn small\" id=\"add-exercise\">＋ เพิ่มท่า</button></div>\n<div class=\"ai-assist\"><div class=\"eyebrow\" style=\"color:var(--mint)\">AI ASSISTANT</div><h3 class=\"panel-heading\" style=\"margin-top:4px\">ให้ AI ช่วยปรับแผนนี้</h3><p class=\"panel-sub\" style=\"margin-bottom:0\">บอกสิ่งที่อยากเปลี่ยน AI จะเสนอรายการใหม่ให้ดูก่อน แล้วคุณเลือกว่าจะใช้หรือไม่</p>\n<div class=\"ai-chips\"><button class=\"ai-chip\" data-ask=\"ลดเวลาซ้อมให้เหลือประมาณ 30 นาที\">ลดเวลาเหลือ ~30 นาที</button><button class=\"ai-chip\" data-ask=\"เพิ่มท่าสำหรับ Core 2 ท่า\">เพิ่มท่า Core</button><button class=\"ai-chip\" data-ask=\"ปรับให้ไม่ต้องใช้อุปกรณ์ เล่นที่บ้านได้\">ไม่ใช้อุปกรณ์</button><button class=\"ai-chip\" data-ask=\"ทำให้ง่ายขึ้นสำหรับมือใหม่\">ง่ายขึ้นสำหรับมือใหม่</button></div>\n<div class=\"ai-ask-row\"><input id=\"ai-ask\" placeholder=\"เช่น เพิ่มท่าหลังอีก 1 ท่า หรือ เปลี่ยนเป็นแผน 3 วัน/สัปดาห์\" aria-label=\"Ask AI to edit the plan\"><button class=\"btn small primary\" id=\"ai-ask-btn\">✦ Ask AI</button></div>\n<p class=\"ai-msg err\" id=\"ai-ask-error\"></p><div class=\"ai-proposal\" id=\"ai-proposal\" hidden></div><button class=\"btn small ghost\" id=\"ai-undo\" hidden style=\"margin-top:10px\">↶ ย้อนการแก้ไขของ AI</button></div>\n</section><aside class=\"builder-side\"><h3 class=\"panel-heading\">Plan Details</h3><label class=\"field\"><span style=\"display:block;font-size:11px;color:var(--muted);margin-bottom:6px\">ชื่อแผน</span><input class=\"field-input\" id=\"builder-name\" value=\"My Workout Plan\"></label><label class=\"field\"><span style=\"display:block;font-size:11px;color:var(--muted);margin-bottom:6px\">Body Focus</span><input class=\"field-input\" id=\"builder-focus\" readonly></label><label class=\"field\"><span style=\"display:block;font-size:11px;color:var(--muted);margin-bottom:6px\">หมายเหตุ</span><input class=\"field-input\" id=\"builder-note\" placeholder=\"เพิ่มรายละเอียด (ไม่บังคับ)\"></label><button class=\"btn primary\" id=\"save-plan\">Save to My Plans</button><button class=\"btn ghost\" id=\"cancel-builder\">Cancel</button><p class=\"note\">บันทึกใน Browser นี้ด้วย localStorage เพื่อทดลอง Prototype เท่านั้น</p></aside></div>\n    </section>\n\n    <section id=\"screen-myplans\" class=\"screen\">\n      <div class=\"page-head\"><div><div class=\"eyebrow\">YOUR LIBRARY</div><h1 class=\"page-title\">My Plans</h1><p class=\"page-sub\">แผนที่คุณเลือกหรือสร้างไว้ สามารถกลับมาเปิดดูหรือปรับแต่งสำเนาได้</p></div><button class=\"btn primary\" id=\"myplans-create\">＋ Create Plan</button></div>\n      <div id=\"saved-plans\"></div>\n    </section>\n  </main>\n  <nav class=\"mobile-nav\"><button class=\"active\" data-screen=\"home\"><span class=\"nav-symbol\">▤</span>Plan</button><button data-screen=\"myplans\"><span class=\"nav-symbol\">▣</span>My Plans</button></nav>\n</div>\n<div class=\"modal-backdrop\" id=\"create-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title\"><div class=\"modal\"><div class=\"modal-head\"><h2 id=\"modal-title\">Create Plan</h2><button class=\"icon-btn\" id=\"close-modal\" aria-label=\"Close\">×</button></div><p>เลือกวิธีเริ่มต้นสร้าง Workout Plan ของคุณ</p><button class=\"choice\" id=\"modal-template\"><span class=\"choice-icon\">▤</span><span><strong>Start from Template</strong><small>เลือกแผนสำเร็จรูปแล้วแก้ไขเป็นสำเนาของคุณ</small></span></button><button class=\"choice\" id=\"modal-scratch\"><span class=\"choice-icon\">＋</span><span><strong>Start from Scratch</strong><small>เริ่มสร้างแผนใหม่โดยไม่มีท่าเริ่มต้น</small></span></button></div></div>\n<div class=\"modal-backdrop\" id=\"ai-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"ai-modal-title\"><div class=\"modal wide\">\n<div class=\"modal-head\"><h2 id=\"ai-modal-title\">✦ AI Assistant</h2><button class=\"icon-btn\" id=\"ai-close\" aria-label=\"Close\">×</button></div>\n<p>เชื่อมต่อผู้ให้บริการ AI ที่คุณใช้อยู่ เพื่อให้ Create with AI, ปรับแผนด้วย AI และผู้ช่วยในหน้า Customize Plan ทำงานจริง</p>\n<label class=\"ai-field\"><span>ผู้ให้บริการ</span><select id=\"ai-provider\"><option value=\"anthropic\">Claude (Anthropic)</option><option value=\"openai\">OpenAI</option><option value=\"gemini\">Google Gemini</option><option value=\"groq\">Groq (free tier available)</option><option value=\"custom\">Custom (OpenAI-compatible)</option></select></label>\n<label class=\"ai-field\" id=\"ai-base-wrap\" hidden><span>Base URL</span><input id=\"ai-base\" placeholder=\"http://localhost:11434/v1\" autocomplete=\"off\" spellcheck=\"false\"></label>\n<label class=\"ai-field\"><span id=\"ai-key-label\">API key</span><input id=\"ai-key\" type=\"password\" autocomplete=\"off\" spellcheck=\"false\"></label>\n<p class=\"ai-help\" id=\"ai-key-help\" style=\"margin-top:-4px\"></p>\n<label class=\"ai-field\"><span>Model</span><input id=\"ai-model\" list=\"ai-model-list\" autocomplete=\"off\" spellcheck=\"false\"><datalist id=\"ai-model-list\"></datalist></label>\n<p class=\"ai-help\" id=\"ai-model-help\" style=\"margin-top:-4px\">ชื่อโมเดลเปลี่ยนบ่อย — กด Test connection เพื่อดึงรายการโมเดลที่ใช้ได้จริงกับคีย์ของคุณ</p>\n<label class=\"check-row\"><input type=\"checkbox\" id=\"ai-remember\"><span>จำการตั้งค่านี้ไว้ในเบราว์เซอร์นี้ (ถ้าไม่เลือก จะหายเมื่อปิดแท็บ) — อย่าเลือกถ้าใช้เครื่องที่ไม่ใช่ของคุณ</span></label>\n<div class=\"ai-privacy\" id=\"ai-privacy\">คีย์ถูกเก็บในเบราว์เซอร์นี้เท่านั้น และส่งตรงไปยังผู้ให้บริการที่เลือก ไม่ผ่านเซิร์ฟเวอร์ของเว็บนี้ · อย่าใส่คีย์ลงในโค้ดหรืออัปโหลดขึ้น GitHub · ข้อมูลที่คุณกรอกเมื่อสั่ง AI (รวมถึงข้อมูลสุขภาพถ้ามี) จะถูกส่งไปยังผู้ให้บริการนั้น และคิดค่าใช้จ่ายตามบัญชี API ของคุณ</div>\n<p class=\"ai-msg\" id=\"ai-modal-msg\"></p>\n<div class=\"modal-actions\"><button class=\"btn primary\" id=\"ai-save\">Save</button><button class=\"btn ghost\" id=\"ai-test\">Test connection</button><button class=\"btn ghost\" id=\"ai-disconnect\">Disconnect</button></div>\n</div></div>\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"></div>\n<script>\nconst templates=[\n {id:'fullbody',name:'Full Body Foundation',kicker:'STRENGTH · BEGINNER',category:'gym',categoryLabel:'GYM TEMPLATE',desc:'Build a balanced foundation with a simple full-body routine.',level:'Beginner',duration:'45–60 min',frequency:'3 days / week',image:'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1200&q=85',exercises:[['Goblet Squat',3,12],['Dumbbell Bench Press',3,10],['Lat Pulldown',3,12],['Dumbbell Romanian Deadlift',3,10]]},\n {id:'upper',name:'Upper Body Split',kicker:'STRENGTH · INTERMEDIATE',category:'gym',categoryLabel:'GYM TEMPLATE',desc:'A focused upper-body session covering push and pull patterns.',level:'Intermediate',duration:'50–65 min',frequency:'2 days / week',image:'https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=1200&q=85',exercises:[['Bench Press',4,8],['Seated Cable Row',3,10],['Shoulder Press',3,10],['Cable Triceps Pushdown',3,12]]},\n {id:'conditioning',name:'Athletic Conditioning',kicker:'CARDIO · ALL LEVELS',category:'cardio',categoryLabel:'CARDIO TEMPLATE',desc:'Combine steady movement and short intervals to build conditioning.',level:'All levels',duration:'30–40 min',frequency:'2–3 days / week',image:'https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1200&q=85',exercises:[['Treadmill Walk / Jog',1,'15 min'],['Stationary Bike',1,'10 min'],['Bodyweight Step-ups',3,12]]},\n {id:'mobility',name:'Mobility & Reset',kicker:'MOBILITY · BEGINNER',category:'yoga',categoryLabel:'MOBILITY TEMPLATE',desc:'A gentle mobility-focused session with controlled movement and holds.',level:'Beginner',duration:'20–30 min',frequency:'2–4 days / week',image:'https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=1200&q=85',exercises:[['Cat-Cow',2,'8 reps'],['World’s Greatest Stretch',2,'5 / side'],['Child’s Pose',2,'30 sec'],['Hip Flexor Stretch',2,'30 sec']]}\n];\nconst focusAreas=[['chest','Chest','◉'],['back','Back','▤'],['shoulders','Shoulders','◈'],['biceps','Biceps','⌁'],['triceps','Triceps','⌁'],['legs','Legs','▥'],['core','Core','◎']];\nlet visibleTemplates=[...templates],activeIndex=1,selectedTemplate=templates[1],selectedFocus=[],builderExercises=[],aiPreviewExercises=[],builderSource='Custom',builderOrigin='home';\nconst $=id=>document.getElementById(id);\nfunction toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2300)}\nfunction showScreen(name){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id==='screen-'+name));document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===name));window.scrollTo({top:0,behavior:'smooth'});if(name==='myplans')renderSavedPlans()}\nfunction renderCarousel(){const track=$('template-track');track.innerHTML=visibleTemplates.map((p,i)=>`<button class=\"template-card ${i===activeIndex?'active':''}\" data-index=\"${i}\" aria-label=\"Open ${p.name}\"><span class=\"photo\" style=\"background-image:url('${p.image}')\"></span><span class=\"card-topline\"><span class=\"tag\">${p.categoryLabel}</span><span class=\"tag\">${p.level}</span></span><span class=\"template-copy\"><span class=\"template-kicker\">${p.kicker}</span><span class=\"template-name\">${p.name}</span><span class=\"template-desc\">${p.desc}</span><span class=\"template-meta\"><span>◷ ${p.duration}</span><span>▦ ${p.frequency}</span></span></span></button>`).join('');$('carousel-dots').innerHTML=visibleTemplates.map((p,i)=>`<button class=\"dot ${i===activeIndex?'active':''}\" data-dot=\"${i}\" aria-label=\"Go to template ${i+1}\"></button>`).join('');requestAnimationFrame(()=>{const card=track.querySelectorAll('.template-card')[activeIndex];if(card)card.scrollIntoView({inline:'center',block:'nearest',behavior:'auto'})})}\nfunction setActive(index){if(!visibleTemplates.length)return;activeIndex=(index+visibleTemplates.length)%visibleTemplates.length;renderCarousel()}\nfunction filterTemplates(type){visibleTemplates=type==='all'?[...templates]:templates.filter(t=>t.category===type);activeIndex=Math.min(1,visibleTemplates.length-1);document.querySelectorAll('.type-chip').forEach(b=>b.classList.toggle('active',b.dataset.type===type));renderCarousel()}\n$('template-track').addEventListener('click',e=>{const card=e.target.closest('.template-card');if(!card)return;const i=Number(card.dataset.index);selectedTemplate=visibleTemplates[i];openDetails(selectedTemplate)});\n$('carousel-dots').addEventListener('click',e=>{const dot=e.target.closest('[data-dot]');if(dot)setActive(Number(dot.dataset.dot))});$('prev-card').onclick=()=>setActive(activeIndex-1);$('next-card').onclick=()=>setActive(activeIndex+1);$('type-list').onclick=e=>{const b=e.target.closest('[data-type]');if(b)filterTemplates(b.dataset.type)};\nfunction openDetails(template){selectedTemplate=template;selectedFocus=[];$('detail-hero').style.backgroundImage=`url('${template.image}')`;$('detail-category').textContent=template.categoryLabel;$('detail-title').textContent=template.name;$('detail-description').textContent=template.desc;$('detail-stats').innerHTML=`<span>◷ ${template.duration}</span><span>▦ ${template.frequency}</span><span>◆ ${template.level}</span>`;$('info-type').textContent=template.categoryLabel.replace(' TEMPLATE','');$('info-level').textContent=template.level;$('info-duration').textContent=template.duration;$('info-frequency').textContent=template.frequency;renderFocus();showScreen('detail')}\nfunction renderFocus(){$('focus-grid').innerHTML=focusAreas.map(([id,label,icon])=>`<button class=\"focus-option ${selectedFocus.includes(id)?'selected':''}\" data-focus=\"${id}\" aria-pressed=\"${selectedFocus.includes(id)}\"><span class=\"muscle-icon\">${icon}</span>${label}</button>`).join('');$('selection-count').textContent=`เลือกแล้ว ${selectedFocus.length} ส่วน`;$('adjust-plan').disabled=selectedFocus.length===0}\n$('focus-grid').addEventListener('click',e=>{const b=e.target.closest('[data-focus]');if(!b)return;const id=b.dataset.focus;selectedFocus=selectedFocus.includes(id)?selectedFocus.filter(x=>x!==id):[...selectedFocus,id];renderFocus()});\nconst focusNames=()=>selectedFocus.map(id=>focusAreas.find(x=>x[0]===id)?.[1]).filter(Boolean);\n$('adjust-plan').onclick=()=>{if(!selectedFocus.length)return;renderAiPreview();showScreen('ai')};\nfunction renderAiPreview(){const focus=focusNames();$('ai-focus-label').textContent=`${selectedTemplate.name} · ${focus.join(' + ')}`;$('summary-focus').textContent=focus.join(' + ');let items=selectedTemplate.exercises.slice(0,4);if(focus.includes('chest')&&!items.some(x=>/bench|push/i.test(x[0])))items.unshift(['Dumbbell Bench Press',3,10]);if(focus.includes('legs')&&!items.some(x=>/squat|leg/i.test(x[0])))items.push(['Goblet Squat',3,10]);if(focus.includes('back')&&!items.some(x=>/row|pull|lat/i.test(x[0])))items.push(['Seated Cable Row',3,10]);items=items.slice(0,5);aiPreviewExercises=items;$('ai-exercises').innerHTML=items.map((x,i)=>`<div class=\"exercise-item\"><div class=\"exercise-number\">${String(i+1).padStart(2,'0')}</div><div class=\"exercise-art\">${['↗','⇵','↔','◉','⌁'][i%5]}</div><div class=\"exercise-text\"><strong>${x[0]}</strong><small>Suggested exercise · Sample data</small></div><div class=\"volume\">${x[1]} sets<br>${x[2]} reps</div></div>`).join('')}\nfunction startBuilder(exercises,source,name,focus,origin='home'){resetBuilderAI();builderExercises=exercises.map(x=>Array.isArray(x)?({name:x[0],sets:x[1],reps:x[2]}):({name:x.name,sets:x.sets,reps:x.reps}));builderSource=source;builderOrigin=origin;$('builder-title').textContent=source==='Scratch'?'Create Custom Plan':'Customize Plan';$('builder-sub').textContent=source==='Scratch'?'เริ่มสร้างแผนใหม่ด้วยการเพิ่มท่าออกกำลังกาย':'แก้ไขสำเนาของแผนต้นฉบับ รายการที่แก้ไขจะไม่เปลี่ยน Template';$('builder-source').textContent=source.toUpperCase();$('builder-name').value=name||'My Workout Plan';$('builder-focus').value=focus||'ยังไม่ได้เลือก';$('builder-note').value='';renderBuilderExercises();$('builder-back').dataset.back=originScreen(origin);showScreen('builder')}\nfunction renderBuilderExercises(){\n  const head='<div class=\"builder-head\" aria-hidden=\"true\"><span>#</span><span>ท่าออกกำลังกาย<small>Exercise</small></span><span>เซต<small>Sets</small></span><span>ครั้ง<small>Reps</small></span><span></span></div>';\n  $('builder-exercises').innerHTML=builderExercises.length?head+builderExercises.map((x,i)=>`<div class=\"builder-exercise\"><span class=\"num\">${String(i+1).padStart(2,'0')}</span><label class=\"cell\"><span class=\"cell-label\">ชื่อท่า</span><input data-edit=\"name\" data-i=\"${i}\" value=\"${escapeHtml(x.name)}\" aria-label=\"Exercise ${i+1} name\"></label><label class=\"cell\"><span class=\"cell-label\">เซต<small>Sets</small></span><input data-edit=\"sets\" data-i=\"${i}\" type=\"number\" inputmode=\"numeric\" min=\"1\" value=\"${x.se   const ready=aiReady();\n  $('ai-status').classList.toggle('on',ready);\n  $('ai-status-text').textContent=ready?aiLabel():'Set up AI';\n  const note=$('medical-note');\n  const hosted=ready&&readAI().provider==='hosted';\n  if(note)note.textContent=hosted\n    ?'เมื่อกด Generate ข้อมูลในฟอร์มนี้จะถูกส่งผ่านเซิร์ฟเวอร์ของระบบไปยังผู้ให้บริการ AI เพื่อสร้างร่างแผน และไม่ถูกบันทึกลง My Plans หรือ localStorage'\n    :ready\n    ?`เมื่อกด Generate ข้อมูลในฟอร์มนี้จะถูกส่งไปยัง ${aiLabel()} ผ่านคีย์ของคุณ เพื่อสร้างร่างแผน และไม่ถูกบันทึกลง My Plans หรือ localStorage`\n    :'ยังไม่ได้เชื่อมต่อ AI — กด Generate เพื่อตั้งค่าผู้ให้บริการก่อน ข้อมูลในฟอร์มจะไม่ถูกบันทึกลง My Plans หรือ localStorage';\n}\n\n/* ---- settings modal ---- */\nlet aiAfterSetup=null;\nfunction aiMsg(text,isErr){const m=$('ai-modal-msg');m.textContent=text;m.classList.toggle('err',!!isErr)}\nfunction aiSyncProviderUI(){\n  const p=$('ai-provider').value,def=AI_PROVIDERS[p];\n  $('ai-base-wrap').hidden=p!=='custom';\n  const hosted=p==='hosted';\n  [$('ai-key').closest('.ai-field'),$('ai-model').closest('.ai-field'),$('ai-model-help'),$('ai-remember').closest('.check-row'),$('ai-test')].forEach(el=>el.hidden=hosted);\n  $('ai-key-label').textContent=def.needsKey?'API key':'API key (ถ้าจำเป็น)';\n  $('ai-key-help').innerHTML=def.help;\n  $('ai-model').placeholder=def.model||'ชื่อโมเดลบนเซิร์ฟเวอร์ของคุณ';\n}\nfunction syncProviderOptions(){\n  const sel=$('ai-provider'),has=!!sel.querySelector('option[value=\"hosted\"]');\n  if(AI_PROXY_URL&&!has)sel.insertAdjacentHTML('afterbegin','<option value=\"hosted\">FORGE AI (included — no setup)</option>');\n  if(!AI_PROXY_URL&&has)sel.querySelector('option[value=\"hosted\"]').remove();\n}\nfunction openAiModal(after){\n  aiAfterSetup=typeof after==='function'?after:null;\n  const c=readAI()||{};\n  syncProviderOptions();\n  $('ai-provider').value=AI_PROVIDERS[c.provider]&&(c.provider!=='hosted'||AI_PROXY_URL)?c.provider:(AI_PROXY_URL?'hosted':'anthropic');\ ];\n    if(inStr){if(esc)esc=false;else if(ch==='\\\\')esc=true;else if(ch==='\"')inStr=false;continue}\n    if(ch==='\"')inStr=true;else if(ch==='{')depth++;else if(ch==='}'){depth--;if(depth===0)return{text:s.slice(a,i+1),complete:true}}\n  }\n  return{text:s.slice(a),complete:false};\n}\n/* Repairs the two most common slips of smaller models inside strings: raw line breaks/tabs and unescaped inner quotes (e.g. Thai text like: ท่า \"Push-up\" ...) */\nfunction aiRepairJSON(s){\n  let out='',inStr=false,esc=false;\n  for(let i=0;i<s.length;i++){\n    const ch=s[i];\n    if(!inStr){out+=ch;if(ch==='\"')inStr=true;continue}\n    if(esc){out+=ch;esc=false;continue}\n    if(ch==='\\\\'){out+=ch;esc=true;continue}\n    if(ch==='\"'){\n      let j=i+1;while(j<s.length&&/\\s/.test(s[j]))j++;\n      const nx=s[j];\n      if(nx===undefined||nx===','||nx==='}'||nx===']'||nx===':'){out+=ch;inStr=false}else out+='\\\\\"';\n      continue;\n    }\n    if(ch==='\\n'){out+='\\\\n';continue}\n    if(ch==='\\r')continue;\n    if(ch==='\\t'){out+='\\\\t';continue}\n    out+=ch;\n  }\n  return out;\n}\nfunction parseAIJson(text){\n  const raw=String(text);\n  const s=raw.replace(/<think>[\\s\\S]*?<\\/think>/gi,'').replace(/<think>[\\s\\S]*$/i,'').trim().replace(/^```(?:json)?\\s*/i,'').replace(/```\\s*$/,'');\n  const fixTrail=t=>t.replace(/,\\s*([}\\]])/g,'$1');\n  let where='';\n  const attempt=t=>{\n    for(const c of [t,fixTrail(t)]){\n      try{return{ok:true,v:JSON.parse(c)}}\n      catch(e){\n        if(!where){const m=/position (\\d+)/.exec(e.message||'');where=m?`ใกล้ \"${c.slice(Math.max(0,+m[1]-30),+m[1]+30).replace(/\\s+/g,' ')}\"`:String(e.message||'').slice(0,100)}\n      }\n    }\n    return{ok:false};\n  };\n  const o=aiFirstObject(s);\n  if(o&&o.complete){const r=attempt(o.text);if(r.ok)return r.v}\n  const start=s.indexOf('{');\n  let o2=null;\n  if(start>=0){\n    o2=aiFirstObject(aiRepairJSON(s.slice(start)));\n    if(o2&&o2.complete){const r=attempt(o2.text);if(r
