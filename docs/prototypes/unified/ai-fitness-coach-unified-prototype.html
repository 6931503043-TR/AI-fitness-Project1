n\n/* ---------- units ---------- */\nconst unitName = () => S.unit === 'lb' ? t('u.lb') : t('u.kg');\nconst toDisp = kg => Math.round((S.unit === 'lb' ? kg * LB_PER_KG : kg) * 10) / 10;\nconst fromDisp = v => S.unit === 'lb' ? v / LB_PER_KG : v;\nfunction cmToFtIn(cm){\n  const tot = Math.round(cm / CM_PER_IN);\n  return {ft: Math.floor(tot / 12), inch: tot % 12};\n}\nfunction setHeight(prefix, cm){\n  if(S.hUnit === 'cm'){ $(prefix+'-height').value = Math.round(cm); }\n  else { const f = cmToFtIn(cm); $(prefix+'-ft').value = f.ft; $(prefix+'-in').value = f.inch; }\n}\nfunction getHeightCm(prefix){\n  if(S.hUnit === 'cm') return parseFloat($(prefix+'-height').value);\n  const ft = parseFloat($(prefix+'-ft').value) || 0, inch = parseFloat($(prefix+'-in').value) || 0;\n  return (ft * 12 + inch) * CM_PER_IN;\n}\nfunction heightRangeText(){\n  if(S.hUnit === 'cm') return `120–230 ${t('u.cm')}`;\n  const a = cmToFtIn(120), b = cmToFtIn(230);\n  return `${a.ft}'${a.inch}\" – ${b.ft}'${b.inch}\"`;\n}\n\n/* ---------- PLAN tab ---------- */\nconst planData = {\n  gym: [\n    {k:'ex.bench', sets:4, reps:8, weight:60},\n    {k:'ex.squat', sets:4, reps:10, weight:80},\n    {k:'ex.pullup', sets:3, reps:8, weight:0},\n    {k:'ex.curl', sets:3, reps:12, weight:12}\n  ],\n  cardio: [\n    {k:'ex.run', sets:1, rk:'r.20min', weight:null},\n    {k:'ex.bike', sets:1, rk:'r.15min', weight:null},\n    {k:'ex.rope', sets:3, rk:'r.2min', weight:null}\n  ],\n  yoga: [\n    {k:'ex.sun', sets:3, rk:'r.rounds', weight:null},\n    {k:'ex.warrior', sets:2, rk:'r.30s', weight:null},\n    {k:'ex.child', sets:1, rk:'r.1min', weight:null}\n  ]\n};\nlet currentPlan = 'gym';\n\nfunction renderPlan(){\n  const wrap = $('plan-body');\n  const list = planData[currentPlan];\n  const unitLabel = currentPlan === 'gym' ? t('plan.u.gym', {w:unitName()}) : t('plan.u.' + currentPlan);\n\n  let rows = list.map((ex, i) => {\n    const name = ex.k ? t(ex.k) : ex.name;\n    const reps = ex.rk ? t(ex.rk) : ex.reps;\n    return `\n    <div class=\"exercise-row\" data-idx=\"${i}\">\n      <div class=\"exercise-num\">${String(i+1).padStart(2,'0')}</div>\n      <div class=\"exercise-info\">\n        <div class=\"exercise-name\">${esc(name)}</div>\n        <div class=\"exercise-meta\">${t('plan.sets', {n:ex.sets})} · ${esc(reps)}${ex.weight ? ' · ' + toDisp(ex.weight) + ' ' + unitName() : ''}</div>\n      </div>\n      <button class=\"remove-btn\" data-remove=\"${i}\" aria-label=\"${t('plan.remove')}\">${ICONS.x}</button>\n    </div>`;\n  }).join('');\n\n  if(!list.length){\n    rows = `<p class=\"empty-hint\">${t('plan.empty')}</p>`;\n  }\n\n  wrap.innerHTML = `\n    <div class=\"card\">\n      <p class=\"card-title\">${t('plan.cardTitle', {type:t('plan.' + currentPlan)})}</p>\n      <p class=\"card-sub\">${unitLabel}</p>\n      ${rows}\n      <div class=\"add-exercise-form\">\n        <div class=\"name-field\">\n          <input type=\"text\" id=\"new-ex-name\" placeholder=\"${t('plan.namePh')}\">\n        </div>\n        <input type=\"number\" id=\"new-ex-sets\" placeholder=\"${t('plan.setsPh')}\" min=\"1\">\n        <input type=\"text\" id=\"new-ex-reps\" placeholder=\"${t('plan.repsPh')}\">\n      </div>\n      <button class=\"btn btn-ghost btn-sm\" id=\"add-ex-btn\" style=\"margin-top:10px; width:100%;\">${t('plan.add')}</button>\n    </div>\n  `;\n\n  wrap.querySelectorAll('[data-remove]').forEach(b=>{\n    b.addEventListener('click', ()=>{\n      planData[currentPlan].splice(parseInt(b.getAttribute('data-remove')), 1);\n      renderPlan();\n    });\n  });\n\n  $('add-ex-btn').addEventListener('click', ()=>{\n    const nameEl = $('new-ex-name'), setsEl = $('new-ex-sets'), repsEl = $('new-ex-reps');\n    const name = nameEl.value.trim();\n    if(!name){\n      nameEl.style.borderColor = 'var(--danger)';\n      nameEl.placeholder = t('plan.nameReq');\n      return;\n    }\n    planData[currentPlan].push({\n      name,\n      sets: parseInt(setsEl.value) || 1,\n      reps: repsEl.value.trim() || '-',\n      weight: currentPlan === 'gym' ? (parseFloat(setsEl.dataset.weight)||0) : null\n    });\n    renderPlan();\n  });\n}\n$('plan-segment').addEventListener('click', (e)=>{\n  const btn = e.target.closest('button[data-plan]');\n  if(!btn) return;\n  currentPlan = btn.getAttribute('data-plan');\n  document.querySelectorAll('#plan-segment button').forEach(b=>b.classList.toggle('active', b===btn));\n  renderPlan();\n});\n\n/* ---------- BODY tab: muscle recovery ---------- */\nconst REST_HOURS = 48;\nconst muscles = [\n  {k:'m.chest', lastTrained: Date.now() - 40*3600*1000},\n  {k:'m.back', lastTrained: Date.now() - 10*3600*1000},\n  {k:'m.legs', lastTrained: Date.now() - 60*3600*1000},\n  {k:'m.shoulders', lastTrained: Date.now() - 5*3600*1000},\n  {k:'m.arms', lastTrained: Date.now() - 30*3600*1000}\n];\nfunction renderMuscles(){\n  const wrap = $('muscle-list');\n  wrap.innerHTML = muscles.map((m,i)=>{\n    const hoursSince = (Date.now() - m.lastTrained) / 3600000;\n    const pct = Math.max(0, Math.min(100, (hoursSince / REST_HOURS) * 100));\n    const recovered = pct >= 100;\n    const hoursLeft = Math.max(0, REST_HOURS - hoursSince);\n    const color = recovered ? 'var(--recovery)' : 'var(--accent)';\n    const statusText = recovered ? t('m.ready') : t('m.left', {h:hoursLeft.toFixed(0)});\n    return `\n      <div class=\"muscle-row\">\n        <div class=\"muscle-name\">${t(m.k)}</div>\n        <div class=\"muscle-bar-track\"><div class=\"muscle-bar-fill\" style=\"width:${pct}%; background:${color};\"></div></div>\n        <div class=\"muscle-status\" style=\"color:${recovered?'var(--recovery-text)':'var(--text-secondary)'}\">${statusText}</div>\n      </div>\n      <button class=\"btn btn-ghost btn-sm\" style=\"margin:6px 0 4px; width:100%;\" data-train=\"${i}\">${t('m.train', {m:t(m.k)})}</button>\n    `;\n  }).join('');\n  wrap.querySelectorAll('[data-train]').forEach(b=>{\n    b.addEventListener('click', ()=>{\n      muscles[parseInt(b.getAttribute('data-train'))].lastTrained = Date.now();\n      renderMuscles();\n    });\n  });\n}\nsetInterval(renderMuscles, 60000);\n\n/* ---------- BODY tab: TDEE calculator ---------- */\nfunction calcTDEE(){\n  const gender = $('calc-gender').value;\n  const age = parseFloat($('calc-age').value) || 0;\n  const weight = fromDisp(parseFloat($('calc-weight').value) || 0);\n  const height = getHeightCm('calc') || 0;\n  const activity = parseFloat($('calc-activity').value) || 1.2;\n  let bmr = 10*weight + 6.25*height - 5*age + (gender === 'male' ? 5 : -161);\n  bmr = Math.max(0, bmr);\n  const tdee = bmr * activity;\n  $('bmr-out').innerHTML = `${Math.round(bmr).toLocaleString()} <small>kcal</small>`;\n  $('tdee-out').innerHTML = `${Math.round(tdee).toLocaleString()} <small>kcal</small>`;\n  const gf = {lose:0.85, gain:1.10, maintain:1}[S.goal] || 1;\n  $('goal-out').textContent = t('goal.out', {g:t('goal.' + S.goal), k:Math.round(tdee * gf).toLocaleString()});\n}\n['calc-gender','calc-age','calc-weight','calc-height','calc-ft','calc-in','calc-activity'].forEach(id=>{\n  $(id).addEventListener('input', calcTDEE);\n  $(id).addEventListener('change', calcTDEE);\n});\n\n/* ---------- WORK tab ---------- */\nconst workBtn = $('work-start-btn');\nlet workRunning = false;\nfunction workLabel(){\n  workBtn.textContent = workRunning ? t('work.stop') : t('work.start');\n  workBtn.classList.toggle('btn-accent', !workRunning);\n}\nworkBtn.addEventListener('click', ()=>{ workRunning = !workRunning; workLabel(); });\n\n/* rest timer */\nlet restEnd = 0, restTick = null;\nconst fmtClock = s => Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');\nfunction restRefresh(){\n  $('rest-sub').textContent = t('rest.sub', {d:fmtClock(S.restSec)});\n  if(!restEnd) $('rest-display').textContent = fmtClock(S.restSec);\n}\nfunction restUpdate(){\n  const left = Math.ceil((restEnd - Date.now()) / 1000);\n  if(left <= 0){\n    clearInterval(restTick); restEnd = 0;\n    $('rest-display').textContent = t('rest.done');\n    try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}\n    if(S.restOn) notify(t('n.restTitle'), t('n.restBody')); else toast(t('rest.done'));\n    return;\n  }\n  $('rest-display').textContent = fmtClock(left);\n}\n$('rest-start').addEventListener('click', ()=>{\n  restEnd = Date.now() + S.restSec * 1000;\n  clearInterval(restTick);\n  restTick = setInterval(restUpdate, 250);\n  restUpdate();\n});\n$('rest-reset').addEventListener('click', ()=>{ clearInterval(restTick); restEnd = 0; restRefresh(); });\n\n/* ---------- TRAINER / AI CHAT toggle ---------- */\nfunction renderChat(){\n  const kind = document.querySelector('#chat-toggle .chip.active').getAttribute('data-chat');\n  const keys = kind === 'trainer'\n    ? [['them','chat.t1'],['me','chat.t2'],['them','chat.t3']]\n    : [['them','chat.a1'],['me','chat.a2'],['them','chat.a3']];\n  $('chat-thread').innerHTML = keys.map(([c,k]) => `<div class=\"chat-bubble ${c}\">${esc(t(k))}</div>`).join('');\n}\n$('chat-toggle').addEventListener('click', (e)=>{\n  const chip = e.target.closest('.chip');\n  if(!chip) return;\n  document.querySelectorAll('#chat-toggle .chip').forEach(c=>c.classList.toggle('active', c===chip));\n  renderChat();\n});\n\n/* ---------- SETTINGS: shared helpers ---------- */\nlet toastTimer;\nfunction toast(msg){\n  const el = $('toast');\n  el.textContent = msg;\n  el.classList.add('show');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(()=>el.classList.remove('show'), 3200);\n}\nfunction msg(id, text, isErr){\n  const m = $(id);\n  m.textContent = text;\n  m.classList.toggle('err', !!isErr);\n}\nfunction updateHello(){ $('hello').textContent = (S.authMethod && !S.hideName) ? S.name : ''; }\n\n/* ---------- SETTINGS: navigation (menu list -> sub page) ---------- */\nconst SET_PAGES = {account:'Account', body:'Body Profile', unit:'Units', notif:'Notifications', tracking:'Body Tracking', coach:'AI Coach', devices:'Connected Devices', lang:'Language', privacy:'Privacy & Data', appearance:'Appearance', sub:'Subscription', about:'About & Help'};\nlet currentSetPage = null;\nfunction showSetPage(name){\n  currentSetPage = name || null;\n  $('set-home').hidden = !!name;\n  $('set-page').hidden = !name;\n  document.querySelectorAll('.set-sub').forEach(el => el.hidden = el.getAttribute('data-page') !== name);\n  if(name){\n    $('set-page-title').textContent = SET_PAGES[name];\n    $('set-page-sub').textContent = t('menu.' + name);\n    disarmAll();\n    if(name === 'account') renderAccount();\n    if(name === 'sub') renderSub();\n    if(name === 'devices') renderDevices();\n  }\n}\ndocument.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', ()=>showSetPage(b.getAttribute('data-open'))));\n$('set-back').addEventListener('click', ()=>showSetPage(null));\n\n/* ---------- SETTINGS: account ---------- */\nlet logoutArmed = false, logoutTimer;\nfunction disarmAll(){\n  logoutArmed = false; clearTimeout(logoutTimer);\n  cancelArmed = false; clearTimeout(cancelTimer);\n  $('acc-del-panel').hidden = true;\n  privArmed = false; clearTimeout(privTimer);\n  $('clear-data').textContent = t('priv.clear');\n  if($('acc-logout')) $('acc-logout').textContent = t('acc.logout');\n}\nfunction renderAccount(){\n  const signed = !!S.authMethod;\n  $('acc-signed').hidden = !signed;\n  $('acc-out').hidden = signed;\n  if(signed){\n    const g = S.authMethod === 'google';\n    $('acc-name').value = S.name;\n    $('acc-avatar').innerHTML = g ? ICONS.google : ICONS.mail;\n    $('acc-avatar').classList.toggle('google', g);\n    $('acc-via-label').textContent = g ? 'Google account' : S.email;\n    $('acc-via-detail').textContent = g ? t('acc.viaGoogle') : t('acc.viaEmail');\n    $('acc-logout').textContent = logoutArmed ? t('acc.logoutConfirm') : t('acc.logout');\n  }else{\n    $('auth-email-form').hidden = true;\n    $('auth-email-toggle').setAttribute('aria-expanded', 'false');\n    msg('auth-msg', '', true);\n  }\n}\nfunction signIn(method, email){\n  S.authMethod = method;\n  S.email = method === 'email' ? email : '';\n  saveSettings(); updateHello(); renderAccount();\n  toast(t('toast.loggedIn'));\n}\n$('auth-google').addEventListener('click', ()=>signIn('google'));\n$('auth-email-toggle').addEventListener('click', ()=>{\n  const f = $('auth-email-form');\n  f.hidden = !f.hidden;\n  $('auth-email-toggle').setAttribute('aria-expanded', String(!f.hidden));\n  if(!f.hidden) $('auth-email').focus();\n});\nfunction submitEmail(){\n  const v = $('auth-email').value.trim();\n  if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(v)) return msg('auth-msg', t('acc.emailErr'), true);\n  $('auth-email').value = '';\n  signIn('email', v);\n}\n$('auth-email-go').addEventListener('click', submitEmail);\n$('auth-email').addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); submitEmail(); } });\n$('auth-email').addEventListener('input', ()=>msg('auth-msg', '', true));\n$('acc-save').addEventListener('click', ()=>{\n  S.name = $('acc-name').value.trim().slice(0, 20);\n  saveSettings(); updateHello();\n  msg('acc-msg', t('acc.saved'), false);\n});\n$('acc-name').addEventListener('input', ()=>msg('acc-msg', '', false));\n$('acc-logout').addEventListener('click', ()=>{\n  if(!logoutArmed){\n    logoutArmed = true; renderAccount();\n    logoutTimer = setTimeout(()=>{ logoutArmed = false; renderAccount(); }, 4000);\n    return;\n  }\n  logoutArmed = false; clearTimeout(logoutTimer);\n  S.authMethod = null; S.email = '';\n  saveSettings(); updateHello(); renderAccount();\n  toast(t('toast.loggedOut'));\n});\n$('acc-delete').addEventListener('click', ()=>{ $('acc-del-panel').hidden = false; });\n$('acc-del-no').addEventListener('click', ()=>{ $('acc-del-panel').hidden = true; });\n$('acc-del-yes').addEventListener('click', ()=>{\n  const keepLang = S.lang;\n  try{ localStorage.removeItem(SETTINGS_KEY); }catch(e){}\n  S = freshDefaults(); S.lang = keepLang;\n  disarmAll(); showSetPage(null);\n  refreshAll();\n  toast(t('toast.deleted'));\n});\n\n/* ---------- SETTINGS: body info ---------- */\nfunction fillBody(){\n  $('set-gender').value = S.gender;\n  $('set-goal').value = S.goal;\n  $('set-age').value = S.age;\n  $('set-weight').value = toDisp(S.weightKg);\n  setHeight('set', S.heightCm);\n}\nfunction applyProfileToCalc(){\n  $('calc-gender').value = S.gender;\n  $('calc-age').value = S.age;\n  $('calc-weight').value = toDisp(S.weightKg);\n  setHeight('calc', S.heightCm);\n  calcTDEE();\n}\n$('save-profile').addEventListener('click', ()=>{\n  const age = parseFloat($('set-age').value);\n  const wDisp = parseFloat($('set-weight').value);\n  const hCm = getHeightCm('set');\n  if(!(age >= 10 && age <= 90)) return msg('profile-msg', t('body.err.age'), true);\n  if(!(wDisp >= toDisp(30) && wDisp <= toDisp(200))) return msg('profile-msg', t('body.err.weight', {a:toDisp(30), b:toDisp(200), u:unitName()}), true);\n  if(!(hCm >= 119.5 && hCm <= 230.5)) return msg('profile-msg', t('body.err.height', {r:heightRangeText()}), true);\n  S.gender = $('set-gender').value;\n  S.goal = $('set-goal').value;\n  S.age = Math.round(age);\n  S.weightKg = fromDisp(wDisp);\n  S.heightCm = Math.round(hCm);\n  saveSettings();\n  applyProfileToCalc();\n  msg('profile-msg', t('body.saved'), false);\n});\n['set-gender','set-goal','set-age','set-weight','set-height','set-ft','set-in'].forEach(id => $(id).addEventListener('input', ()=>msg('profile-msg','',false)));\n\n/* ---------- SETTINGS: units ---------- */\nfunction applyUnitToUI(){\n  const wl = t('f.weight', {u:unitName()});\n  $('calc-weight-label').textContent = wl;\n  $('set-weight-label').textContent = wl;\n  const hl = S.hUnit === 'cm' ? t('f.height', {u:t('u.cm')}) : t('f.heightFtIn');\n  $('calc-height-label').textContent = hl;\n  $('set-height-label').textContent = hl;\n  [$('calc-weight'), $('set-weight')].forEach(el=>{ el.min = toDisp(30); el.max = toDisp(200); });\n  ['calc','set'].forEach(p=>{\n    $(p+'-height').hidden = S.hUnit !== 'cm';\n    $(p+'-ftin').hidden = S.hUnit === 'cm';\n  });\n  document.querySelectorAll('#unit-w button').forEach(b=>b.classList.toggle('active', b.getAttribute('data-unit') === S.unit));\n  document.querySelectorAll('#unit-h button').forEach(b=>b.classList.toggle('active', b.getAttribute('data-hunit') === S.hUnit));\n}\n$('unit-w').addEventListener('click', (e)=>{\n  const b = e.target.closest('button[data-unit]');\n  if(!b || b.getAttribute('data-unit') === S.unit) return;\n  let calcKg = fromDisp(parseFloat($('calc-weight').value));\n  if(!(calcKg > 0)) calcKg = S.weightKg;\n  S.unit = b.getAttribute('data-unit');\n  saveSettings(); applyUnitToUI();\n  $('set-weight').value = toDisp(S.weightKg);\n  $('calc-weight').value = toDisp(calcKg);\n  calcTDEE(); renderPlan();\n});\n$('unit-h').addEventListener('click', (e)=>{\n  const b = e.target.closest('button[data-hunit]');\n  if(!b || b.getAttribute('data-hunit') === S.hUnit) return;\n  let calcCm = getHeightCm('calc');\n  if(!(calcCm > 0)) calcCm = S.heightCm;\n  S.hUnit = b.getAttribute('data-hunit');\n  saveSettings(); applyUnitToUI();\n  setHeight('set', S.heightCm);\n  setHeight('calc', calcCm);\n  calcTDEE();\n});\n\n/* ---------- SETTINGS: notifications ---------- */\nfunction refreshSwitches(){\n  $('sw-remind').setAttribute('aria-checked', S.remindOn);\n  $('sw-rest').setAttribute('aria-checked', S.restOn);\n  $('sw-recover').setAttribute('aria-checked', S.recoverOn);\n  $('set-remind-time').value = S.remindTime;\n  $('set-rest').value = String(S.restSec);\n  syncControls();\n}\nfunction requestNotifPermission(){\n  if(!('Notification' in window)) return Promise.resolve('unsupported');\n  if(Notification.permission === 'granted' || Notification.permission === 'denied') return Promise.resolve(Notification.permission);\n  try{\n    return Promise.resolve(Notification.requestPermission()).then(p => p || Notification.permission);\n  }catch(e){ return Promise.resolve('unsupported'); }\n}\nfunction notify(title, body){\n  try{\n    if('Notification' in window && Notification.permission === 'granted'){\n      new Notification(title, {body});\n      return;\n    }\n  }catch(e){}\n  toast(title + ' — ' + body);\n}\nasync function setNotifToggle(key, on){\n  if(on){\n    const perm = await requestNotifPermission();\n    if(perm !== 'granted'){\n      S[key] = false; refreshSwitches();\n      $('notif-hint').textContent = perm === 'unsupported' ? t('n.unsupported') : t('n.denied');\n      return;\n    }\n    $('notif-hint').textContent = t('n.hint');\n  }\n  S[key] = on;\n  saveSettings(); refreshSwitches();\n  if(key === 'recoverOn' && on) markRecovered();\n}\n$('sw-remind').addEventListener('click', ()=>setNotifToggle('remindOn', !S.remindOn));\n$('sw-rest').addEventListener('click', ()=>setNotifToggle('restOn', !S.restOn));\n$('sw-recover').addEventListener('click', ()=>setNotifToggle('recoverOn', !S.recoverOn));\n$('set-remind-time').addEventListener('change', (e)=>{\n  if(!e.target.value){ e.target.value = S.remindTime; return; }\n  S.remindTime = e.target.value; S.lastRemindDate = '';\n  saveSettings();\n});\n$('set-rest').addEventListener('change', (e)=>{\n  S.restSec = parseInt(e.target.value) || 90;\n  saveSettings(); restRefresh();\n});\n$('test-notif').addEventListener('click', async ()=>{\n  const perm = await requestNotifPermission();\n  if(perm === 'granted') notify('FORGE', t('n.ok'));\n  else toast(perm === 'unsupported' ? t('n.unsupported') : t('n.denied'));\n});\n\nconst recoverSeen = new Set();\nconst muscleKey = m => m.k + '|' + m.lastTrained;\nfunction markRecovered(){\n  muscles.forEach(m=>{\n    if((Date.now() - m.lastTrained) / 3600000 >= REST_HOURS) recoverSeen.add(muscleKey(m));\n  });\n}\nfunction checkNotifications(){\n  if(S.recoverOn){\n    muscles.forEach(m=>{\n      const key = muscleKey(m);\n      if((Date.now() - m.lastTrained) / 3600000 >= REST_HOURS && !recoverSeen.has(key)){\n        recoverSeen.add(key);\n        notify(t('n.recTitle'), t('n.recBody', {m:t(m.k), h:REST_HOURS}));\n      }\n    });\n  }\n  if(S.remindOn && S.remindTime){\n    const now = new Date();\n    const [hh, mm] = S.remindTime.split(':').map(Number);\n    const diff = now.getHours() * 60 + now.getMinutes() - (hh * 60 + mm);\n    const today = now.toDateString();\n    if(diff >= 0 && diff < 15 && S.lastRemindDate !== today){\n      S.lastRemindDate = today; saveSettings();\n      notify(t('n.workoutTitle'), t('n.workoutBody'));\n    }\n  }\n}\nmarkRecovered();\nsetInterval(checkNotifications, 30000);\n\n/* ---------- SETTINGS: connected devices (Web Bluetooth, heart-rate service) ---------- */\nlet btDevice = null;\nfunction renderDevices(){\n  const list = $('dev-list');\n  const name = btDevice ? (btDevice.name || t('dev.generic')) : S.lastDevice;\n  if(!name){\n    list.innerHTML = `<p class=\"empty-hint\" style=\"padding:6px 0 14px;\">${t('dev.empty')}</p>`;\n  }else{\n    const on = !!(btDevice && btDevice.gatt && btDevice.gatt.connected);\n    list.innerHTML = `\n      <div class=\"settings-list\" style=\"margin-bottom:12px;\">\n        <div class=\"settings-item\">\n          <i class=\"ic\" data-ic=\"watch\"></i>\n          <div class=\"row-text\"><b>${esc(name)}</b><small style=\"color:${on ? 'var(--recovery-text)' : 'var(--text-secondary)'}\">${on ? t('dev.connected') : t('dev.disconnected')}</small></div>\n          <button class=\"btn btn-ghost btn-sm\" id=\"dev-toggle\">${on ? t('dev.disconnect') : t('dev.connect')}</button>\n        </div>\n      </div>`;\n    paintIcons(list);\n  }\n  $('dev-add').hidden = !!name;\n}\nasync function pairDevice(){\n  if(!navigator.bluetooth){ msg('dev-msg', t('dev.unsupported'), true); return; }\n  try{\n    const dev = await navigator.bluetooth.requestDevice({filters:[{services:['heart_rate']}]});\n    dev.addEventListener('gattserverdisconnected', renderDevices);\n    btDevice = dev;\n    S.lastDevice = dev.name || t('dev.generic');\n    saveSettings();\n    msg('dev-msg', '', false);\n    await dev.gatt.connect();\n  }catch(e){\n    msg('dev-msg', (e && e.name === 'NotFoundError') ? t('dev.cancelled') : t('dev.failed'), true);\n  }\n  renderDevices();\n}\n$('dev-add').addEventListener('click', pairDevice);\n$('dev-list').addEventListener('click', async (e)=>{\n  if(!e.target.closest('#dev-toggle')) return;\n  if(btDevice && btDevice.gatt && btDevice.gatt.connected){\n    btDevice.gatt.disconnect();\n  }else if(btDevice){\n    try{ await btDevice.gatt.connect(); msg('dev-msg','',false); }catch(err){ msg('dev-msg', t('dev.failed'), true); }\n  }else{\n    await pairDevice(); return;\n  }\n  renderDevices();\n});\n\n/* ---------- SETTINGS: language ---------- */\nfunction renderLangList(){\n  document.querySelectorAll('#lang-list .opt-row').forEach(b=>b.setAttribute('aria-checked', b.getAttribute('data-lang') === S.lang));\n  $('menu-lang-sub').textContent = t('menu.lang') + ' · ' + (S.lang === 'th' ? 'ไทย' : 'English');\n}\n$('lang-list').addEventListener('click', (e)=>{\n  const b = e.target.closest('.opt-row');\n  if(!b) return;\n  S.lang = b.getAttribute('data-lang');\n  saveSettings();\n  refreshText();\n});\n\n/* ---------- SETTINGS: subscription (demo; no real billing) ---------- */\nlet subPick = 'monthly', cancelArmed = false, cancelTimer;\nfunction addPeriod(date, plan){\n  const d = new Date(date);\n  if(plan === 'yearly') d.setFullYear(d.getFullYear() + 1); else d.setMonth(d.getMonth() + 1);\n  return d;\n}\n/* an active (not cancelled) subscription renews itself; a scheduled plan change kicks in at that renewal */\nfunction settleSub(){\n  const s = S.sub;\n  if(!s.plan || !s.expires || s.cancelled) return;\n  let changed = false, guard = 0;\n  while(new Date(s.expires) <= new Date() && guard++ < 600){\n    if(s.pending){ s.plan = s.pending; s.pending = null; }\n    s.expires = addPeriod(new Date(s.expires), s.plan).toISOString();\n    changed = true;\n  }\n  if(changed) saveSettings();\n}\nfunction subState(){\n  settleSub();\n  const s = S.sub;\n  if(!s.plan || !s.expires) return 'none';\n  if(new Date(s.expires) <= new Date()) return 'expired';\n  return s.cancelled ? 'cancelled' : 'active';\n}\nconst fmtDate = iso => new Date(iso).toLocaleDateString(S.lang === 'th' ? 'th-TH' : 'en-GB', {day:'numeric', month:'long', year:'numeric'});\nfunction renderSub(){\n  const st = subState();\n  const s = S.sub;\n  const live = (st === 'active' || st === 'cancelled');\n  let h = `<div class=\"about-row\"><span>${t('sub.status')}</span><b>${t('sub.' + st)}</b></div>`;\n  if(st !== 'none'){\n    h += `<div class=\"about-row\"><span>${t('sub.plan')}</span><b>${t('sub.' + s.plan)}</b></div>`;\n    if(live && s.pending) h += `<div class=\"about-row\"><span>${t('sub.next')}</span><b>${t('sub.' + s.pending)}</b></div>`;\n    h += `<div class=\"about-row\"><span>${t('sub.expiry')}</span><b>${fmtDate(s.expires)}</b></div>`;\n  }\n  if(!live){\n    h += `<p class=\"card-title\" style=\"margin-top:16px;\">${t('sub.choose')}</p>\n      <div class=\"segment\" style=\"margin:10px 0 14px;\">\n        <button data-act=\"pick-monthly\" class=\"${subPick === 'monthly' ? 'active' : ''}\">${t('sub.monthly')}</button>\n        <button data-act=\"pick-yearly\" class=\"${subPick === 'yearly' ? 'active' : ''}\">${t('sub.yearly')}</button>\n      </div>\n      <button class=\"btn btn-accent\" data-act=\"subscribe\">${t('sub.subscribe')}</button>`;\n  }else{\n    const target = s.pending || s.plan;\n    const note = !s.pending ? t('sub.changeNote')\n      : (st === 'active' ? t('sub.pendingInfo', {p:t('sub.' + s.pending), d:fmtDate(s.expires)}) : t('sub.pendingOnRenew', {p:t('sub.' + s.pending)}));\n    h += `<p class=\"card-title\" style=\"margin-top:16px;\">${t('sub.change')}</p>\n      <div class=\"segment\" style=\"margin:10px 0 8px;\">\n        <button data-act=\"switch-monthly\" class=\"${target === 'monthly' ? 'active' : ''}\">${t('sub.monthly')}</button>\n        <button data-act=\"switch-yearly\" class=\"${target === 'yearly' ? 'active' : ''}\">${t('sub.yearly')}</button>\n      </div>\n      <p class=\"card-sub\" style=\"margin:0 0 14px;\">${note}</p>\n      <button class=\"btn btn-accent\" data-act=\"renew\">${t('sub.renew')}</button>`;\n    if(st === 'active') h += `<button class=\"btn btn-ghost btn-danger\" data-act=\"cancel\" style=\"margin-top:10px;\">${cancelArmed ? t('sub.cancelConfirm') : t('sub.cancel')}</button>`;\n  }\n  $('sub-card').innerHTML = h;\n}\n$('sub-card').addEventListener('click', (e)=>{\n  const b = e.target.closest('[data-act]');\n  if(!b) return;\n  const act = b.getAttribute('data-act');\n  if(act === 'pick-monthly' || act === 'pick-yearly'){ subPick = act.slice(5); renderSub(); return; }\n  if(act === 'switch-monthly' || act === 'switch-yearly'){\n    const target = act.slice(7);\n    S.sub.pending = (target === S.sub.plan) ? null : target;\n    saveSettings(); renderSub();\n    toast(S.sub.pending ? t('toast.planSet') : t('toast.planKeep'));\n    return;\n  }\n  if(act === 'subscribe'){\n    S.sub = {plan:subPick, expires:addPeriod(new Date(), subPick).toISOString(), cancelled:false, pending:null};\n    saveSettings(); renderSub(); toast(t('toast.subscribed')); return;\n  }\n  if(act === 'renew'){\n    const base = new Date(Math.max(Date.now(), new Date(S.sub.expires).getTime()));\n    if(S.sub.pending){ S.sub.plan = S.sub.pending; S.sub.pending = null; }\n    S.sub.expires = addPeriod(base, S.sub.plan).toISOString();\n    S.sub.cancelled = false;\n    saveSettings(); renderSub(); toast(t('toast.renewed')); return;\n  }\n  if(act === 'cancel'){\n    if(!cancelArmed){\n      cancelArmed = true; renderSub();\n      cancelTimer = setTimeout(()=>{ cancelArmed = false; renderSub(); }, 4000);\n      return;\n    }\n    cancelArmed = false; clearTimeout(cancelTimer);\n    S.sub.cancelled = true;\n    saveSettings(); renderSub(); toast(t('toast.cancelled'));\n  }\n});\n\n/* ---------- SETTINGS: generic switches & segments ---------- */\nconst FLAG_SWITCHES = {'sw-grid':'gridOn','sw-skel':'skelOn','sw-suggest':'coachSuggest','sw-form':'coachForm','sw-cprofile':'coachProfile','sw-hide':'hideName'};\nconst SEGMENTS = [\n  ['cam-seg','data-cam','camFacing'], ['coach-tone','data-tone','coachTone'], ['coach-detail','data-detail','coachDetail'],\n  ['theme-seg','data-theme-opt','theme'], ['size-seg','data-size','textSize'], ['accent-list','data-accent','accent']\n];\nfunction syncControls(){\n  Object.keys(FLAG_SWITCHES).forEach(id => $(id).setAttribute('aria-checked', !!S[FLAG_SWITCHES[id]]));\n  SEGMENTS.forEach(([id, attr, key])=>{\n    $(id).querySelectorAll('[' + attr + ']').forEach(b=>{\n      const on = b.getAttribute(attr) === S[key];\n      b.classList.toggle('active', on);\n      b.setAttribute('aria-checked', on);\n    });\n  });\n}\nfunction applyGrid(){\n  const g = document.querySelector('.work-camera .grid-overlay');\n  if(g) g.hidden = !S.gridOn;\n}\nObject.keys(FLAG_SWITCHES).forEach(id=>{\n  $(id).addEventListener('click', ()=>{\n    const k = FLAG_SWITCHES[id];\n    S[k] = !S[k]; saveSettings(); syncControls();\n    if(k === 'gridOn') applyGrid();\n    if(k === 'hideName') updateHello();\n  });\n});\nSEGMENTS.forEach(([id, attr, key])=>{\n  $(id).addEventListener('click', (e)=>{\n    const b = e.target.closest('[' + attr + ']');\n    if(!b) return;\n    S[key] = b.getAttribute(attr);\n    saveSettings(); syncControls();\n    if(key === 'theme' || key === 'accent' || key === 'textSize') applyAppearance();\n  });\n});\n\n/* ---------- SETTINGS: appearance ---------- */\nconst ACCENTS = {orange:'#FF5A1F', blue:'#3B82F6', green:'#22C55E', purple:'#8B5CF6', pink:'#EC4899'};\nconst darkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;\nconst resolvedTheme = () => S.theme === 'system' ? ((darkMQ && !darkMQ.matches) ? 'light' : 'dark') : S.theme;\nfunction hexRGB(h){ const n = parseInt(h.slice(1), 16); return [(n>>16)&255, (n>>8)&255, n&255]; }\nfunction mixHex(a, b, amt){\n  const x = hexRGB(a), y = hexRGB(b);\n  return 'rgb(' + x.map((v,i)=>Math.round(v + (y[i]-v)*amt)).join(',') + ')';\n}\nfunction applyAppearance(){\n  const th = resolvedTheme(), root = document.documentElement;\n  root.setAttribute('data-theme', th);\n  const ac = ACCENTS[S.accent] || ACCENTS.orange;\n  root.style.setProperty('--accent', ac);\n  root.style.setProperty('--accent-bg', 'rgba(' + hexRGB(ac).join(',') + ',0.14)');\n  root.style.setProperty('--accent-text', th === 'dark' ? mixHex(ac, '#ffffff', 0.75) : mixHex(ac, '#000000', 0.45));\n  root.style.zoom = ({small:'0.92', normal:'', large:'1.1'})[S.textSize] || '';\n}\nif(darkMQ && darkMQ.addEventListener) darkMQ.addEventListener('change', ()=>{ if(S.theme === 'system') applyAppearance(); });\n\n/* ---------- SETTINGS: body tracking (camera test) ---------- */\n$('cam-test').addEventListener('click', async ()=>{\n  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return msg('cam-msg', t('trk.unsupported'), true);\n  try{\n    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:S.camFacing}});\n    stream.getTracks().forEach(tr => tr.stop());\n    msg('cam-msg', t('trk.ok'), false);\n  }catch(e){\n    const n = e && e.name;\n    msg('cam-msg', (n === 'NotAllowedError' || n === 'SecurityError') ? t('trk.denied')\n      : (n === 'NotFoundError' || n === 'OverconstrainedError') ? t('trk.none') : t('trk.fail'), true);\n  }\n});\n\n/* ---------- SETTINGS: privacy & data ---------- */\nlet privArmed = false, privTimer;\n$('export-data').addEventListener('click', ()=>{\n  const data = {app:'FORGE', version:APP_VERSION, exportedAt:new Date().toISOString(), settings:S, plan:planData};\n  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));\n  const a = document.createElement('a');\n  a.href = url; a.download = 'forge-data.json';\n  document.body.appendChild(a); a.click(); a.remove();\n  setTimeout(()=>URL.revokeObjectURL(url), 1000);\n  msg('priv-msg', t('priv.exported'), false);\n});\n$('clear-data').addEventListener('click', ()=>{\n  if(!privArmed){\n    privArmed = true;\n    $('clear-data').textContent = t('priv.clearConfirm');\n    privTimer = setTimeout(()=>{ privArmed = false; $('clear-data').textContent = t('priv.clear'); }, 4000);\n    return;\n  }\n  privArmed = false; clearTimeout(privTimer);\n  const keep = {lang:S.lang, authMethod:S.authMethod, email:S.email, name:S.name, sub:S.sub};\n  S = Object.assign(freshDefaults(), keep);\n  btDevice = null;\n  saveSettings();\n  refreshAll();\n  $('clear-data').textContent = t('priv.clear');\n  msg('priv-msg', t('priv.cleared'), false);\n});\n\n/* ---------- apply language + refresh everything ---------- */\nfunction applyStaticText(){\n  document.documentElement.lang = S.lang;\n  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });\n  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-ph')); });\n  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))));\n}\nfunction refreshText(){\n  applyStaticText();\n  applyUnitToUI();\n  applyAppearance();\n  applyGrid();\n  syncControls();\n  calcTDEE();\n  updateHello();\n  renderPlan();\n  renderMuscles();\n  renderChat();\n  workLabel();\n  restRefresh();\n  renderLangList();\n  $('notif-hint').textContent = t('n.hint');\n  $('about-version').textContent = 'v' + APP_VERSION;\n  if(currentSetPage){\n    $('set-page-sub').textContent = t('menu.' + currentSetPage);\n    if(currentSetPage === 'account') renderAccount();\n    if(currentSetPage === 'sub') renderSub();\n    if(currentSetPage === 'devices') renderDevices();\n  }\n}\nfunction refreshAll(){\n  applyUnitToUI();\n  fillBody();\n  applyProfileToCalc();\n  refreshSwitches();\n  refreshText();\n}\nrefreshAll();\n<\/script>\n</body>\n</html>\n"};
const viewToFrame={plan:"frame-plan",body:"frame-body",work:"frame-system",trainer:"frame-trainer",settings:"frame-system"};
let currentView="plan",systemFrameReady=false;
function switchSystemScreen(screenName){
 const frame=document.getElementById("frame-system");if(!systemFrameReady)return;
 try{
  const doc=frame.contentDocument;
  const btn=doc.querySelector('.nav-item[data-screen="'+screenName+'"]');
  if(btn)btn.click();
  else doc.querySelectorAll(".screen").forEach(section=>{const active=section.id==="screen-"+screenName;section.classList.toggle("active",active);section.style.display=active?"block":"none";});
 }catch(error){console.error("Unable to switch embedded screen:",error);}
}
function activateView(viewName){
 if(!Object.prototype.hasOwnProperty.call(viewToFrame,viewName))return;
 currentView=viewName;const frameId=viewToFrame[viewName];
 document.querySelectorAll(".prototype-frame").forEach(frame=>frame.classList.toggle("active",frame.id===frameId));
 document.querySelectorAll(".nav-button[data-view]").forEach(button=>{if(button.dataset.view===viewName)button.setAttribute("aria-current","page");else button.removeAttribute("aria-current");});
 if(viewName==="work")switchSystemScreen("work");if(viewName==="settings")switchSystemScreen("setting");
}
document.querySelectorAll(".nav-button[data-view]").forEach(button=>button.addEventListener("click",()=>activateView(button.dataset.view)));
const frameSources={"frame-plan":EMBEDDED_DOCUMENTS.plan,"frame-body":EMBEDDED_DOCUMENTS.body,"frame-trainer":EMBEDDED_DOCUMENTS.chat,"frame-system":EMBEDDED_DOCUMENTS.system};
const systemFrame=document.getElementById("frame-system");
systemFrame.addEventListener("load",()=>{systemFrameReady=true;if(currentView==="work")switchSystemScreen("work");if(currentView==="settings")switchSystemScreen("setting");});
Object.entries(frameSources).forEach(([frameId,source])=>{document.getElementById(frameId).srcdoc=source;});
</script></body></html>
