<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14130F" />
<title>FORGE — Chat Prototype</title>
<style>
:root{
  --bg:#14130F;--panel:#1E1C17;--panel2:#26241D;--panel3:#302D25;
  --line:rgba(245,243,238,.10);--line2:rgba(245,243,238,.17);
  --text:#F5F3EE;--sub:#AAA497;--muted:#777266;
  --accent:#20C46A;--accent-weak:rgba(32,196,106,.13);--accent-text:#07170E;
  --blue:#6475F5;--danger:#E4574B;--shadow:0 24px 70px rgba(0,0,0,.42);
  --radius:18px;--nav-h:68px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100dvh}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1500px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.appbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);flex:none}
.brand{font-weight:950;font-size:22px;letter-spacing:.3px}.brand span{color:var(--accent)}
.streak{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:8px}.streak b{color:var(--text);font-weight:600}
.workspace{display:flex;flex:1;min-height:0;padding-bottom:var(--nav-h)}
.content{display:flex;flex-direction:column;flex:1;min-width:0;padding:24px 26px 16px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.page-head h1{font-size:30px;line-height:1.05;letter-spacing:-.7px;margin:0 0 6px;font-weight:750}
.page-head p{margin:0;color:var(--sub);font-size:14px}
.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 13px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.16s ease}
.btn:hover{background:var(--panel3);border-color:rgba(245,243,238,.28);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}.btn.primary:hover{filter:brightness(1.06)}
.btn.ai{background:rgba(100,117,245,.15);border-color:rgba(100,117,245,.48);color:#DCE0FF}.btn.ai.active{background:var(--blue);color:white}
.btn.icon{width:40px;height:40px;padding:0;justify-content:center}
.icon{width:18px;height:18px;display:inline-block;flex:none}
.chat-layout{display:grid;grid-template-columns:292px minmax(0,1fr);gap:14px;min-height:0;flex:1}
.sidebar,.chat-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-height:0}
.sidebar{display:flex;flex-direction:column;overflow:hidden}
.sidebar-top{padding:17px 16px 12px}
.sidebar-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.sidebar-title h2{font-size:16px;margin:0;font-weight:700}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);border-radius:11px;padding:0 11px;height:39px;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;color:var(--text);width:100%;font-size:12px}.search input::placeholder{color:var(--muted)}
.filter-row{display:flex;gap:6px;padding:0 16px 10px;overflow:auto;scrollbar-width:none}.filter-row::-webkit-scrollbar{display:none}
.filter{border:1px solid var(--line);background:transparent;color:var(--sub);padding:7px 10px;border-radius:999px;font-size:11px;white-space:nowrap}.filter.active{background:var(--accent-weak);border-color:rgba(32,196,106,.42);color:#A6F0C4}
.contact-list{overflow:auto;padding:0 9px 12px;flex:1}
.group-label{font-size:10px;letter-spacing:1.1px;font-weight:800;color:var(--muted);padding:12px 9px 7px;display:flex;justify-content:space-between;align-items:center}
.contact{border:1px solid transparent;width:100%;display:flex;align-items:center;gap:11px;padding:10px 9px;border-radius:12px;background:transparent;color:var(--text);text-align:left;margin-bottom:2px;min-width:0}
.contact:hover{background:rgba(255,255,255,.035)}.contact.active{background:#2B3028;border-color:rgba(32,196,106,.20)}
.avatar{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800;color:#F8F7F2;background:#454237;position:relative}
.avatar.trainer{background:linear-gradient(145deg,#355E4A,#26362C)}.avatar.friend{background:linear-gradient(145deg,#4B527C,#303750)}.avatar.group{background:linear-gradient(145deg,#805D39,#4B3829)}.avatar.ai{background:linear-gradient(145deg,#6677F5,#424DAB);font-size:18px}
.online{position:absolute;width:10px;height:10px;border-radius:50%;right:-2px;bottom:-2px;background:var(--accent);border:2px solid var(--panel)}
.contact-main{min-width:0;flex:1}.contact-line{display:flex;align-items:center;justify-content:space-between;gap:8px}.contact-name{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.contact-time{font-size:10px;color:var(--muted);flex:none}.contact-preview{font-size:10.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.unread{background:var(--accent);color:#07170E;font-size:9px;font-weight:800;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 5px}
.ai-entry{margin:0 12px 13px;border:1px solid rgba(100,117,245,.30);border-radius:13px;background:rgba(100,117,245,.10);padding:11px;display:flex;align-items:center;gap:10px;color:var(--text);text-align:left}.ai-entry:hover{background:rgba(100,117,245,.17)}.ai-entry .avatar{width:36px;height:36px;border-radius:11px}.ai-entry strong{font-size:12px;display:block}.ai-entry small{display:block;color:#B9BFFB;font-size:10px;margin-top:3px}
.chat-panel{display:flex;flex-direction:column;overflow:hidden;position:relative}
.chat-head{padding:14px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:72px}
.chat-person{display:flex;align-items:center;gap:11px;min-width:0}.chat-person .avatar{width:42px;height:42px}.chat-person h3{font-size:14px;margin:0 0 4px;font-weight:700}.chat-person p{font-size:11px;color:var(--sub);margin:0}.head-tools{display:flex;align-items:center;gap:7px}.head-tools .btn{padding:8px 10px;font-size:11px}
.mobile-menu{display:none}
.messages{flex:1;overflow:auto;padding:22px clamp(16px,4vw,44px) 18px;display:flex;flex-direction:column;gap:15px;min-height:0;background-image:radial-gradient(rgba(255,255,255,.025) .7px,transparent .7px);background-size:18px 18px}
.day-label{text-align:center;color:var(--muted);font-size:10px;margin:0 0 2px}
.msg-row{display:flex;align-items:flex-end;gap:9px;max-width:82%}.msg-row.mine{align-self:flex-end;flex-direction:row-reverse}.msg-avatar{width:27px;height:27px;border-radius:9px;background:#3D483B;color:#C8F4D8;display:grid;place-items:center;font-size:9px;font-weight:800;flex:none}
.msg-content{min-width:0}.msg-author{font-size:10px;color:var(--sub);margin:0 0 5px 3px}.bubble{background:#2B2922;border:1px solid var(--line);padding:11px 13px;border-radius:14px 14px 14px 4px;font-size:12px;line-height:1.55;color:#F2F0E9;overflow-wrap:anywhere}.mine .bubble{background:#1F6A42;border-color:rgba(32,196,106,.22);border-radius:14px 14px 4px 14px;color:#F5FFF8}.msg-time{font-size:9px;color:var(--muted);margin:5px 3px 0}.mine .msg-time{text-align:right}
.bubble.pending{color:var(--sub);font-style:italic}.bubble.error{border-color:rgba(228,87,75,.5);color:#FFB4AC}
.plan-card{width:min(390px,100%);background:#24251F;border:1px solid rgba(32,196,106,.25);border-radius:14px;overflow:hidden;margin-top:7px}.plan-top{padding:12px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.plan-top strong{font-size:12px}.plan-top span{font-size:9px;color:#A6F0C4;background:var(--accent-weak);padding:5px 7px;border-radius:99px}.plan-body{padding:11px 13px}.plan-ex{display:flex;justify-content:space-between;gap:8px;padding:6px 0;color:var(--sub);font-size:10px;border-bottom:1px solid rgba(255,255,255,.045)}.plan-ex b{color:var(--text);font-weight:600}.plan-foot{display:flex;gap:8px;padding:0 13px 12px}.plan-foot button{font-size:10px;padding:7px 10px;border-radius:8px}
.composer-wrap{padding:12px 17px 15px;border-top:1px solid var(--line);background:rgba(30,28,23,.96)}.composer-tools{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.composer-note{font-size:10px;color:var(--muted)}.compose{display:flex;gap:8px;align-items:flex-end}.compose-btn{width:40px;height:42px;border:1px solid var(--line2);border-radius:12px;background:var(--panel2);color:var(--sub);display:grid;place-items:center;flex:none}.compose textarea{resize:none;min-height:42px;max-height:115px;flex:1;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:11px 13px;color:var(--text);outline:0;font-size:12px;line-height:1.4}.compose textarea:focus{border-color:rgba(32,196,106,.55)}.compose textarea::placeholder{color:var(--muted)}.send-btn{width:44px;height:42px;border:0;border-radius:12px;background:var(--accent);color:#07170E;display:grid;place-items:center;flex:none}.send-btn:hover{filter:brightness(1.08)}.send-btn:disabled{opacity:.5;cursor:not-allowed}
.bottom-nav{height:var(--nav-h);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,1500px);display:flex;align-items:center;justify-content:space-around;padding:7px 12px calc(7px + env(safe-area-inset-bottom));background:rgba(20,19,15,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:10}.nav-item{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;min-width:54px}.nav-item .icon{width:19px;height:19px}.nav-item.active{color:var(--accent)}.nav-item.center .nav-icon{width:42px;height:42px;margin-top:-20px;border:3px solid var(--bg);border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#07170E}.nav-item.center{gap:1px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:31;inset:0 auto 0 0;width:min(340px,86vw);background:var(--panel);border-right:1px solid var(--line2);box-shadow:var(--shadow);transform:translateX(-105%);transition:transform .23s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}.drawer.open{transform:translateX(0)}.drawer .sidebar-top{padding-top:20px}.drawer .contact-list{padding-bottom:20px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.64);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.show{display:flex}.modal{width:min(440px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);padding:20px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.modal-head h3{margin:0;font-size:17px}.modal p{color:var(--sub);font-size:12px;line-height:1.5}.field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.field label{font-size:11px;color:var(--sub)}.field input,.field select{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:11px;color:var(--text);outline:none}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;z-index:80;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#29271F;color:var(--text);border:1px solid var(--line2);padding:10px 14px;border-radius:12px;font-size:11px;box-shadow:var(--shadow);transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.empty-state{margin:auto;text-align:center;color:var(--sub);max-width:280px}.empty-state .avatar{margin:0 auto 12px;width:54px;height:54px}.empty-state h3{color:var(--text);font-size:15px;margin:0 0 6px}.empty-state p{font-size:11px;line-height:1.5;margin:0}
@media(max-width:760px){
  .appbar{height:56px;padding:0 16px}.content{padding:17px 13px 10px}.page-head{align-items:center;margin-bottom:12px}.page-head h1{font-size:25px}.page-head p{font-size:11px}.head-actions .btn:not(.ai){display:none}.head-actions .btn.ai{padding:9px 11px}.chat-layout{display:block}.chat-layout>.sidebar{display:none}.chat-panel{height:calc(100dvh - 56px - var(--nav-h) - 102px);min-height:410px;border-radius:15px}.chat-head{padding:11px 12px;min-height:62px}.chat-head .chat-person h3{font-size:12px}.chat-head .chat-person p{font-size:9px}.chat-head .avatar{width:37px;height:37px}.chat-head .head-tools .btn{padding:7px 8px;font-size:10px}.messages{padding:16px 12px;gap:12px}.msg-row{max-width:92%}.bubble{font-size:11px;padding:10px 11px}.composer-wrap{padding:10px}.composer-note{font-size:9px}.bottom-nav{height:64px}.nav-item{font-size:8px}.chat-head .mobile-menu{display:inline-flex}
}
@media(max-width:390px){.page-head h1{font-size:23px}.page-head p{max-width:200px}.head-actions .btn.ai{font-size:10px;padding:8px}.chat-panel{height:calc(100dvh - 56px - 64px - 100px)}.chat-head .head-tools .btn{font-size:0;width:34px;height:34px;justify-content:center;padding:0}.chat-head .head-tools .btn .btn-label{display:none}}
@media(min-width:761px){.drawer,.overlay{display:none!important}.chat-layout>.sidebar{display:flex!important}}

/* ===== [เพิ่ม] แนบไฟล์/รูป ===== */
.compose{position:relative}
.file-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.attach-menu{position:absolute;left:0;bottom:50px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:20;min-width:200px}
.attach-menu.show{display:block}
.attach-menu button{display:flex;width:100%;gap:8px;align-items:center;background:transparent;border:0;color:var(--text);padding:12px 10px;border-radius:8px;font-size:13px;text-align:left}
.attach-menu button:hover{background:var(--panel3)}
.attach-preview{display:flex;gap:8px;overflow:auto;padding-bottom:10px}
.attach-preview:empty{display:none}
.att-chip{position:relative;flex:none;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:6px 30px 6px 6px;max-width:210px;font-size:10px}
.att-chip img{width:34px;height:34px;object-fit:cover;border-radius:6px}
.att-chip .ficon{width:34px;height:34px;border-radius:6px;background:var(--panel3);display:grid;place-items:center;font-size:16px}
.att-chip .n{display:block;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-chip small{color:var(--muted);font-size:9px}
.att-chip .rm{position:absolute;top:4px;right:4px;width:20px;height:20px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:var(--text);font-size:10px;padding:0}
.msg-att{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.msg-att img{max-width:220px;max-height:200px;border-radius:10px;display:block}
.msg-att a{color:inherit;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.22);padding:8px 10px;border-radius:9px;text-decoration:none;font-size:11px}
.msg-att a:has(img){background:none;padding:0}

/* ===== [เพิ่ม] รองรับ iPad ===== */
html{-webkit-text-size-adjust:100%}
button,.contact,.filter{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media(hover:none){
  .compose textarea,.search input,.field input,.field select{font-size:16px}
  .btn:hover{transform:none}
}
@media(min-width:761px){
  .app{height:100dvh;min-height:0}
  .content{min-height:0}
  .messages{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
}
@media(min-width:761px) and (max-width:1100px){
  .chat-layout{grid-template-columns:240px minmax(0,1fr)}
  .content{padding:18px 16px 12px}
}
</style>
</head>
<body>
<div class="app">
  <header class="appbar"><div class="brand">FORGE<span>.</span></div><div class="streak">🔥 <b>4-day streak</b></div></header>
  <main class="workspace">
    <section class="content">
      <div class="page-head">
        <div style="display:flex;align-items:center;gap:10px;min-width:0">
          <div><h1>Trainer</h1><p>คุยกับ Trainer, Friends หรือ AI Coach</p></div>
        </div>
        <div class="head-actions">
          <button class="btn" id="createGroup"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20c.4-3.3 2.4-5 6-5s5.6 1.7 6 5M17 8v6M14 11h6"/></svg>Create Group</button>
          <button class="btn" id="addFriend"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20c.4-3.3 2.4-5 6-5 2.1 0 3.7.6 4.8 1.8M19 8v6M16 11h6"/></svg>Add Friend</button>
          <button class="btn ai" id="aiTop"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.4 5.6L19 10l-5.6 1.4L12 17l-1.4-5.6L5 10l5.6-1.4L12 3zM19 16l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16z"/></svg>AI Coach</button>
        </div>
      </div>
      <div class="chat-layout">
        <aside class="sidebar" id="desktopSidebar">
          <div class="sidebar-top">
            <div class="sidebar-title"><h2>Messages</h2><button class="btn icon" id="newChat" title="New conversation"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button></div>
            <label class="search"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="7"/><path d="m16 16 5 5"/></svg><input id="searchDesktop" placeholder="ค้นหารายชื่อหรือบทสนทนา" /></label>
          </div>
          <div class="filter-row" id="filtersDesktop"><button class="filter active" data-filter="all">ทั้งหมด</button><button class="filter" data-filter="trainer">Trainers</button><button class="filter" data-filter="friend">Friends</button><button class="filter" data-filter="group">Groups</button></div>
          <div class="contact-list" id="listDesktop"></div>
          <button class="ai-entry" id="aiSidebar"><span class="avatar ai">✦</span><span style="flex:1"><strong>AI Coach</strong><small>เปิดบทสนทนากับผู้ช่วย AI</small></span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
        </aside>
        <section class="chat-panel">
          <header class="chat-head">
            <div class="chat-person"><button class="btn icon mobile-menu" id="menuBtnInside" aria-label="Open conversations"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="avatar trainer" id="activeAvatar">T1</div><div><h3 id="activeName">Trainer T1</h3><p id="activeMeta">Personal Trainer · Active recently</p></div></div>
            <div class="head-tools"><button class="btn" id="sharePlan"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V3m-5 5 5-5 5 5M4 14v6h16v-6"/></svg><span class="btn-label">ส่งไฟล์</span></button><button class="btn icon" id="chatMore" title="More options"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button></div>
          </header>
          <div class="messages" id="messages" aria-live="polite"></div>
          <div class="composer-wrap">
            <div class="composer-tools"><span class="composer-note" id="composerHint">ส่งข้อความ รูปภาพ หรือไฟล์ได้เลย</span><span class="composer-note">Enter เพื่อส่ง · Shift + Enter ขึ้นบรรทัดใหม่</span></div>
            <div class="attach-preview" id="attachPreview"></div>
            <form class="compose" id="messageForm"><button type="button" class="compose-btn" id="attachBtn" title="แนบไฟล์หรือรูปภาพ"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
              <div class="attach-menu" id="attachMenu">
                <button type="button" id="pickImage">🖼️ รูปภาพ</button>
                <button type="button" id="pickCamera">📷 ถ่ายรูป</button>
                <button type="button" id="pickFile">📎 ไฟล์</button>
              </div>
              <input type="file" id="fileInput" multiple class="file-hidden">
              <input type="file" id="cameraInput" accept="image/*" capture="environment" class="file-hidden">

<script>
const $=s=>document.querySelector(s);
const conversations=[
 {id:'t1',type:'trainer',name:'Trainer T1',initial:'T1',role:'Personal Trainer',time:'10:42',preview:'เดี๋ยวผมช่วยปรับแผนให้นะครับ',unread:0,online:true,messages:[{from:'them',text:'สวัสดีครับ วันนี้รู้สึกเป็นอย่างไรบ้างหลังจากฝึกครั้งล่าสุด?',time:'10:30'},{from:'me',text:'วันนี้รู้สึกเหนื่อยเล็กน้อยครับ โดยเฉพาะช่วงอกกับไหล่',time:'10:34'},{from:'them',text:'รับทราบครับ งั้นวันนี้เราอาจลดความหนักและให้ความสำคัญกับการฟื้นตัวก่อน',time:'10:37'},{from:'them',text:'ผมลองส่งตัวอย่างแผนที่ปรับให้ดูนะครับ',time:'10:40'},{from:'plan',time:'10:42'}]},
 {id:'t2',type:'trainer',name:'Trainer T2',initial:'T2',role:'Strength Coach',time:'เมื่อวาน',preview:'Your recovery looks better',unread:0,online:false,messages:[{from:'them',text:'สวัสดีครับ มีอะไรอยากให้ช่วยดูเกี่ยวกับการฝึกไหมครับ?',time:'เมื่อวาน'}]},
 {id:'f1',type:'friend',name:'Friend F1',initial:'F1',role:'Friend',time:'09:18',preview:'แชร์แผน Chest Day ให้แล้ว',unread:2,online:true,messages:[{from:'them',text:'เราแชร์แผน Chest Day ไว้ให้ ลองดูได้เลย!',time:'09:18'}]},

 {id:'g1',type:'group',name:'Weekend Training',initial:'G1',role:'Group · 3 members',time:'2 วัน',preview:'F1: เจอกันตอน 9 โมงนะ',unread:0,online:false,messages:[{from:'them',author:'Friend F1',text:'เสาร์นี้เจอกันตอน 9 โมงนะ',time:'2 วันก่อน'},{from:'them',author:'Friend F2',text:'ได้เลย แล้วเจอกัน!',time:'2 วันก่อน'}]},
 {id:'ai',type:'ai',name:'AI Coach',initial:'✦',role:'Your fitness assistant',time:'ตอนนี้',preview:'พร้อมช่วยวางแผนการฝึกให้คุณ',unread:0,online:true,messages:[{from:'them',text:'สวัสดีครับ วันนี้มีอะไรอยากให้ผมช่วยเกี่ยวกับการฝึกหรือการฟื้นตัวไหม?',time:'ตอนนี้'}]}
];
let activeId='t1',filter='all',modalMode='';
const typeLabel={trainer:'TRAINERS',friend:'FRIENDS',group:'GROUPS',ai:'AI COACH'};
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initialsAvatar(c){return `<span class="avatar ${c.type}">${escapeHTML(c.initial)}${c.online?'<i class="online"></i>':''}</span>`}
function renderList(target,query=''){
 const root=$(target); if(!root)return; root.innerHTML='';
 const q=query.trim().toLowerCase();
 const visible=conversations.filter(c=>(filter==='all'||c.type===filter)&&c.type!=='ai'&&(c.name.toLowerCase().includes(q)||c.preview.toLowerCase().includes(q)));
 ['trainer','friend','group'].forEach(type=>{
   if(filter!=='all'&&filter!==type)return;
   const items=visible.filter(c=>c.type===type);if(!items.length)return;
   const label=document.createElement('div');label.className='group-label';label.innerHTML=`<span>${typeLabel[type]}</span><span>${items.length}</span>`;root.append(label);
   items.forEach(c=>{const b=document.createElement('button');b.className='contact'+(c.id===activeId?' active':'');b.dataset.id=c.id;b.innerHTML=`${initialsAvatar(c)}<span class="contact-main"><span class="contact-line"><span class="contact-name">${escapeHTML(c.name)}</span><span class="contact-time">${escapeHTML(c.time)}</span></span><span class="contact-line"><span class="contact-preview">${escapeHTML(c.preview)}</span>${c.unread?`<span class="unread">${c.unread}</span>`:''}</span></span>`;b.addEventListener('click',()=>selectConversation(c.id));root.append(b);});
 });
 if(!visible.length){const e=document.createElement('div');e.className='empty-state';e.style.padding='28px 12px';e.textContent='ไม่พบรายการที่ค้นหา';root.append(e)}
}
function renderAllLists(){renderList('#listDesktop',$('#searchDesktop').value);renderList('#listMobile',$('#searchMobile').value)}
function selectConversation(id){activeId=id;const c=conversations.find(x=>x.id===id);if(!c)return;c.unread=0;$('#activeAvatar').className='avatar '+c.type;$('#activeAvatar').textContent=c.initial;$('#activeName').textContent=c.name;$('#activeMeta').textContent=c.role+(c.online?' · Online':'');$('#composerHint').textContent=c.type==='ai'?'AI Coach พร้อมช่วยวางแผนและตอบคำถามของคุณ':'ส่งข้อความ รูปภาพ หรือไฟล์กับ '+c.name;renderMessages(c);renderAllLists();closeDrawer();if(c.type==='ai')updateCoachHint();}
function renderMessages(c){const root=$('#messages');root.innerHTML='<div class="day-label">วันนี้</div>';if(!c.messages.length){root.innerHTML+='<div class="empty-state"><div class="avatar '+c.type+'">'+escapeHTML(c.initial)+'</div><h3>เริ่มการสนทนา</h3><p>ส่งข้อความแรกเพื่อเริ่มพูดคุยกันได้เลย</p></div>';return;}c.messages.forEach(m=>{if(m.from==='plan'){root.insertAdjacentHTML('beforeend',`<div class="msg-row"><div class="msg-avatar">T1</div><div class="msg-content"><div class="msg-author">Trainer T1</div><div class="plan-card"><div class="plan-top"><strong>Chest & Triceps · Adjusted Plan</strong><span>Draft</span></div><div class="plan-body"><div class="plan-ex"><b>Bench Press</b><span>3 × 10</span></div><div class="plan-ex"><b>Incline Dumbbell Press</b><span>3 × 12</span></div><div class="plan-ex"><b>Triceps Pushdown</b><span>3 × 12</span></div></div><div class="plan-foot"><button class="btn primary" onclick="showToast('ตัวอย่าง: เปิดดูแผน')">View Plan</button><button class="btn" onclick="showToast('ตัวอย่าง: บันทึกสำเนาแผน')">Save a Copy</button></div></div><div class="msg-time">${m.time}</div></div></div>`);return;}const mine=m.from==='me';const author=mine?'You':(m.author||c.name);const cls='bubble'+(m.pending?' pending':'')+(m.error?' error':'');root.insertAdjacentHTML('beforeend',`<div class="msg-row ${mine?'mine':''}">${mine?'':`<div class="msg-avatar">${escapeHTML(c.initial)}</div>`}<div class="msg-content">${mine?'':`<div class="msg-author">${escapeHTML(author)}</div>`}<div class="${cls}">${escapeHTML(m.text).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}${filesHTML(m)}</div><div class="msg-time">${escapeHTML(m.time||'ตอนนี้')}</div></div></div>`)});root.scrollTop=root.scrollHeight;}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),2400)}
function openDrawer(){$('#drawer').classList.add('open');$('#overlay').classList.add('show');document.body.style.overflow='hidden'}
function closeDrawer(){$('#drawer').classList.remove('open');$('#overlay').classList.remove('show');document.body.style.overflow=''}
function openModal(mode){modalMode=mode;const title=mode==='group'?'Create Group':mode==='friend'?'Add Friend':mode==='share'?'Share Workout Plan':'New Conversation';$('#modalTitle').textContent=title;let html='';if(mode==='group')html='<p>สร้างห้องสนทนาสำหรับคุณและเพื่อน ๆ สามารถเพิ่มสมาชิกภายหลังได้</p><div class="field"><label>ชื่อกลุ่ม</label><input id="modalName" placeholder="เช่น Weekend Training" /></div><div class="field"><label>เพิ่มสมาชิก</label><select id="modalMembers" multiple size="3"><option>Friend F1</option><option>Friend F2</option><option>Trainer T1</option></select></div>';else if(mode==='friend')html='<p>ค้นหาเพื่อนเพื่อส่งคำขอเชื่อมต่อ</p><div class="field"><label>อีเมลหรือรหัสผู้ใช้</label><input id="modalName" placeholder="name@example.com หรือ User ID" /></div>';else if(mode==='share')html='<p>เลือกแผนที่ต้องการส่งในห้องสนทนานี้</p><div class="field"><label>Workout Plan</label><select id="modalName"><option>Chest & Triceps</option><option>Full Body Beginner</option><option>Light Cardio & Mobility</option></select></div><p>ผู้รับจะสามารถดูและบันทึกสำเนาไปปรับแต่งได้</p>';else html='<p>เริ่มบทสนทนากับ Trainer หรือ Friend</p><div class="field"><label>เลือกผู้ติดต่อ</label><select id="modalName"><option>Trainer T1</option><option>Trainer T2</option><option>Friend F1</option><option>Friend F2</option></select></div>';
 $('#modalContent').innerHTML=html;$('#modalConfirm').textContent=mode==='friend'?'Send Request':mode==='share'?'Share Plan':mode==='chat'?'Open Chat':'Create';$('#modalBackdrop').classList.add('show');setTimeout(()=>$('#modalName')?.focus(),50)}
function closeModal(){$('#modalBackdrop').classList.remove('show');modalMode=''}
$('#modalConfirm').addEventListener('click',()=>{const val=$('#modalName')?.value?.trim();if(modalMode==='group'){if(!val){showToast('กรุณาตั้งชื่อกลุ่มก่อน');return}const id='g'+Date.now();conversations.push({id,type:'group',name:val,initial:'G',role:'Group · New group',time:'ตอนนี้',preview:'เริ่มการสนทนาใหม่',unread:0,online:false,messages:[]});renderAllLists();selectConversation(id);showToast('สร้าง Group Chat ตัวอย่างแล้ว')}else if(modalMode==='friend'){if(!val){showToast('กรุณากรอกอีเมลหรือ User ID');return}showToast('ส่งคำขอเป็นเพื่อน (ตัวอย่าง) แล้ว')}else if(modalMode==='share'){const c=conversations.find(x=>x.id===activeId);c.messages.push({from:'me',text:'แชร์แผน: '+val,time:'ตอนนี้'});c.preview='แชร์แผน: '+val;renderMessages(c);renderAllLists();showToast('แชร์ Workout Plan ตัวอย่างแล้ว')}else if(modalMode==='chat'){const c=conversations.find(x=>x.name===val);if(c)selectConversation(c.id)}closeModal()});
$('#modalClose').onclick=closeModal;$('#modalCancel').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});
/* [แก้] ลบ $('#sharePlan').onclick และ $('#attachBtn').onclick เดิมที่เปิดหน้าต่างแชร์แผนออกจากบรรทัดนี้ (ไปตั้งใหม่ในส่วน "แนบไฟล์" ด้านล่าง) */
$('#createGroup').onclick=()=>openModal('group');$('#addFriend').onclick=()=>openModal('friend');$('#newChat').onclick=()=>openModal('chat');$('#chatMore').onclick=()=>showToast('เมนูเพิ่มเติม: แจ้งเตือน · ดูโปรไฟล์ · ออกจากกลุ่ม');
$('#aiTop').onclick=()=>selectConversation('ai');$('#aiSidebar').onclick=()=>selectConversation('ai');$('#aiDrawer').onclick=()=>selectConversation('ai');
$('#menuBtnInside').onclick=openDrawer;$('#drawerClose').onclick=closeDrawer;$('#overlay').onclick=closeDrawer;$('#drawerGroup').onclick=()=>{closeDrawer();openModal('group')};$('#drawerFriend').onclick=()=>{closeDrawer();openModal('friend')};
['#searchDesktop','#searchMobile'].forEach(s=>$(s).addEventListener('input',renderAllLists));
['#filtersDesktop','#filtersMobile'].forEach(s=>$(s).addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.filter-row').forEach(row=>row.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter)));renderAllLists()}));
/* [แก้] ส่งได้แม้ไม่มีข้อความ ถ้ามีไฟล์แนบ + เก็บไฟล์ไว้กับข้อความ */
$('#messageForm').addEventListener('submit',e=>{e.preventDefault();const input=$('#messageInput');const text=input.value.trim();if(!text&&!pendingFiles.length)return;if(aiBusy)return;const c=conversations.find(x=>x.id===activeId);const files=pendingFiles;pendingFiles=[];renderPreview();c.messages.push({from:'me',text,files,time:'ตอนนี้'});c.preview=text||'📎 '+files.map(f=>f.name).join(', ');c.time='ตอนนี้';renderMessages(c);renderAllLists();input.value='';input.style.height='42px';if(c.type==='ai')askAI(c);});
$('#messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#messageForm').requestSubmit()}});
$('#messageInput').addEventListener('input',e=>{e.target.style.height='42px';e.target.style.height=Math.min(e.target.scrollHeight,115)+'px'});
let touchStartX=0,touchStartY=0;document.addEventListener('touchstart',e=>{if(!e.touches.length)return;touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;if(window.innerWidth>760||Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.3)return;if(touchStartX<28&&dx>0)openDrawer();else if($('#drawer').classList.contains('open')&&dx<0)closeDrawer()},{passive:true});
window.addEventListener('resize',()=>{if(window.innerWidth>760)closeDrawer()});

/* ============================================================
   [เพิ่ม] แนบไฟล์ / รูปภาพ (ปุ่ม + และปุ่ม "ส่งไฟล์" ที่หัวแชต)
   ============================================================ */
let pendingFiles=[];
const MAX_FILES=6,MAX_MB=10;
const fmtSize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';
function toggleAttachMenu(show){$('#attachMenu').classList.toggle('show',show)}
$('#attachBtn').onclick=e=>{e.stopPropagation();toggleAttachMenu(!$('#attachMenu').classList.contains('show'))};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#attachMenu,#attachBtn'))toggleAttachMenu(false)});
function openPicker(accept){
  const fi=$('#fileInput');
  if(accept)fi.setAttribute('accept',accept);else fi.removeAttribute('accept');
  toggleAttachMenu(false);fi.click();
}
$('#pickImage').onclick=()=>openPicker('image/*');
$('#pickFile').onclick=()=>openPicker('');
$('#pickCamera').onclick=()=>{toggleAttachMenu(false);$('#cameraInput').click()};
$('#sharePlan').onclick=()=>openPicker('');
function addFiles(list){
  for(const f of list){
    if(pendingFiles.length>=MAX_FILES){showToast('แนบได้สูงสุด '+MAX_FILES+' ไฟล์');break}
    if(f.size>MAX_MB*1048576){showToast(f.name+' ใหญ่เกิน '+MAX_MB+' MB');continue}
    pendingFiles.push({name:f.name,size:f.size,type:f.type||'',url:URL.createObjectURL(f)});
  }
  renderPreview();
}
$('#fileInput').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});
$('#cameraInput').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});
function renderPreview(){
  const root=$('#attachPreview');root.innerHTML='';
  pendingFiles.forEach((f,i)=>{
    const d=document.createElement('div');d.className='att-chip';
    d.innerHTML=(f.type.startsWith('image/')?`<img src="${f.url}" alt="">`:'<div class="ficon">📄</div>')+`<div><span class="n">${escapeHTML(f.name)}</span><small>${fmtSize(f.size)}</small></div><button type="button" class="rm" aria-label="Remove">✕</button>`;
    d.querySelector('.rm').onclick=()=>{URL.revokeObjectURL(f.url);pendingFiles.splice(i,1);renderPreview()};
    root.append(d);
  });
}
function filesHTML(m){
  if(!m.files||!m.files.length)return '';
  return '<div class="msg-att">'+m.files.map(f=>f.type.startsWith('image/')
    ?`<a href="${f.url}" target="_blank"><img src="${f.url}" alt="${escapeHTML(f.name)}"></a>`
    :`<a href="${f.url}" download="${escapeHTML(f.name)}">📄 ${escapeHTML(f.name)} · ${fmtSize(f.size)}</a>`).join('')+'</div>';
}

/* ============================================================
   AI Coach — ใช้ Gemini เป็นหลัก + ชุดคำตอบสำรอง (AI_RULES)
   ใส่ API Key ที่ตัวแปร API_KEY ด้านล่าง ถ้าเว้นว่างหรือเรียกไม่ได้ จะใช้คำตอบสำรองแทน
   อยากเพิ่มคำตอบ: เพิ่มรายการใน AI_RULES (k = คำสำคัญ, r = คำตอบที่สุ่มใช้)
   ============================================================ */

let aiBusy=false,lastAIReply='';
function setAIBusy(v){aiBusy=v;$('#sendBtn').disabled=v;}
function pickReply(list){
  let r=list[Math.floor(Math.random()*list.length)];
  if(list.length>1&&r===lastAIReply)r=list[(list.indexOf(r)+1)%list.length];
  return r;
}
function localCoachReply(text){
  const t=text.toLowerCase();
  const rule=AI_RULES.find(x=>x.k.some(w=>t.includes(w)));
  const reply=pickReply(rule?rule.r:AI_FALLBACK);
  lastAIReply=reply;
  return reply;
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let thinkOK=true;   // ลดเวลา "คิด" ของโมเดลให้ตอบเร็วขึ้น ถ้าโมเดลไม่รองรับจะปิดเองอัตโนมัติ
async function callGeminiStream(contents,onText){
  let lastErr=new Error('เรียก AI ไม่สำเร็จ');
  for(const model of AI_MODELS){
    for(let i=0;i<3;i++){
      const generationConfig={temperature:0.7,maxOutputTokens:3000};
      if(thinkOK)generationConfig.thinkingConfig={thinkingLevel:'low'};
      let r;
      try{
        r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':streamGenerateContent?alt=sse',{
          method:'POST',
          headers:{'Content-Type':'application/json','x-goog-api-key':API_KEY},
          body:JSON.stringify({systemInstruction:{parts:[{text:SYSTEM_PROMPT}]},contents,generationConfig})
        });
      }catch(e){lastErr=e;await sleep(1000*(i+1));continue;}
      if(!r.ok){
        let msg='HTTP '+r.status;
        try{const d=await r.json();if(d.error&&d.error.message)msg=d.error.message;}catch(e){}
        lastErr=new Error(msg);
        if(r.status===400&&thinkOK&&/think/i.test(msg)){thinkOK=false;i--;continue;}  // โมเดลไม่รองรับตัวเลือกนี้ ปิดแล้วลองใหม่
        if(r.status===404)break;
        if(r.status===503||r.status===429||/high demand/i.test(msg)){await sleep(1200*(i+1));continue;}
        throw lastErr;
      }
      let acc='';
      try{
        const reader=r.body.getReader(),dec=new TextDecoder();let buf='';
        for(;;){
          const {done,value}=await reader.read();if(done)break;
          buf+=dec.decode(value,{stream:true});
          const lines=buf.split('\n');buf=lines.pop();
          for(const ln of lines){
            if(!ln.startsWith('data:'))continue;
            const j=ln.slice(5).trim();if(!j||j==='[DONE]')continue;
            try{
              const d=JSON.parse(j);
              const parts=d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts;
              if(parts){acc+=parts.map(p=>p.thought?'':(p.text||'')).join('');onText(acc);}
            }catch(e){}
          }
        }
      }catch(e){lastErr=e;}
      if(acc.trim())return acc.trim();   // ได้คำตอบ (แม้สตรีมจะหลุดกลางทางก็เก็บเท่าที่ได้)
      lastErr=new Error('ไม่ได้รับคำตอบ');break;
    }
  }
  throw lastErr;
}
async function askAI(c){
  setAIBusy(true);
  const pending={from:'them',text:'กำลังคิด...',time:'ตอนนี้',pending:true};
  c.messages.push(pending);
  if(activeId===c.id)renderMessages(c);
  const lastUser=[...c.messages].reverse().find(m=>m.from==='me');
  let finalText='',raf=0;
  if(API_KEY){
    try{
      /* [แก้] ถ้ามีไฟล์แนบ ส่งชื่อไฟล์ให้ AI รู้ (ยังอ่านเนื้อหาไฟล์ไม่ได้) */
      const contents=c.messages.filter(m=>m!==pending&&!m.pending&&!m.error&&(m.from==='me'||m.from==='them')).slice(-14).map(m=>({role:m.from==='me'?'user':'model',parts:[{text:(m.text||'')+(m.files&&m.files.length?'\n[ผู้ใช้แนบไฟล์: '+m.files.map(f=>f.name).join(', ')+']':'')}]}));
      while(contents.length&&contents[0].role!=='user')contents.shift();
      finalText=await callGeminiStream(contents,t=>{
        pending.text=t;pending.pending=false;
        if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(activeId===c.id)renderMessages(c);});
      });
    }catch(e){console.error('Gemini error:',e);finalText='';}
  }
  if(!finalText){
    await sleep(700+Math.random()*600);
    finalText=localCoachReply(lastUser?lastUser.text:'');
    if(API_KEY)finalText+='\n\n(โหมดสำรอง: เชื่อมต่อ AI ไม่ได้ชั่วคราว)';
  }
  c.messages=c.messages.filter(m=>m!==pending);
  c.messages.push({from:'them',text:finalText,time:'ตอนนี้'});
  c.preview=finalText.slice(0,40);
  c.time='ตอนนี้';
  setAIBusy(false);
  if(activeId===c.id)renderMessages(c);
  renderAllLists();
}

renderAllLists();selectConversation('t1');
