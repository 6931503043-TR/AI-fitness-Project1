name: Deploy Prototype to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "Prototype/**"
      - "docs/prototypes/unified/**"
      - ".github/workflows/deploy-prototype-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "prototype-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Prototype site
        run: |
          mkdir -p _site/Prototype _site/docs/prototypes/unified
          cp Prototype/index.html _site/Prototype/index.html
          cp -R docs/prototypes/unified/. _site/docs/prototypes/unified/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
