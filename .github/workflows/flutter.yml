name: Flutter

# Checks the complete Flutter project in ai/motion_proto and builds APKs.
# (app/forge is not a complete project yet; see forge-check.yml)

on:
  push:
    branches: ["main"]
    paths:
      - "ai/motion_proto/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "ai/motion_proto/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion_proto:
    name: motion_proto (analyze, test, build APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai/motion_proto

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test (only if a test directory exists)
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory; skipping."
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: motion_proto-apks
          path: ai/motion_proto/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
